name: delivery_design_system
description: Shared red/white brand system for the Delivery mobile app and two web portals.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Rubik, the face of the 2026-08 Figma redesign, bundled so every client renders it identically
  # rather than falling back to whatever the device ships. Static instances rather than the variable
  # font, because Flutter maps FontWeight to a bundled weight table directly but drives a variable
  # font's wght axis only through per-TextStyle FontVariation — and the theme speaks FontWeight.
  #
  # SIL OFL 1.1; the licence text ships beside the files as fonts/OFL.txt.
  #
  # Declared in the PACKAGE, so clients reference the family as "packages/delivery_design_system/Rubik"
  # via DeliveryTypography.fontFamily rather than each bundling their own copy.
  fonts:
    - family: Rubik
      fonts:
        - asset: fonts/Rubik-Regular.ttf
          weight: 400
        - asset: fonts/Rubik-Medium.ttf
          weight: 500
        - asset: fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: fonts/Rubik-Bold.ttf
          weight: 700
        - asset: fonts/Rubik-ExtraBold.ttf
          weight: 800
