# Serves the built Flutter Web apps on fixed ports for local testing.
#
# Fixed ports matter: a Keycloak client's redirect URIs are an allow-list, and `flutter run` picks a
# random port every time, which would fail the redirect_uri check on every run. Ports 5010-5012 are
# used because the lending stack on this machine already holds 8080-8095.
#
#   cd clients/apps/delivery_portal && flutter build web --release
#   cd clients && docker compose -f docker-compose.web.yml up -d
#
# Then: Delivery Portal http://127.0.0.1:5010   Mobile app http://127.0.0.1:5012
#       Public website  http://127.0.0.1:5014
#
# One portal, not three. Merchant, Carrier and Backoffice were separate builds on 5010, 5011 and
# 5013; they are one bundle now and the roles in your token decide what you see. 5011 and 5013 are
# free.
#
# USE 127.0.0.1, NOT localhost. Docker Desktop on WSL2 binds ::1 ahead of the loopback proxy and
# Chrome resolves localhost to ::1 first, so `localhost` gives ERR_CONNECTION_RESET.
#
# CANVASKIT IS SERVED LOCALLY, and must stay that way. Each app has a web/flutter_bootstrap.js that
# sets canvasKitBaseUrl to "canvaskit/". Without it Flutter fetches its renderer from
# https://www.gstatic.com/flutter-canvaskit/, which stalls on this machine (15s timeout, versus
# 0.17s locally) — and because CanvasKit *is* the renderer, the page is blank until it resolves.
# The symptom looks like a broken app or a slow login, especially after the Keycloak redirect,
# which forces a fresh page load.
#
# After redeploying a bundle, hard-reload once (Ctrl+F5). These builds register a service worker,
# so a normal refresh can serve the previous version.
#
# For day-to-day development prefer hot reload instead, pinning the same port:
#   flutter run -d chrome --web-port 5010

name: delivery-web

services:
  # One portal on 5010, where there used to be three on 5010, 5011 and 5013. Merchant, Carrier and
  # Backoffice are the same bundle now; which one you get is decided by the roles in your token.
  #
  # 5010 is kept rather than picked fresh because it is the port already registered on the Keycloak
  # client and written into every note in this repo.
  delivery-portal:
    image: nginx:alpine
    container_name: delivery-portal
    ports:
      - "5010:80"
    volumes:
      - ./apps/delivery_portal/build/web:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro

  # The mobile app, served as a web build so the design and the flows can be walked through in a
  # browser without an emulator or a handset.
  #
  # Unlike the two portals, this app's redirect URI is a COMPILE-TIME constant (its default is the
  # custom scheme com.delivery.app://oauth2redirect, for the real mobile targets). So the web build
  # has to be told, and rebuilt if the host ever changes:
  #
  #   cd apps/mobile_app && flutter build web --release \
  #     --dart-define=KEYCLOAK_ISSUER=http://127.0.0.1:8180/realms/delivery-platform \
  #     --dart-define=API_BASE_URL=http://127.0.0.1:8100 \
  #     --dart-define=OIDC_REDIRECT_URL=http://127.0.0.1:5012/
  #
  # The issuer must match KEYCLOAK_PUBLIC_URL in infra/.env exactly — a token carries one issuer,
  # and a mismatch fails validation on every call rather than at login.
  #
  # No sensors are involved: the rider's GPS is a simulated random walk in rider_home_screen.dart,
  # not a geolocation plugin, so nothing prompts for location and nothing needs stubbing.
  # The public site: what somebody sees before they are anybody.
  #
  # Sign in points at the two portals, Register starts an onboarding application, and /admin is
  # served but linked from nowhere — an administrator types it. Plain nginx over four static files:
  # this is the one page a stranger loads before they have any reason to trust us, and it should be
  # quick and it should not break.
  website:
    image: nginx:alpine
    container_name: delivery-website
    ports:
      - "5014:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./website/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mobile-app:
    image: nginx:alpine
    container_name: delivery-mobile-app
    ports:
      - "5012:80"
    volumes:
      - ./apps/mobile_app/build/web:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
