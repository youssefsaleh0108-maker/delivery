server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Single-page app: every path must fall back to index.html so the OIDC callback
    # (/?code=...&state=...) loads the app instead of 404ing before it can redeem the code.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Flutter bootstrap and service worker must never be cached, or a rebuilt app keeps
    # serving the previous bundle until a hard refresh.
    location ~* (flutter_service_worker\.js|index\.html|flutter_bootstrap\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
}
