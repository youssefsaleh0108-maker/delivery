# The public site.
#
# /admin is served from its own file rather than redirected, so the address stays /admin in the bar
# and nothing in the page source points at the Backoffice port until somebody clicks.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Emit relative redirects. TLS is terminated at Traefik, so nginx only ever sees plain HTTP
    # and would build the `/app/` redirect below as an absolute http:// URL — sending a phone that
    # scanned the QR code out to cleartext and back again. A path-only Location is resolved by the
    # browser against the scheme it is already on, which is the one it should stay on.
    absolute_redirect off;
    index index.html;

    # PT-11 caching. Nothing on this site is content-hashed: index.html, register.js, site.js,
    # portal-link.js, register.css and config.js all keep their names forever, so whatever a
    # browser cached is what it keeps serving. The site went stale for returning visitors exactly
    # that way, and config.js is the worst of them — a cached copy points the register page at the
    # previous deployment's API host, which fails in a way that looks like the API being down, and
    # every "Sign in" link at the previous deployment's portal.
    #
    # So the default for this server is no-cache: revalidate every time, and let the ETag make an
    # unchanged file a cheap 304. It is not no-store — there is nothing secret here, and the
    # conditional request is what keeps the site fast.
    #
    # Server level, so every location INHERITS it — but only a location that sets no add_header of
    # its own does. The two below that do (the APK, the fonts and images) each repeat or replace it
    # deliberately; a new location with an add_header must do the same.
    add_header Cache-Control "no-cache";

    # The exception: the things that are immutable in practice. Rubik is a versioned file that
    # changes name when it changes, and the screenshots and icons are replaced by new files rather
    # than edited in place. A month, not a year: these are still mutable in principle, and a wrong
    # answer that expires in a month is recoverable without asking anyone to clear their cache.
    #
    # No `expires` directive beside this. `expires` writes its own Cache-Control, add_header appends
    # a second one, and the response goes out with two contradictory values.
    location ~* \.(?:woff2|woff|ttf|otf|eot|png|jpe?g|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Not a security control — the Backoffice checks the BACKOFFICE role on every request — but
    # there is no reason to advertise the door, and every reason not to invite the attempts.
    location = /admin  { try_files /admin.html =404; }
    location = /admin/ { try_files /admin.html =404; }

    # Applying, on its own page rather than in a dialog. Served without the .html so the address is
    # something a person can be told over the phone and type — and so a half-finished application
    # survives a reload, which is the whole reason it stopped being a sheet over the landing page.
    location = /register  { try_files /register.html =404; }
    location = /register/ { try_files /register.html =404; }

    # The app itself.
    #
    # /app is the one address the QR code on the landing page encodes and the one every "Download"
    # on the site points at, so it has to be short, stable and typeable. It is a file, not a page:
    # the deploy step drops the Android build at app/youdrop.apk under this root and nginx hands it
    # straight over.
    #
    # Content-Disposition is what makes it a download rather than something a browser tries to
    # display. Chrome on Android will install an .apk it recognises; without the header some
    # browsers render the bytes, and a page of mojibake is a worse answer than a save dialog.
    #
    # =404 rather than a fallback into index.html, deliberately. Before the APK is deployed this
    # address has nothing to give, and answering with the landing page would mean a QR scan that
    # silently loops back to the site it was scanned from — the reader would think the code was
    # broken. `add_header` only fires on a success status, so the 404 does not claim to be a file.
    location = /app {
        # nginx ships no MIME type for .apk, so without this the file would go out as text/plain.
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="youdrop.apk"';
        add_header X-Content-Type-Options nosniff;
        # The APK is replaced in place at this one address, so a cached copy is a phone installing
        # last week's build. This location sets add_header of its own, so it does NOT inherit the
        # server-level Cache-Control above and has to repeat it.
        add_header Cache-Control "no-cache";
        try_files /app/youdrop.apk =404;
    }

    # Everything else under /app/ — the raw file path included — funnels to that one address, so
    # there is a single URL to print on a QR code, log, and cache. `^~` is what stops the generic
    # location below taking the raw path first and serving the same bytes with no disposition
    # header and the wrong content type. It cannot loop: the rule above hands over a FILE from the
    # disk rather than re-entering the location table with a new URI.
    location ^~ /app/ { return 301 /app; }

    location / { try_files $uri $uri/ /index.html; }

    # Crawlers are welcome on the shopfront. Note what this file does NOT say: a Disallow line
    # naming the staff door would publish it in the one file every crawler and every scanner reads
    # first, which is the opposite of the intent. It would also defeat itself — a disallowed page is
    # never fetched, so the noindex tag on it is never seen, and the address can still end up
    # indexed from any external link. The tag keeps that page out of results; this file stays quiet.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }
}
