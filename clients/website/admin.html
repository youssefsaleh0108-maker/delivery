<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platform administration</title>
  <!--
    Not in the sitemap, not in the navigation, and not indexed. An administrator gets here by
    typing /admin.

    Worth being precise about what this is and is not. It is NOT a security control: the Backoffice
    enforces the BACKOFFICE realm role on every request, and hiding a link protects nothing on its
    own. What it does is keep the door out of a public shopfront — there is no reason to advertise
    an entrance the public has no business using, and every reason not to invite the attempts.
  -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="site.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      padding: clamp(28px, 4vw, 44px);
      width: min(420px, 100%);
      text-align: center;
    }
    .panel h1 { font-size: 25px; margin-bottom: 8px; }
    .panel p { color: var(--muted); margin: 0 0 26px; }
    .lock {
      width: 46px; height: 46px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--brand-soft);
      display: grid;
      place-items: center;
      color: var(--brand);
      font-size: 22px;
    }
    .back { display: block; margin-top: 18px; font-size: 13.5px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="panel">
    <div class="lock" aria-hidden="true">&#9679;</div>
    <h1>Platform administration</h1>
    <p>Staff only. You will be asked to sign in.</p>
    <a class="primary wide" href="http://127.0.0.1:5011">Open the Backoffice</a>
    <a class="back" href="/">Back to the site</a>
  </main>
</body>
</html>
