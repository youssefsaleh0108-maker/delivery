name: carrier_portal
description: The delivery company's own view of its operation on the platform.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  delivery_core:
    path: ../../packages/delivery_core
  delivery_design_system:
    path: ../../packages/delivery_design_system
  # A carrier reads this in the same market the merchants do.
  delivery_l10n:
    path: ../../packages/delivery_l10n
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  # Holds the chosen language across reloads; there is nowhere else on web that survives one.
  flutter_secure_storage: ^9.2.2
  # Reads the app's own origin for the OIDC redirect — see main.dart.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
