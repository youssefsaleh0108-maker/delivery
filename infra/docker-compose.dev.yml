  # ------------------------------------------------------------------------------- observability
  #
  # Jaeger has had the traces since Phase 0; this is the other half. Every service has published
  # /actuator/prometheus all along and nothing collected it, so "is it slower than last week" was a
  # question nobody could answer.
volumes:
  prometheus-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:

  # Certificates and their private keys. Survives a recreate, so a restart does not re-issue and
  # spend the Let.s Encrypt rate limit.
  traefik-acme:

networks:
  delivery:
    name: delivery
    driver: bridge
