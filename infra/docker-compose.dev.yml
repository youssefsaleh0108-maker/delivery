      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/delivery-platform
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      CONNECTOR_SETTINGS_URL: http://connector-settings:8109
      # STILL DEV_PASSTHROUGH, which mails each "SMS" to a test inbox rather than sending one.
      # The SMS vendor is an open decision (see the README), and MontyMobile and Twilio are both
      # implemented and waiting on credentials — switching is a Backoffice change once those exist,
      # not a redeploy.
      #
      # Simulated SMS goes to the same sink as the mail, so a tester can register with a made-up
      # number and still read the message. SMS_TEST_INBOX is a fake address INSIDE mailpit — it
      # never leaves the box, so it does not have to be a mailbox anybody owns.
      #
      # Against a real relay it would be a real send to a real mailbox, so change it at the same
      # time you change SMTP_HOST.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMS_TEST_INBOX: ${SMS_TEST_INBOX:-sms-test-inbox@dev.local}
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      mailpit:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [delivery]

