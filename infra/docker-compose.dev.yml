      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [delivery]

  # ---------------------------------------------------------------------------- joining
  #
  # Its own deployable for two reasons no other service has: the only write endpoint reachable
  # with no token at all, and the only workflow engine. Both are things worth being able to
  # restart, scale and rate-limit on their own.
  onboarding-service:
    image: ${REGISTRY_NS:-youssefsaleh0108}/delivery-onboarding-service:${IMAGE_TAG:-main}
    container_name: delivery-onboarding-service
    mem_limit: 384m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8117
      # Heap tracks mem_limit, not the host. SerialGC and no C2 because these are small heaps on a
      # shared box: the throughput collectors cost more in threads and metaspace than they return.
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-local-config-secret}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/delivery-platform
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      # This account can create users and register delivery companies, which makes it the most
      # powerful credential in the stack. From Vault in a deployment, never from a compose file.
      KEYCLOAK_CLIENT_ID: onboarding-service
      KEYCLOAK_CLIENT_SECRET: ${ONBOARDING_CLIENT_SECRET:-onboarding-service-dev-secret}
      ORDER_MANAGER_URL: http://order-manager:8101
      # Where one-time codes and decision emails are handed off. Without it the default is
      # localhost, which inside a container is this service talking to itself.
      NOTIFICATIONS_MANAGER_URL: http://notifications-manager:8104
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [delivery]

  # ------------------------------------------------------------------------------- observability
  #
  # Jaeger has had the traces since Phase 0; this is the other half. Every service has published
  # /actuator/prometheus all along and nothing collected it, so "is it slower than last week" was a
  # question nobody could answer.
volumes:
  prometheus-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:

networks:
  delivery:
    name: delivery
    driver: bridge
