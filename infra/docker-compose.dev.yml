  # ---------------------------------------------------------------- notification layer (Phase 3)
  #
  # Six deployables. Each channel is now ONE process that both renders and sends: the former
  # mail-worker, push-worker and sms-worker were merged into their connectors, which halved the
  # JVM count on this box.
  #
  # What that gave up is real and was the original reason for the split. Rendering is fast and
  # CPU-bound; a connector blocks on a third party whose latency nobody here controls. In one
  # process a degraded vendor consumes the thread budget that rendering needed, and provider
  # credentials now share a heap with template rendering. Per-channel isolation survives — a wedged
  # SMS vendor still cannot stall email or push — but within a channel the two failure modes are
  # now one.

  connector-settings:
    image: ${IMAGE_REPO:-ghcr.io/youssefsaleh0108-maker}/${IMAGE_NAME_PREFIX:-}connector-settings:${IMAGE_TAG:-main}
    container_name: delivery-connector-settings
    mem_limit: 256m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8109
      # Heap tracks mem_limit, not the host. SerialGC and no C2 because these are small heaps on a
      # shared box: the throughput collectors cost more in threads and metaspace than they return.
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-local-config-secret}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/delivery-platform
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [delivery]

  notifications-manager:
    image: ${IMAGE_REPO:-ghcr.io/youssefsaleh0108-maker}/${IMAGE_NAME_PREFIX:-}notifications-manager:${IMAGE_TAG:-main}
    container_name: delivery-notifications-manager
    mem_limit: 320m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8104
