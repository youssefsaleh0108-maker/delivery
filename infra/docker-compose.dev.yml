  sms-connector:
    image: ${IMAGE_REPO:-ghcr.io/youssefsaleh0108-maker}/${IMAGE_NAME_PREFIX:-}sms-connector:${IMAGE_TAG:-main}
    container_name: delivery-sms-connector
    mem_limit: 320m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8112
      # Heap tracks mem_limit, not the host. SerialGC and no C2 because these are small heaps on a
