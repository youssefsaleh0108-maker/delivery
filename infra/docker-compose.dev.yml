      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      # A browser WebSocket is subject to origin checks like any fetch. Getting this wrong shows up
      # as a silent connection failure, not a CORS error.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # Owns in_app_messages in the same schema, so it must not race the manager's migrations.
      notifications-manager:
        condition: service_healthy
    networks: [delivery]
  email-connector:
    image: ${IMAGE_REPO:-ghcr.io/youssefsaleh0108-maker}/${IMAGE_NAME_PREFIX:-}email-connector:${IMAGE_TAG:-main}
    container_name: delivery-email-connector
    mem_limit: 320m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8110
      # Heap tracks mem_limit, not the host. SerialGC and no C2 because these are small heaps on a
      # shared box: the throughput collectors cost more in threads and metaspace than they return.
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-local-config-secret}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/delivery-platform
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      CONNECTOR_SETTINGS_URL: http://connector-settings:8109
      # DEFAULTS TO THE MAILPIT SINK, so this environment sends nothing to real people and a tester
      # can register with any address or phone number they like.
      #
      # To use a real relay, set these four in .env and restart this service. Setting SMTP_HOST is
      # the switch; the rest follow it. SMTP_PASSWORD is read from Vault at secret/email-connector
      # in the design (Section 8) and from the environment here, because this box runs Vault in dev
      # mode and would lose it on every restart.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Off for the sink, which has neither. STARTTLS on 587 or implicit TLS on 465 for a real
      # relay — sending to one without either puts the credentials on the wire in clear text.
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # The envelope sender. A real relay rejects or spam-files mail whose From is not a domain it
      # is authorised for, which is the usual cause of "the connector says sent and nothing arrives".
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@mydelivery.local}
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      mailpit:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [delivery]

  push-connector:
