# The dev environment, as deployed on the Contabo box. Generated from docker-compose.yml and kept
# beside it — that file stays the laptop stack, this one is what runs on the server.
#
# Four differences, and they are the whole point of a separate file:
#
#   1. No `build:`. Images are pulled at ${IMAGE_TAG}, because the box has no source checkout and
#      compiling seventeen JVMs on 5.8 GB is not something to attempt.
#
#      They come from ghcr.io, which is where CI actually publishes. It used to say Docker Hub, and
#      that was the bug: the pipeline pushes to Docker Hub only when DOCKERHUB_TOKEN is set, skips
#      the step silently when it is not, and reports success either way. With the secret absent,
#      every green build for days published to a registry nothing pulled from, while this file kept
#      deploying images that were by then three days stale. A deploy that quietly does nothing is
#      worse than one that fails, because the run is green and the version looks current.
#
#      Both registries are still reachable, and they name images differently — ghcr.io allows a path
#      (youssefsaleh0108-maker/product-service) where a Hub namespace is flat and needs the repo
#      itself prefixed (youssefsaleh0108/delivery-product-service). Hence two variables rather than
#      one. To go back to Docker Hub, set both in .env and add the secret to the repository:
#
#          IMAGE_REPO=youssefsaleh0108
#          IMAGE_NAME_PREFIX=delivery-
#
#      The ghcr.io packages are public, so no pull credential is needed here. That is a deliberate
#      trade: the images carry no secrets — config comes from Vault and the environment at runtime —
#      but anyone can pull them. Make the packages private and give the host a read token if that
#      is not wanted.
#   2. `mem_limit` on everything. Without ceilings the first service to warm up takes the memory
#      the last one needs, and what dies is decided by whichever the kernel reaches first.
#   3. Three ports face the internet, not thirty-three. See below.
#   4. No Jaeger, no Mailpit, no Core Banking Simulator. Tracing is off to save memory; the other
#      two are fakes, and this environment integrates with a real SMTP relay and a real bank.
#
# PUBLIC PORTS — 8100 Traefik (the API), 8180 Keycloak, 9010 MinIO.
#
# Keycloak and MinIO are public because clients reach them DIRECTLY, not through Traefik: the apps
# authenticate against Keycloak over OIDC, and presigned image URLs are signed for the MinIO host
# and fetched by the browser. Routing either through 8100 would break the signature or the issuer.
#
# Everything else is on the internal network or bound to loopback. The connectors are the reason
# that matters: /api/connector/send takes no user token, so a published port on 8110-8113 is
# "send an arbitrary SMS" for anyone who finds the IP. Reach any internal service with an SSH
# tunnel:
#
#   ssh -L 15673:localhost:15673 -L 5433:localhost:5433 user@<box>
#
# THIS IS A TEST ENVIRONMENT ON A PUBLIC IP, and it now sends REAL EMAIL. The relay in .env is a
# real one, so a bad recipient in test data reaches an actual mailbox, and the SMS dev-passthrough
# provider mails every simulated message there too. Vault still runs in dev mode. Do not put real
# customer records here.

name: delivery-dev

services:
  # ---------------------------------------------------------------- data layer
  postgres:
    image: postgis/postgis:17-3.5
    container_name: delivery-postgres
    mem_limit: 384m
    restart: unless-stopped
    # Loopback only — psql or a GUI client over an SSH tunnel.
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: ${POSTGRES_USER:-delivery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery}
      # Read by init/04-config-role-password.sh, which aligns the config_server role with what
      # the Config Server actually presents. Without it that role keeps the dev password from
      # 03-config-properties.sql and every service dies at boot on a 500 from the Config Server.
      CONFIG_DB_PASSWORD: ${CONFIG_DB_PASSWORD:-config_server_dev_pw}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on an empty data dir. `docker compose down -v` to re-run after editing.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery} -d delivery"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [delivery]

  # The dev mail and SMS sink.
  #
  # Everything the platform "sends" lands here instead of in somebody's inbox: verification codes,
  # order mail, and the simulated SMS the dev provider redirects. That is what makes it safe to
  # register with made-up addresses and phone numbers, and it is why this compose file defaults the
  # SMTP settings below to this container rather than to a relay.
  #
  # Switching to real mail is a deliberate act: set SMTP_HOST, SMTP_USER, SMTP_PASSWORD and
  # EMAIL_FROM in .env and restart email-connector. Nothing else changes.
  # The Backoffice / Merchant / Carrier portal.
  #
  # One Flutter Web app for all three, and what somebody sees is decided by the realm roles in
  # their token rather than by which app they opened. This is where an onboarding application is
  # approved — until it existed, approving a rider or a merchant meant a curl with a BACKOFFICE
  # token, which is not a thing anybody should have to do to run a business.
  #
  # Stock nginx over a mounted build rather than an image of its own. The build is static output
  # with no server side to it, and an image would mean a registry round trip on every copy change.
  # Refresh it with infra/deploy-portal.sh.
  # The public website: landing page, partner registration, and the unadvertised /admin door.
  #
  # Static files over stock nginx, the same shape as the portal — there is no build step and no
  # server side, so deploying it is a file copy.
  website:
    image: nginx:1.27-alpine
    container_name: delivery-website
    mem_limit: 64m
    restart: unless-stopped
    volumes:
      - ./website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./website/html:/usr/share/nginx/html:ro
    healthcheck:
      # 127.0.0.1, not localhost. In this image localhost resolves to ::1 first and the site listens
      # on IPv4 only, so the check reported "connection refused" against an nginx that was serving
      # every real request perfectly — a container marked unhealthy for a reason that was not real.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [delivery]

  portal:
    image: nginx:1.27-alpine
    container_name: delivery-portal
    mem_limit: 64m
    restart: unless-stopped
    # Public, like the gateway and Keycloak. It is a browser app: a tunnel would mean every
    # backoffice user needing SSH to this box.
    ports:
      - "8200:8200"
    volumes:
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./portal/web:/usr/share/nginx/html:ro
    healthcheck:
      # 127.0.0.1, not localhost: in this image localhost resolves to ::1 first and nginx listens on
      # IPv4 only, so the check reports "connection refused" against a server answering every real
      # request. Same trap the website container fell into.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [delivery]

  mailpit:
    image: axllent/mailpit:latest
    container_name: delivery-mailpit
    mem_limit: 96m
    restart: unless-stopped
    # Loopback only, over an SSH tunnel. This UI holds every verification code the platform issues,
    # in plain text, with no authentication in front of it — it is the one service here that must
    # never be reachable from the internet.
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      # Kept small on purpose: this is a test sink on a 6 GB box, not an archive.
      # Served under /mailpit on monitoring-dev, and it has to KNOW that. Stripping the prefix at the
      # proxy is not enough: the UI then asks for /api/v1/messages absolute, which on that hostname
      # matches the PLATFORM API routers and comes back 401 — so the login appears to be rejected
      # when in fact the credentials were fine and the request never reached Mailpit.
      MP_WEBROOT: /mailpit
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [delivery]

  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    mem_limit: 80m
    restart: unless-stopped
    # Loopback only — redis-cli over an SSH tunnel. Redis has no UI and no auth worth exposing.
    ports:
      - "127.0.0.1:6380:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-delivery}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-delivery}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [delivery]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: delivery-rabbitmq
    mem_limit: 224m
    restart: unless-stopped
    # Management UI on loopback only: reach it with an SSH tunnel, never from the internet. A
    # queue browser that can purge a queue is not something to publish.
    ports:
      - "127.0.0.1:15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-delivery}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [delivery]

  minio:
    image: minio/minio:latest
    container_name: delivery-minio
    mem_limit: 224m
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-delivery}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-delivery123}
    ports:
      - "9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [delivery]

  # Creates the five buckets from Section 5 with their access policies, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: delivery-minio-init
    mem_limit: 48m
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-delivery}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-delivery123}
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./minio/bootstrap.sh:/bootstrap.sh:ro
    restart: "no"
    networks: [delivery]

  # ---------------------------------------------------------------- identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: delivery-keycloak
    mem_limit: 512m
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-delivery}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-delivery}
      # Pins ONE issuer value. Clients reach Keycloak on this address while backend services reach
      # it as keycloak:8080; without this they would disagree about `iss` and every token validated
      # inside the network would be rejected. Services fetch JWKS on the internal address via
      # jwk-set-uri, which each service carries in its own application.yml.
      #
      # Set KEYCLOAK_PUBLIC_URL to the host's LAN IP when testing from a PHYSICAL PHONE — a device
      # resolves `localhost` to itself, so a localhost issuer makes login fail there while still
      # working in a desktop browser. Everything that consumes the issuer reads the same variable.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HOSTNAME_STRICT: "false"
      # Behind Traefik, Keycloak must be told to trust the forwarded headers. Without this it builds
      # every redirect and every issuer from the connection it actually sees — which is plain HTTP
      # from inside the docker network — and hands out an issuer no client can reach.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      # Mount the single realm file, not the directory: Keycloak scans everything in the import
      # path, and the README beside it is not a realm.
      - ./keycloak/realm-delivery-platform.json:/opt/keycloak/data/import/realm-delivery-platform.json:ro
      # The login theme. start-dev disables theme caching, so edits to the CSS show on refresh
      # without restarting the container.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget; Keycloak 26 exposes health on the management port 9000.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [delivery]

  # ---------------------------------------------------------------- secrets
  vault:
    image: hashicorp/vault:1.18
    container_name: delivery-vault
    mem_limit: 80m
    restart: unless-stopped
    # Dev mode: in-memory, auto-unsealed, root token fixed. LOCAL ONLY. Staging and production run
    # a real sealed Vault - who hosts and administers it is Section 12 open decision #8.
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-delivery-root-token}
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [delivery]

  # Enables AppRole, writes the read-only policy the Config Server gets, and seeds dev secrets.
  vault-init:
    image: hashicorp/vault:1.18
    container_name: delivery-vault-init
    mem_limit: 48m
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-delivery-root-token}
      CONFIG_SERVER_ROLE_ID: ${VAULT_ROLE_ID:-config-server-dev-role-id}
      CONFIG_SERVER_SECRET_ID: ${VAULT_SECRET_ID:-config-server-dev-secret-id}
      # Seeded into Vault so the values it hands out match the services compose actually started.
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-delivery}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-delivery}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-delivery123}
      # Seeded into secret/email-connector, which is the ONLY place the email connector reads its
      # relay password from. Without it every vault-init run blanks the slot.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery}
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./vault/bootstrap.sh:/bootstrap.sh:ro
      - ./vault/policies:/policies:ro
      # The Firebase service account, if one has been put on the box. Mounted rather than passed
      # as an environment variable: it is a 2 KB private key, and an env var that size is readable
      # from docker inspect and from anything that dumps the environment on a crash.
      #
      # Optional by design — the file may not exist, and bootstrap.sh falls back to the dev push
      # provider when it does not, so a fresh clone still comes up.
      - ./secrets:/run/secrets:ro
    restart: "no"
    networks: [delivery]
  config-server:
    image: ${IMAGE_REPO:-ghcr.io/youssefsaleh0108-maker}/${IMAGE_NAME_PREFIX:-}config-server:${IMAGE_TAG:-main}
    container_name: delivery-config-server
    mem_limit: 352m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8888
      # Heap tracks mem_limit, not the host. SerialGC and no C2 because these are small heaps on a
      # shared box: the throughput collectors cost more in threads and metaspace than they return.
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
      # 'composite' is what activates the JDBC + Vault composite backend (Section 6).
      CONFIG_PROFILES: composite
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-local-config-secret}
      # The properties live in Postgres, in the config schema, seeded by
      # postgres/init/03-config-properties.sql. That script runs only on an empty data directory —
      # after `docker compose down -v`, not after a restart.
      CONFIG_DB_URL: jdbc:postgresql://postgres:5432/delivery?currentSchema=config
      CONFIG_DB_USER: ${CONFIG_DB_USER:-config_server}
      CONFIG_DB_PASSWORD: ${CONFIG_DB_PASSWORD:-config_server_dev_pw}
      CONFIG_DEFAULT_LABEL: main
      VAULT_HOST: vault
      VAULT_PORT: 8200
      VAULT_SCHEME: http
      VAULT_BACKEND: secret
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-config-server-dev-role-id}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-config-server-dev-secret-id}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
    depends_on:
      # service_healthy, not service_started: the properties are read from Postgres now, and a
      # Config Server that starts against a database still running its init scripts fails on the
      # connection and takes every other service down with it.
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks: [delivery]

  # The front door.
  #
  # Replaces the Spring gateway on 8100 — the same port on purpose, because every client, every
  # dart-define and every smoke suite in this repo names it. Swapping what answers there, rather
  # than moving the door, is what makes the existing suites the acceptance test for this change.
  #
  # Routing now lives in a watched file (infra/traefik/dynamic/routes.yml) instead of a Spring
  # application: adding a service is an edit, not a rebuild and redeploy of the one component every
  # request passes through. See that file for what moved to the edge and what deliberately did not.
  traefik:
    image: traefik:v3.3
    container_name: delivery-traefik
    mem_limit: 64m
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "8100:8100"
      # Public TLS. 80 exists for the ACME challenge and to redirect to 443; nothing is served
      # over it. 8100 stays published because every deployed client addresses it by IP.
      - "80:80"
      - "443:443"
      # QUIC is UDP. Without this the advertised HTTP/3 endpoint is unreachable and every client
      # that tries it falls back to TCP after a timeout — slower than never advertising it at all.
      - "443:443/udp"
      # The dashboard and Traefik's own Prometheus metrics. Bound to the loopback interface only —
      # a routing dashboard is useful to whoever runs the platform and to nobody else, and this one
      # would otherwise be reachable from any machine on the network.
      - "127.0.0.1:8099:8099"
    volumes:
      # Read-only. Traefik never needs to write its own configuration, and a container that can
      # rewrite its own routing table is one compromise away from rerouting the platform.
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # acme.json holds the private keys for every certificate. A named volume rather than a bind
      # mount: Traefik requires it to be 0600 and a bind mount inherits the host directory mode,
      # which it then refuses to start with.
      - traefik-acme:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Deliberately NOT depends_on every service. Traefik answers 502 for a service that is not up
    # yet and starts routing the moment it is — waiting for all of them would mean the front door
    # is down whenever any one service is.
    networks: [delivery]

  # ---------------------------------------------------------------- domain services
  product-service:
    image: ${IMAGE_REPO:-ghcr.io/youssefsaleh0108-maker}/${IMAGE_NAME_PREFIX:-}product-service:${IMAGE_TAG:-main}
    container_name: delivery-product-service
    mem_limit: 384m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8103
      # Heap tracks mem_limit, not the host. SerialGC and no C2 because these are small heaps on a
      # shared box: the throughput collectors cost more in threads and metaspace than they return.
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-local-config-secret}
      # Issuer must match what Keycloak stamps into the token; JWKS is fetched internally.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/delivery-platform
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
      # Presigned image URLs are signed for this host, so it must be reachable by the CLIENT.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9010}
      # Nominatim's usage policy requires a User-Agent identifying the application; the geocoder
      # refuses to call at all while this is empty rather than borrow an identity. Set in .env.
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [delivery]

  order-manager:
    # The one service still on Docker Hub, and deliberately pinned rather than left to the default.
    #
    # It lives in its own repository with its own pipeline, and that pipeline has never published a
    # ghcr.io package under this account — there is no order-manager container package at all. So
    # the shared default would resolve to an image that does not exist and take the service down.
    #
    # This is the thing to fix before the production cutover: the service that owns orders is the
    # one whose deploys are least reproducible, and it is currently pinned to an image whose build
    # nobody can point at.
    image: youssefsaleh0108/delivery-order-manager:${IMAGE_TAG:-main}
    container_name: delivery-order-manager
    mem_limit: 320m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8101
      # Heap tracks mem_limit, not the host. SerialGC and no C2 because these are small heaps on a
      # shared box: the throughput collectors cost more in threads and metaspace than they return.
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-local-config-secret}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/delivery-platform
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
      PRODUCT_SERVICE_URL: http://product-service:8103
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      product-service:
        condition: service_healthy
