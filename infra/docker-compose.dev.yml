      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      CONNECTOR_SETTINGS_URL: http://connector-settings:8109
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [delivery]

  sms-connector:
    image: ${REGISTRY_NS:-youssefsaleh0108}/delivery-sms-connector:${IMAGE_TAG:-main}
    container_name: delivery-sms-connector
    mem_limit: 320m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8112
      # Heap tracks mem_limit, not the host. SerialGC and no C2 because these are small heaps on a
      # shared box: the throughput collectors cost more in threads and metaspace than they return.
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-local-config-secret}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/delivery-platform
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      CONNECTOR_SETTINGS_URL: http://connector-settings:8109
      # STILL DEV_PASSTHROUGH, which mails each "SMS" to a test inbox rather than sending one.
      # The SMS vendor is an open decision (see the README), and MontyMobile and Twilio are both
      # implemented and waiting on credentials — switching is a Backoffice change once those exist,
      # not a redeploy.
      #
      # With Mailpit gone this now goes through the SAME REAL RELAY as the email connector, so
      # every simulated SMS is a real email. Point SMS_TEST_INBOX at a mailbox you own.
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMS_TEST_INBOX: ${SMS_TEST_INBOX:?SMS_TEST_INBOX is required}
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [delivery]

  # ---------------------------------------------------------------- accounting (Phase 4)
  #
  # One service. The Core Banking connector and simulator are both gone — the platform runs cash on
  # delivery and pays in points, so there is no bank in the picture at all.
  #
  # Settlement still records who is owed what; delivery.accounting.settlement-mode is LEDGER_ONLY,
  # so every leg is terminal as it is written rather than waiting on a bank nobody deployed.

  accounting-service:
    image: ${REGISTRY_NS:-youssefsaleh0108}/delivery-accounting-service:${IMAGE_TAG:-main}
    container_name: delivery-accounting-service
    mem_limit: 288m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8115
      # Heap tracks mem_limit, not the host. SerialGC and no C2 because these are small heaps on a
      # shared box: the throughput collectors cost more in threads and metaspace than they return.
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-local-config-secret}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/delivery-platform
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [delivery]
  whatsapp-service:
    image: ${REGISTRY_NS:-youssefsaleh0108}/delivery-whatsapp-service:${IMAGE_TAG:-main}
    container_name: delivery-whatsapp-service
    mem_limit: 288m
    restart: unless-stopped
    environment:
      SERVER_PORT: 8116
      # Heap tracks mem_limit, not the host. SerialGC and no C2 because these are small heaps on a
      # shared box: the throughput collectors cost more in threads and metaspace than they return.
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_IMPORT: configserver:http://config-server:8888
      CONFIG_SERVER_USER: ${CONFIG_SERVER_USER:-config}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-local-config-secret}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/delivery-platform
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
      # Local dev only. In a deployment this is Meta's app secret and comes from Vault through the
      # Config Server — never from an env var in a compose file that lives in the repo.
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-local-webhook-secret}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-delivery-local-verify}
      # Stands in for WhatsApp until a real number exists. MUST be false in production.
      WHATSAPP_SIMULATOR_ENABLED: "true"
      WHATSAPP_OUTBOUND_URL: http://whatsapp-service:8116/simulator/outbound
      # Merchants connect their own numbers through the API; nothing about the number-to-merchant
      # mapping is configured here.
      ORDER_MANAGER_URL: http://order-manager:8101
      PRODUCT_SERVICE_URL: http://product-service:8103
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-delivery}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-delivery}
      # Jaeger is not deployed here. Left enabled, the OTLP exporter retries against a host that
      # does not resolve on every span and floods the log with export failures.
      OTEL_SDK_DISABLED: "true"
    depends_on:
      config-server:
