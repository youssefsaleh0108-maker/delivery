# The Backoffice / Merchant / Carrier portal, served as static files.
#
# 8200 inside the container as well as outside. The firewall on this box filters on the CONTAINER
# port, not the published one — Docker DNATs in PREROUTING before the FORWARD chain is consulted,
# so a rule naming the published port never matches. Keeping both the same is what makes the rule
# readable, and is why this does not simply listen on 80.
server {
    listen 8200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A single-page app owns its own routing, so every path that is not a real file has to return
    # index.html. Without this a refresh on any screen but the first returns 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Flutter engine and the CanvasKit wasm are content-hashed, so they can be cached hard.
    location ~* \.(js|wasm|woff2|png|svg|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html must NOT be cached, or a deploy is invisible until somebody clears their browser.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
