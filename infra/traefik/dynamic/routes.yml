# The route table, and the middlewares every request passes through.
#
# Watched and hot-reloaded: adding a service is an edit to this file, not a rebuild of the one
# component every request goes through.
#
# --------------------------------------------------------------------------------------------
# WHAT MOVED, AND WHAT DID NOT
#
# The Spring gateway validated the JWT before proxying. Traefik does not, and that is not a hole:
# every service behind it validates the token itself through platform-security, checks the issuer,
# and enforces its own role rules and its own permit-all list. The gateway's check was the second
# of two, never the only one — which is why the services each keep a permitAll list rather than
# trusting whatever arrives.
#
# The practical difference is that an unauthenticated request now reaches the service before it is
# refused, instead of being refused a hop earlier. What that costs is a little more traffic on the
# internal network. What it buys is one place where routing lives, no JVM in the request path, and
# no service that cannot be reached because the gateway has not been redeployed.
#
# What did move here, because it belongs at the edge: CORS, rate limiting, stripping injected
# identity headers, and the security headers.
# --------------------------------------------------------------------------------------------

http:
  middlewares:

    # ---------------------------------------------------------------- ops tools
    #
    # One shared login for the dev tools on monitoring-dev. The hash is bcrypt and the plaintext
    # lives only in .env on the box — it is not in this repository and must not be.
    ops-auth:
      basicAuth:
        users:
          - "ops:$2y$05$jZ..JpeOHQUdnP1p5AzPBuNp8CaAPY0WDkWiQ5mBdtZKiJtKH3caG"

    # RabbitMQ and MinIO are mounted under a path but believe they own the root of their origin,
    # so the prefix is stripped before it reaches them.
    #
    # MAILPIT IS NOT IN THIS LIST, deliberately. Stripping its prefix made its own UI ask for
    # /api/v1/messages absolute, which on this hostname matches the PLATFORM API routers and comes
    # back 401 — so the tool looked like it was rejecting a correct password when the request had
    # never reached it. It is told its webroot instead (MP_WEBROOT), so it builds its own URLs.
    strip-ops-prefix:
      stripPrefix:
        prefixes:
          - "/rabbitmq"
          - "/minio"
    platform-cors:
      headers:
        # localhost and 127.0.0.1 are different origins to a browser. Both, or one of the portals
        # silently fails every request — which is exactly the bug that is impossible to see from
        # the server side.
        #
        # The deployed origins are listed too. Without them the website's registration form fails
        # its preflight: the browser sends Origin: https://www.youdrop.shop, no rule matches, and
        # Traefik answers without an Access-Control-Allow-Origin header at all — so the request is
        # blocked in the browser and the server log shows a perfectly ordinary 200 on the OPTIONS.
        # Nothing on the server side looks wrong, which is what makes it expensive to find.
        accessControlAllowOriginListRegex:
          # Single-quoted, because in a double-quoted YAML scalar a backslash is an escape:
          # every dot here would need doubling, and one missed pair silently turns '.' into
          # "any character" — a CORS rule that quietly matches more origins than intended.
          - '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
          - '^https://(www\.)?youdrop\.shop$'
          - '^https://[a-z0-9-]+\.youdrop\.shop$'
        accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        accessControlAllowHeaders: ["*"]
        accessControlExposeHeaders: [X-Correlation-Id]
        accessControlAllowCredentials: true
        accessControlMaxAge: 3600
        addVaryHeader: true

    platform-rate-limit:
      rateLimit:
        # Matches what the Spring gateway allowed: 20/s sustained, 40 burst. Per client IP, which
        # is what Traefik can key on without Redis — the old one keyed on the resolved user where
        # it could. Coarser, and the honest trade for taking Redis out of the request path.
        average: 20
        burst: 40
        # No sourceCriterion: the default is the request's remote address, which is what is wanted.
        # An explicit `ipStrategy.depth: 0` looks like the same thing and is not — depth counts back
        # through X-Forwarded-For, so with no such header the client IP resolves to empty and the
        # limiter silently lets everything through. It did: 120 parallel requests, none refused.

    strip-identity-headers:
      headers:
        customRequestHeaders:
          # Services read identity from the validated token and nothing else, so these are already
          # ignored. Emptied anyway: defence in depth costs nothing, and the day somebody adds a
          # convenience read of X-User-Id this is what stops it being a way in.
          X-User-Id: ""
          X-User-Roles: ""

    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer

  routers:
    # ------------------------------------------------------------------ product-service (8103)
    product-service:
      # /api/admin/thumbnails is the one-off derivative backfill. Routed because an operator has to
      # be able to run it, BACKOFFICE-gated in the service because it reads and re-encodes every
      # image in the catalogue — an expensive operation nobody but the platform's own staff should
      # be able to start. A new prefix does not exist at the gateway until it is written here, and
      # this file has now caught that three times.
      rule: >-
        PathPrefix(`/api/products`) || PathPrefix(`/api/categories`)
        || PathPrefix(`/api/stores`) || PathPrefix(`/api/banners`)
        || PathPrefix(`/api/delivery-zones`) || PathPrefix(`/api/admin/thumbnails`)
      service: product-service
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # ------------------------------------------------------------------ order-manager (8101)
    order-manager:
      # /api/partner-keys is the carrier's key management; /api/partner is the machine surface those
      # keys authenticate (X-API-Key, no JWT — the service's own filter is the authentication).
      # Both landed unrouted at first: a new top-level prefix does not exist at the gateway until
      # somebody writes it here, and the failure reads as a 404 from Traefik that looks exactly
      # like "the feature was never built".
      rule: >-
        PathPrefix(`/api/orders`) || PathPrefix(`/api/butler`)
        || PathPrefix(`/api/delivery-providers`) || PathPrefix(`/api/offers`)
        || PathPrefix(`/api/partner-keys`) || PathPrefix(`/api/partner`)
      service: order-manager
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # ------------------------------------------------------------------ order-tracking (8102)
    order-tracking:
      rule: PathPrefix(`/api/tracking`)
      service: order-tracking
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # Websockets need no special handling in Traefik — it upgrades in place, where the Spring
    # gateway needed a separate ws:// route for the same path family.
    order-tracking-ws:
      rule: PathPrefix(`/ws/tracking`)
      service: order-tracking
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # ------------------------------------------------------------------ app-notification (8108)
    app-notification:
      rule: PathPrefix(`/api/notifications`)
      service: app-notification
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    app-notification-ws:
      rule: PathPrefix(`/ws/notifications`)
      service: app-notification
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # ------------------------------------------------------------------ notifications-manager (8104)
    notification-log:
      rule: PathPrefix(`/api/notification-log`) || PathPrefix(`/api/notification-rates`) || PathPrefix(`/api/notification-preferences`)
      service: notifications-manager
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # ------------------------------------------------- the coming-soon backend (added 2026-08-27)
    # Five new prefixes from the feature build. Grouped here rather than scattered so the next
    # person adding an endpoint sees the rule in one place: a controller prefix that is not routed
    # here does not exist as far as a phone is concerned — the mobile app found that out with
    # product images, and these five would have 404'd identically.
    geocoding:
      rule: PathPrefix(`/api/geocoding`)
      service: product-service
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    chat:
      rule: PathPrefix(`/api/chat`)
      service: app-notification
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    rider-money:
      rule: PathPrefix(`/api/rider`)
      service: accounting-service
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    promotions:
      rule: PathPrefix(`/api/promotions`)
      service: order-manager
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # Two services own paths under /api/notifications: App Notification serves the in-app inbox at
    # the prefix, and Notifications Manager owns the direct-send endpoints beneath it. Without this
    # router the prefix swallows them, and a backoffice call to /api/notifications/direct/push gets
    # a 404 from a service that never had that endpoint — which reads as "the feature is broken"
    # rather than "the request went to the wrong place".
    #
    # Traefik ranks by rule length, so the longer rule would already win. The priority is explicit
    # anyway: leaving a routing decision this consequential to an implicit tie-break is what shadowed
    # the endpoint to begin with, and a future edit to either rule could silently flip it back.
    notification-direct:
      rule: PathPrefix(`/api/notifications/direct`)
      service: notifications-manager
      priority: 100
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # The DLR callback. A carrier's delivery receipt arrives with no token — it cannot have one —
    # and is authenticated by a signature instead. Routed, but nothing else about it is public.
    #
    # It goes to sms-connector, which is where the receipt actually lands: the controller ships in
    # the shared platform-notifications library and so exists in several services, but only the
    # connector registers the per-vendor translators that verify the signature, and only its
    # security config permits the path without a JWT. Pointed at Notifications Manager, every
    # callback was rejected with 401 before the controller ever ran — the exact failure the
    # controller's own comment warns about, where a forged receipt and a misconfigured route look
    # identical and real delivery data is discarded until somebody notices.
    #
    # This does NOT widen /api/connector/**, which stays unrouted; the rule is this one path.
    sms-dlr-webhook:
      rule: PathPrefix(`/webhooks/dlr`)
      service: sms-connector-dlr
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # ------------------------------------------------------------------ accounting-service (8115)
    accounting-service:
      # /api/points is served by the same service. Reconciliation and points are two views of the
      # same settlement: the ledger records who is owed what, and points are what a merchant or a
      # carrier can actually convert into money.
      rule: PathPrefix(`/api/accounting`) || PathPrefix(`/api/points`)
      service: accounting-service
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # ------------------------------------------------------------------ connector-settings (8109)
    connector-settings:
      rule: PathPrefix(`/api/settings/connectors`)
      service: connector-settings
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # ------------------------------------------------------------------ whatsapp-service (8116)
    whatsapp-service:
      rule: PathPrefix(`/api/whatsapp`)
      service: whatsapp-service
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    whatsapp-webhook:
      rule: PathPrefix(`/webhooks/whatsapp`)
      service: whatsapp-service
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

    # ------------------------------------------------------------------ onboarding-service (8117)
    onboarding-service:
      rule: PathPrefix(`/api/onboarding`)
      service: onboarding-service
      entryPoints: [web, https]
      middlewares: [platform-cors@file, platform-rate-limit@file, strip-identity-headers@file, security-headers@file]

  # NOTE ON WHAT IS ABSENT.
  #
  # The connectors (8110-8113) and the Core Banking Simulator (8114) are deliberately not routed.
  # Their endpoints accept "send this message" and "move this money" with no user token and exist
  # only on the internal network; a route would put them behind the same door as the customer app.
  # The simulator additionally carries a fault-injection endpoint — "break the bank connection"
  # does not belong on the public edge at any price.

    # ================================================================ TLS by hostname
    #
    # These carry a Host rule; the API routers above do not, because their paths (/api/*) already
    # say which service they mean and adding a hostname to each would mean maintaining the same
    # rule twice.


    # ------------------------------------------------------------------ the public website
    #
    # Four hostnames, because this site has two futures and both should work.
    #
    # app-dev is reachable today. The apex and www are declared too, so that repointing them from
    # the GoDaddy Website Builder to this box is a DNS change and nothing else — no config edit, no
    # restart, and a certificate that is already waiting.
    website-tls:
      rule: >-
        Host(`app-dev.youdrop.shop`) || Host(`youdrop.shop`)
        || Host(`www.youdrop.shop`)
      service: website
      entryPoints: [https]
    # ------------------------------------------------------------------ Keycloak, on iam-dev
    #
    # Every path, because Keycloak owns its whole origin: /realms, /resources, the account console
    # and the admin console all live under it.
    #
    # KEYCLOAK_PUBLIC_URL must match this exactly. Keycloak stamps one issuer into every token, and
    # a token whose iss differs from what the services expect is refused at the gateway — which
    # presents as an auth failure rather than an addressing one, and is expensive to diagnose.
    keycloak-tls:
      rule: Host(`iam-dev.youdrop.shop`)
      service: keycloak
      entryPoints: [https]

    # ------------------------------------------------------------------ the portal, on portal-dev
    portal-tls:
      rule: Host(`portal-dev.youdrop.shop`)
      service: portal
      entryPoints: [https]

    # ------------------------------------------------------------------ ops tools, on monitoring-dev
    #
    # ALL of these sit behind basic auth, and that is not decoration. The mail sink holds every
    # verification code the platform issues, in plain text; the broker console can publish, purge
    # and delete queues; the object store console can read and delete every uploaded file. Any one
    # of them open to the internet is a full compromise of something.
    #
    # Basic auth over TLS is the floor, not a good answer. It is one shared password with no second
    # factor and no per-person audit trail. It is here because it is the strongest thing Traefik can
    # do without an identity provider in front, and these are dev tools on a dev box.
    rabbitmq-tls:
      rule: Host(`monitoring-dev.youdrop.shop`) && PathPrefix(`/rabbitmq`)
      service: rabbitmq
      entryPoints: [https]
      middlewares: [ops-auth@file, strip-ops-prefix@file]

    mailpit-tls:
      rule: Host(`monitoring-dev.youdrop.shop`) && PathPrefix(`/mailpit`)
      service: mailpit
      entryPoints: [https]
      middlewares: [ops-auth@file]

    minio-tls:
      rule: Host(`monitoring-dev.youdrop.shop`) && PathPrefix(`/minio`)
      service: minio-console
      entryPoints: [https]
      middlewares: [ops-auth@file, strip-ops-prefix@file]

    # Object storage itself, over TLS, so a phone can actually load a product photo.
    #
    # Presigned URLs used to be signed for http://<ip>:9010, and the app's Android network policy
    # denies cleartext to any public address on purpose — so every image 404'd at the socket before
    # it was ever requested. Serving them over the API hostname fixes that without a new DNS record.
    #
    # The prefix is NOT stripped, and that is the whole trick: an S3 signature covers the host and
    # the path, and the bucket name is the first path segment. Forwarding /product-images/... to
    # MinIO unchanged, with Traefik passing the original Host through, leaves the signature exactly
    # what the signer produced. Stripping anything here would invalidate every URL.
    #
    # Routing a bucket does not make it public: MinIO still rejects anything without a valid
    # signature, which is why this needs no auth middleware of its own. Only the two buckets clients
    # actually fetch are listed — merchant-kyc, receipts and delivery-proof stay unrouted, because
    # an identity document has no business being one guessed URL away from the internet even with a
    # signature in front of it.
    #
    # No rate-limit middleware: one product page pulls a gallery's worth of objects, and the
    # platform limiter is sized for API calls, not images.
    minio-objects:
      rule: Host(`api-dev.youdrop.shop`) && (PathPrefix(`/product-images`) || PathPrefix(`/user-avatars`))
      service: minio-s3
      priority: 90
      entryPoints: [web, https]
      middlewares: [security-headers@file]

    # The landing page at the root of monitoring-dev, so somebody arriving there is told what is
    # under it rather than meeting a 404.
    ops-index-tls:
      rule: Host(`monitoring-dev.youdrop.shop`) && Path(`/`)
      service: ops-index
      entryPoints: [https]
      middlewares: [ops-auth@file]
  services:
    # The SMS connector, reachable for ONE path only: the carrier delivery-receipt callback.
    #
    # Named apart from the connector's other endpoints on purpose. /api/connector/** is deliberately
    # unrouted — it takes no user token, so exposing it would be "send an arbitrary SMS to anyone
    # who finds the host" — and the Phase 5 suite asserts it stays unreachable. Giving the DLR path
    # its own service entry keeps that guarantee textual: there is no route to the connector, only a
    # route to its webhook.
    sms-connector-dlr:
      loadBalancer:
        servers:
          - url: http://sms-connector:8112

    product-service:
      loadBalancer:
        servers:
          - url: http://product-service:8103

    order-manager:
      loadBalancer:
        servers:
          - url: http://order-manager:8101

    order-tracking:
      loadBalancer:
        servers:
          - url: http://order-tracking:8102

    app-notification:
      loadBalancer:
        servers:
          - url: http://app-notification:8108

    notifications-manager:
      loadBalancer:
        servers:
          - url: http://notifications-manager:8104

    accounting-service:
      loadBalancer:
        servers:
          - url: http://accounting-service:8115

    connector-settings:
      loadBalancer:
        servers:
          - url: http://connector-settings:8109

    whatsapp-service:
      loadBalancer:
        servers:
          - url: http://whatsapp-service:8116

    onboarding-service:
      loadBalancer:
        servers:
          - url: http://onboarding-service:8117

    # ---------------------------------------------------------------- TLS-only backends
    #
    # Reachable only through the hostname routers above, never from the 8100 entrypoint, and never
    # published to the host. The container ports here are the INTERNAL ones — 8180, 8200 and 8025
    # are host-side publications and mean nothing inside this network.
    keycloak:
      loadBalancer:
        servers:
          - url: http://keycloak:8080

    portal:
      loadBalancer:
        servers:
          - url: http://portal:8200

    rabbitmq:
      loadBalancer:
        servers:
          - url: http://rabbitmq:15672

    mailpit:
      loadBalancer:
        servers:
          - url: http://mailpit:8025

    minio-console:
      loadBalancer:
        servers:
          - url: http://minio:9001

    # The S3 API, not the console. Separate service entry so the object route and the operator
    # console can never be confused for one another — they have different ports, different auth and
    # very different blast radii.
    minio-s3:
      loadBalancer:
        servers:
          - url: http://minio:9000

    # A single static page listing what lives under this hostname. Traefik cannot serve a file, so
    # it is the portal's nginx answering a path that returns its own index — good enough for a
    # signpost and one less container to run.
    ops-index:
      loadBalancer:
        servers:
          - url: http://portal:8200

    website:
      loadBalancer:
        servers:
          - url: http://website:80
