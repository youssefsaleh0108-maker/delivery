# Traefik: the front door.
#
# Static configuration — what Traefik itself is. The routes live in dynamic/routes.yml, which
# Traefik watches and reloads without a restart. That split is most of the reason for the change:
# adding a service used to mean editing a Spring application, rebuilding a jar and redeploying the
# one component every request passes through.

entryPoints:
  # 8100, the same port the Spring gateway held. Deliberate: every client, every smoke suite and
  # every dart-define in the repo names this port, so keeping it makes the cutover a swap rather
  # than a rename across four apps and a website.
  web:
    address: ":8100"
    # The middleware chain lives on the API ROUTERS now, not here. It used to hang off this
    # entrypoint, which meant it applied to 8100 and to nothing else — so the moment the same
    # services started answering on 443 they answered without CORS, and every browser call from the
    # website failed its preflight with a 403 and no headers to explain why.
    #
    # On the routers it follows the API wherever the API is served, and it stays off Keycloak, the
    # portal and the website, which set their own headers and must not be given a second set.

  # Traefik's own metrics and dashboard, on a port that is not the public one. The dashboard is
  # useful and is emphatically not something to serve beside the customer API.
  #
  # 8099, not 8080 and not 8180: 8080 is Keycloak's port inside the network and 8180 is Keycloak's
  # on the host, and a monitoring port that collides with the identity provider is a confusing
  # half-hour waiting to happen.
  traefik:
    address: ":8099"

  # ---------------------------------------------------------------- public TLS
  #
  # 8100 above stays exactly as it was. Everything already deployed — the phones in testers' hands,
  # every dart-define in the repo, every smoke suite — addresses that port by IP, and breaking them
  # to add TLS would be trading a working system for a certificate.
  #
  # These two are additive: the same services, reachable by hostname over HTTPS.

  # Port 80 exists for two reasons, and only two: Let's Encrypt's HTTP-01 challenge has to land
  # somewhere, and anybody typing the bare hostname has to end up on TLS rather than on a blank
  # page. Everything else it receives is redirected.
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
          permanent: true

  https:
    address: ":443"
    # HTTP/3, because the round trip to this box is roughly 240ms and TLS costs a whole extra one.
    # QUIC folds the transport and TLS handshakes together, so a first connection is one round trip
    # rather than two — worth about a quarter of a second on every cold connection from the region
    # these users are actually in. Clients that do not speak it stay on HTTP/2 over TCP.
    http3:
      advertisedPort: 443
    http:
      tls:
        certResolver: letsencrypt
        # Named explicitly because the API routers match on PATH, not on host — their rules are
        # /api/* and say nothing about a hostname. Traefik asks the CA for a certificate per
        # hostname it finds in a Host rule, so without this list api-dev would be served the
        # built-in self-signed certificate and every client would refuse it.
        domains:
          - main: api-dev.youdrop.shop
          - main: iam-dev.youdrop.shop
          - main: portal-dev.youdrop.shop
          - main: monitoring-dev.youdrop.shop
          # www is where the public site lives. app-dev was dropped: it has no DNS record, and
          # every retry against a name that does not exist spends the five-failures-per-hour
          # budget for the whole account. The apex is out for the same reason — it still answers
          # from the GoDaddy Website Builder.
          - main: www.youdrop.shop

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  # Read-only: no configuration can be changed through it. On its own entryPoint, which is not
  # published to the host in production — see the compose file.
  dashboard: true
  insecure: false

# Enables the /ping endpoint that `traefik healthcheck --ping` calls. Without it the container's
# compose healthcheck reports unhealthy even while Traefik is routing normally. Bound to the
# non-public traefik entryPoint so it is not reachable beside the customer API.
ping:
  entryPoint: traefik

metrics:
  prometheus:
    entryPoint: traefik
    addEntryPointsLabels: true
    addServicesLabels: true

log:
  level: INFO

accessLog:
  # One line per request, and deliberately not the default set: Authorization would put bearer
  # tokens in a log file, and a token in a log is a token that outlives the session it belonged to.
  fields:
    headers:
      defaultMode: drop
      names:
        X-Correlation-Id: keep
        User-Agent: keep
        Content-Type: keep

# ---------------------------------------------------------------- certificates
#
# Let's Encrypt over the HTTP-01 challenge, which needs two things to be true: every hostname below
# must resolve to THIS box, and port 80 must reach it. A name that resolves anywhere else fails
# validation, and five failures per hostname per hour is all Let's Encrypt allows.
#
# Production. Staging was used first to prove the chain — DNS, port 80, the challenge, the routers
# — without spending the production rate limit, which allows only five failed validations per
# hostname per hour and is easy to exhaust while DNS is still being sorted out. Put the staging
# caServer back if any of that ever needs re-testing:
#   caServer: https://acme-staging-v02.api.letsencrypt.org/directory
certificatesResolvers:
  letsencrypt:
    acme:
      email: youssef.saleh0108@gmail.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: http
