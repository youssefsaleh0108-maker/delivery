# The Delivery login theme.
#
# Extends `keycloak` rather than `base`: the stock theme already ships the form markup, error
# handling, social-provider blocks and every localisation string. Starting from `base` would mean
# owning all of that to change a colour scheme, and every Keycloak upgrade would be a merge.
#
# TWO RULES, both learned the hard way — getting either wrong renders the login form unstyled, so
# the inputs no longer look like inputs:
#
#  1. `styles` REPLACES the parent's list, it does not add to it. So the parent's own css/login.css
#     is listed explicitly here, before ours. Our file is named delivery.css rather than login.css
#     precisely so it does not shadow the parent's file at the same path — resources resolve
#     child-first, and a same-named file silently replaces the stock stylesheet entirely.
#
#  2. `stylesCommon` is NOT overridden. Its correct value changes between Keycloak versions (the
#     patternfly and font paths moved), so hardcoding it pins this theme to one release and 404s on
#     every other. Inheriting it is always right.
parent=keycloak
import=common/keycloak

styles=css/login.css css/delivery.css

# Keycloak renders "Sign in to <name>" from this.
displayName=Delivery
