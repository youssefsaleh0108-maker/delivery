name: product-service


# A called workflow can never hold more than its caller was granted, and this repository's default
# GITHUB_TOKEN is read-only. Without this block the reusable workflow's request for packages: write
# and security-events: write exceeds the grant, and the run is refused before a single step starts —
# reported as a startup failure with no job and no log, which reads like an outage rather than a
# permissions problem. Every caller needs its own copy; there is no inheriting this downward.
permissions:
  contents: write
  packages: write
  security-events: write
  checks: write

on:
  push:
    branches: [main, develop, qa]
    paths:
      - 'services/product-service/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/product-service.yml'
  pull_request:
    paths:
      - 'services/product-service/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  # The SQL that keeps service shops off the goods storefront, run against the database it is written
  # for.
  #
  # The rest of this module's suite runs without a database, so ServicesVerticalDatabaseTest skips
  # itself unless PRODUCT_TEST_DB_URL names one. Nothing set it, so deleting an exclusion predicate
  # from a query still passed CI. This job gives the test a throwaway PostGIS on the image every
  # environment runs, and fails if the test skipped anyway: a skipped proof is exactly the green build
  # this job is here to stop.
  #
  # A job of this caller's own rather than a service container in reusable-service-ci.yml, which the
  # other services share and none of them needs. `ci` waits for it, so an image whose exclusions no
  # longer hold is never built, pushed or rolled out.
  #
  # ItemSearchDatabaseTest runs here too, for the same reason: the customer item search matches words
  # in SQL (V37's fold, pg_trgm and the trigram index), which no mock can check, and its Arabic matching
  # depends on this image's locale.
  #
  # PhotoSearchDatabaseTest too: the photo quota (V38) caps a paid vision call per account and across
  # the platform under PostgreSQL advisory locks, and only a real database shows two photos sent at once
  # cannot both take an account's last use.
  #
  # And PublicShopPageDatabaseTest: which shops have a public page is now a WHERE clause, and the page
  # this platform publishes under its own domain must never offer a crawler — or a stranger — a shop
  # that is a draft, suspended, unpinned or filed under a closed category. A mocked repository can only
  # agree with whatever it was told to say.
  database-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          # Throwaway, and reachable only from this job. The test's user and password default to
          # postgres, so only the URL has to be passed below.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Checked over TCP, so the steps start once the server the test connects to is up, not while
        # the image's init scripts are still running against a socket-only one.
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # -am builds the platform libraries this module depends on, as the build job does. The test
      # filter matches nothing in them, which failIfNoSpecifiedTests=false allows.
      - name: Storefront isolation, item search, delivery areas, the photo quota and the public page against PostGIS
        env:
          PRODUCT_TEST_DB_URL: jdbc:postgresql://localhost:5432/postgres
        run: >-
          mvn -B -U -pl services/product-service -am test
          -Dtest=ServicesVerticalDatabaseTest,ItemSearchDatabaseTest,DeliveryAreaDatabaseTest,PhotoSearchDatabaseTest,PublicShopPageDatabaseTest
          -Dsurefire.failIfNoSpecifiedTests=false

      # Fully qualified, because these tests no longer all live in one package: the public page's is
      # in com.delivery.product.shoppage, and a guard that guessed the package would look for a
      # report that never existed and pass the moment it was wrong.
      - name: Fail if the database tests did not run
        run: |
          for test in \
            com.delivery.product.domain.ServicesVerticalDatabaseTest \
            com.delivery.product.domain.ItemSearchDatabaseTest \
            com.delivery.product.domain.DeliveryAreaDatabaseTest \
            com.delivery.product.domain.PhotoSearchDatabaseTest \
            com.delivery.product.shoppage.PublicShopPageDatabaseTest; do
            report=services/product-service/target/surefire-reports/TEST-$test.xml
            if [ ! -f "$report" ]; then
              echo "::error::No report at $report, so the database tests did not run."
              exit 1
            fi
            if ! grep -q 'tests="[1-9]' "$report" || grep -q 'skipped="[1-9]' "$report"; then
              echo "::error::$test was skipped. Is PRODUCT_TEST_DB_URL set?"
              exit 1
            fi
          done

  ci:
    needs: database-tests
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: product-service
      service-path: services/product-service
    secrets: inherit
