name: email-connector

on:
  push:
    branches: [main]
    paths:
      - 'services/email-connector/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/email-connector.yml'
  pull_request:
    paths:
      - 'services/email-connector/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: email-connector
      service-path: services/email-connector
    secrets: inherit
