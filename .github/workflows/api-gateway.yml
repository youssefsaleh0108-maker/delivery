name: api-gateway

on:
  push:
    branches: [main]
    paths:
      - 'services/api-gateway/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/api-gateway.yml'
  pull_request:
    paths:
      - 'services/api-gateway/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: api-gateway
      service-path: services/api-gateway
    secrets: inherit
