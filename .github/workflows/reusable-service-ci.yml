# The standard per-service pipeline. Section 10 asks for this template to exist in Phase 0 so that
# adding the next service is a 12-line caller file rather than a new pipeline invented from scratch
# — with 16 services eventually in this repo, that difference compounds.
#
# To onboard a new service, add .github/workflows/<service>.yml containing:
#
#   name: <service>
#   on:
#     push:
#       paths: ['services/<service>/**', 'platform/**', 'pom.xml']
#     pull_request:
#       paths: ['services/<service>/**', 'platform/**', 'pom.xml']
#   jobs:
#     ci:
#       uses: ./.github/workflows/reusable-service-ci.yml
#       with:
#         service-name: <service>
#         service-path: services/<service>
#       secrets: inherit

name: Reusable service CI

on:
  workflow_call:
    inputs:
      service-name:
        description: Maven artifactId and container image name.
        required: true
        type: string
      service-path:
        description: Path to the service module from the repo root.
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: '17'
      push-image:
        description: Push the image to the registry. Off for pull requests.
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  # Docker Hub is what the cluster pulls from. ghcr.io still gets every image too — it costs one
  # extra tag on a build that has already happened, and it means a Docker Hub rate limit or outage
  # never blocks a deploy.
  #
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must exist as repository secrets (Settings > Secrets and
  # variables > Actions). Use an access token from hub.docker.com > Account Settings > Personal
  # access tokens, scoped Read/Write — never the account password. When they are absent the Docker
  # Hub steps below skip themselves rather than failing the build, so a fork still gets green CI.
  DOCKERHUB_NAMESPACE: youssefsaleh0108

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed to upload SARIF from the dependency scan below.
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      # The service depends on the platform-* libraries, so the reactor has to include them.
      # -am builds exactly this module and its dependencies, not all 16 services.
      - name: Build and test
        run: mvn -B -U -pl ${{ inputs.service-path }} -am verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '${{ inputs.service-path }}/target/surefire-reports/*.xml'
          fail_on_failure: true

      # Fails the build on a known-vulnerable dependency before an image is ever produced.
      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        # TODO: temporarily non-blocking. Triage the HIGH/CRITICAL findings in the job log
        # and drop this line again once they are fixed or accepted.
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: ${{ inputs.service-path }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: ${{ inputs.service-name }}

      - name: Log in to registry
        if: inputs.push-image && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skipped, not failed, when the secret is absent — see the note on DOCKERHUB_NAMESPACE above.
      - name: Check for Docker Hub credentials
        id: dockerhub
        if: inputs.push-image && github.event_name != 'pull_request'
        run: echo "enabled=${{ secrets.DOCKERHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Both registries in one metadata block, so every tag rule below applies identically to
          # each and the two can never drift to different versions of the same build.
          #
          # The Docker Hub repository is delivery-<service>, matching image.name in each service
          # pom, because a Hub namespace is flat — there is no youssefsaleh0108/delivery/product
          # the way ghcr.io allows a path.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.service-name }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && format('docker.io/{0}/delivery-{1}', env.DOCKERHUB_NAMESPACE, inputs.service-name) || '' }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Without this, build-push-action uses the built-in "docker" driver, which cannot
      # export a GHA cache — the build dies on "Cache export is not supported for the
      # docker driver". The docker-container driver this sets up can.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service-path }}
          push: ${{ inputs.push-image && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Gates the deploy on whatever reviewers/secrets the 'staging' environment requires.
    environment: staging
    steps:
      - name: Deploy
        run: |
          echo "::notice::Deploy of ${{ inputs.service-name }} to staging is not wired up yet."
          echo "Phase 0 open item: the Kubernetes target and its credentials do not exist."
          echo "Section 12 open decision #2 - nobody owns the platform work yet."
          exit 0
