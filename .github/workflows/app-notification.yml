name: app-notification


# A called workflow can never hold more than its caller was granted, and this repository's default
# GITHUB_TOKEN is read-only. Without this block the reusable workflow's request for packages: write
# and security-events: write exceeds the grant, and the run is refused before a single step starts —
# reported as a startup failure with no job and no log, which reads like an outage rather than a
# permissions problem. Every caller needs its own copy; there is no inheriting this downward.
permissions:
  contents: read
  packages: write
  security-events: write
  checks: write

on:
  push:
    branches: [main]
    paths:
      - 'services/app-notification/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/app-notification.yml'
  pull_request:
    paths:
      - 'services/app-notification/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: app-notification
      service-path: services/app-notification
    secrets: inherit
