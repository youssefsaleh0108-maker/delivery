name: transfer-service


# A called workflow can never hold more than its caller was granted, and this repository's default
# GITHUB_TOKEN is read-only. Without this block the reusable workflow's request for packages: write
# and security-events: write exceeds the grant, and the run is refused before a single step starts —
# reported as a startup failure with no job and no log, which reads like an outage rather than a
# permissions problem. Every caller needs its own copy; there is no inheriting this downward.
permissions:
  contents: write
  packages: write
  security-events: write
  checks: write

on:
  push:
    branches: [main, develop, qa]
    paths:
      - 'services/transfer-service/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/transfer-service.yml'
  pull_request:
    paths:
      - 'services/transfer-service/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  # V3 against a real PostgreSQL: a split share can be COMMITTED and simulated, the entities still
  # validate against the tables, and relabelling the old PAID promises removes no row. Only a
  # database can prove a migration, so this job runs it and `ci` waits for it.
  database-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          # Throwaway, and reachable only from this job. The test's user and password default to
          # postgres, so only the URL has to be passed below.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Split shares against PostgreSQL
        run: >-
          mvn -B -U -pl services/transfer-service -am test
          -Dtest=SplitSharesPostgresTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Ddelivery.test.postgres=true
          -Ddelivery.test.postgres.url=jdbc:postgresql://localhost:5432/postgres

      - name: Fail if the database tests did not run
        run: |
          report=services/transfer-service/target/surefire-reports/TEST-com.delivery.transfer.domain.SplitSharesPostgresTest.xml
          if [ ! -f "$report" ]; then
            echo "::error::No report at $report, so the database tests did not run."
            exit 1
          fi
          if ! grep -q 'tests="[1-9]' "$report" || grep -q 'skipped="[1-9]' "$report"; then
            echo "::error::The database tests were skipped. Is -Ddelivery.test.postgres=true set?"
            exit 1
          fi

  ci:
    needs: database-tests
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: transfer-service
      service-path: services/transfer-service
    secrets: inherit
