name: mail-worker

on:
  push:
    branches: [main]
    paths:
      - 'services/mail-worker/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/mail-worker.yml'
  pull_request:
    paths:
      - 'services/mail-worker/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: mail-worker
      service-path: services/mail-worker
    secrets: inherit
