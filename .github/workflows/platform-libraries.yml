# The platform-* libraries have no container image, so they do not use the service template.
# They are the blast radius for every service in the repo: a break here breaks all 16 at once,
# which is why this runs the full reactor rather than just the platform modules.

name: platform-libraries

on:
  push:
    branches: [main, develop, qa]
    paths:
      - 'platform/**'
      - 'pom.xml'
  pull_request:
    paths:
      - 'platform/**'
      - 'pom.xml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The five modules by name. `-pl platform` never worked — the aggregator has no module named
      # "platform", only platform/platform-*, so every run of this workflow since it was written
      # failed at reactor selection and nobody was watching a lane that had never once been green.
      - name: Build platform libraries
        run: >-
          mvn -B -pl
          platform/platform-security,platform/platform-observability,platform/platform-outbox,platform/platform-notifications,platform/platform-storage
          -amd verify

      - name: Verify every service still compiles against them
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/*.xml'
          fail_on_failure: true
