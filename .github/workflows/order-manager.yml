name: order-manager

on:
  push:
    branches: [main]
    paths:
      - 'services/order-manager/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/order-manager.yml'
  pull_request:
    paths:
      - 'services/order-manager/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: order-manager
      service-path: services/order-manager
    secrets: inherit
