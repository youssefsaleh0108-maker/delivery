name: sms-worker

on:
  push:
    branches: [main]
    paths:
      - 'services/sms-worker/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/sms-worker.yml'
  pull_request:
    paths:
      - 'services/sms-worker/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: sms-worker
      service-path: services/sms-worker
    secrets: inherit
