name: sms-connector


# A called workflow can never hold more than its caller was granted, and this repository's default
# GITHUB_TOKEN is read-only. Without this block the reusable workflow's request for packages: write
# and security-events: write exceeds the grant, and the run is refused before a single step starts —
# reported as a startup failure with no job and no log, which reads like an outage rather than a
# permissions problem. Every caller needs its own copy; there is no inheriting this downward.
permissions:
  contents: write
  packages: write
  security-events: write
  checks: write

on:
  push:
    branches: [main, develop, qa]
    paths:
      - 'services/sms-connector/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/sms-connector.yml'
  pull_request:
    paths:
      - 'services/sms-connector/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  # The service's own Spring context, booted the way the pod boots it.
  #
  # DemandWeeks reached dev in product-service with two public constructors and no @Autowired:
  # Spring declined to guess, the context failed at start-up and the pod crash-looped, while every
  # unit test passed the whole way — because each of them builds its subject with `new` and none of
  # them ever asks the container to assemble anything. ApplicationContextBootTest asks.
  #
  # This connector holds no database, so its context test needs nothing to run against and is
  # gated on nothing: it runs in every build. The guard below is still worth having — it catches
  # the test being renamed, moved or excluded, which is the other way a proof goes quiet.
  #
  # A job of this caller's own, as product-service has, rather than a service container in
  # reusable-service-ci.yml, which the other services share. `ci` waits for it, so an image whose
  # context no longer starts is never built, pushed or rolled out.
  context-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # -am builds the platform libraries this module depends on, as the build job does. The test
      # filter matches nothing in them, which failIfNoSpecifiedTests=false allows.
      - name: Boot the application context
        run: >-
          mvn -B -U -pl services/sms-connector -am test
          -Dtest=ApplicationContextBootTest
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Fail if the context test did not run
        run: |
          report=services/sms-connector/target/surefire-reports/TEST-com.delivery.connector.sms.ApplicationContextBootTest.xml
          if [ ! -f "$report" ]; then
            echo "::error::No report at $report, so the context test did not run."
            exit 1
          fi
          if ! grep -q 'tests="[1-9]' "$report" || grep -q 'skipped="[1-9]' "$report"; then
            echo "::error::com.delivery.connector.sms.ApplicationContextBootTest was skipped, so nothing proved this service still starts. It is gated on nothing, so look for an exclusion or a rename."
            exit 1
          fi

  ci:
    needs: context-test
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: sms-connector
      service-path: services/sms-connector
    secrets: inherit
