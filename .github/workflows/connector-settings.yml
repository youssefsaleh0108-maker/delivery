name: connector-settings

on:
  push:
    branches: [main]
    paths:
      - 'services/connector-settings/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/connector-settings.yml'
  pull_request:
    paths:
      - 'services/connector-settings/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: connector-settings
      service-path: services/connector-settings
    secrets: inherit
