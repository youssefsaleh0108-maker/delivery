name: order-tracking


# A called workflow can never hold more than its caller was granted, and this repository's default
# GITHUB_TOKEN is read-only. Without this block the reusable workflow's request for packages: write
# and security-events: write exceeds the grant, and the run is refused before a single step starts —
# reported as a startup failure with no job and no log, which reads like an outage rather than a
# permissions problem. Every caller needs its own copy; there is no inheriting this downward.
permissions:
  contents: write
  packages: write
  security-events: write
  checks: write

on:
  push:
    branches: [main, develop, qa]
    paths:
      - 'services/order-tracking/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/order-tracking.yml'
  pull_request:
    paths:
      - 'services/order-tracking/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  # The queries and migrations that only exist against a database, run against the one they are
  # written for.
  #
  # The rest of this module's suite needs no database, so both Postgres tests skip themselves
  # unless TRACKING_IT_DB_URL names one — and nothing set it, so a green build proved nothing
  # about the SQL. They are the queries the checkout map's privacy rests on: whether a rider has a
  # delivery that is not this checkout's (an order placed alone has a null checkout, and `<>` is
  # never true of a null), which other customers' doors the hand-over buffer measures against, and
  # the retention job's rollup. This job gives them a throwaway PostGIS on the image every
  # environment runs, and fails if they skipped anyway: a skipped proof is exactly the green build
  # it is here to stop. `ci` waits for it, so an image whose SQL no longer holds is never built.
  database-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          # Throwaway, and reachable only from this job. The tests' user and password default to
          # postgres, so only the URL has to be passed below.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Checked over TCP, so the steps start once the server the tests connect to is up, not
        # while the image's init scripts are still running against a socket-only one.
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # -am builds the platform libraries this module depends on, as the build job does. The test
      # filter matches nothing in them, which failIfNoSpecifiedTests=false allows.
      # ApplicationContextBootTest runs here too, and wants the same throwaway PostGIS: it boots this
      # service's real Spring context — Flyway, Hibernate on validate, the AMQP listeners, the STOMP
      # endpoint and the Redis template — which nothing else in the suite does. DemandWeeks reached
      # dev in product-service with two constructors Spring could not choose between, and no unit
      # test anywhere could have caught it, because unit tests build their subject with `new`.
      #
      # It reads TRACKING_TEST_DB_URL rather than this job's older TRACKING_IT_DB_URL: every context
      # test in the estate is spelled <SERVICE>_TEST_DB_URL, and renaming the variable the two
      # existing tests already read would be a change to tests this one has nothing to do with. Both
      # name the same container.
      - name: Tracking queries, migrations and the context boot against PostGIS
        env:
          TRACKING_IT_DB_URL: jdbc:postgresql://localhost:5432/postgres
          TRACKING_TEST_DB_URL: jdbc:postgresql://localhost:5432/postgres
        run: >-
          mvn -B -U -pl services/order-tracking -am test
          -Dtest=OrderParticipantsPostgresTest,TrackingRetentionPostgresTest,ApplicationContextBootTest
          -Dsurefire.failIfNoSpecifiedTests=false

      # Summed across the reports rather than read from one: JUnit's nested classes get a report
      # each, and which of them a test is filed under is surefire's business, not this check's.
      - name: Fail if the database tests did not run
        run: |
          reports=$(ls services/order-tracking/target/surefire-reports/TEST-com.delivery.tracking.domain.OrderParticipantsPostgresTest*.xml \
                       services/order-tracking/target/surefire-reports/TEST-com.delivery.tracking.service.TrackingRetentionPostgresTest*.xml 2>/dev/null)
          if [ -z "$reports" ]; then
            echo "::error::No surefire reports for the database tests, so they did not run."
            exit 1
          fi
          count() { grep -ho "$1=\"[0-9]*\"" $reports | tr -dc '0-9\n' | awk '{ s += $1 } END { print s + 0 }'; }
          ran=$(count tests)
          skipped=$(count skipped)
          echo "Database tests: $ran run, $skipped skipped."
          if [ "$ran" -lt 1 ] || [ "$skipped" -gt 0 ]; then
            echo "::error::The database tests were skipped. Is TRACKING_IT_DB_URL set?"
            exit 1
          fi

      # Checked on its own rather than added to the glob above, which would not have caught it: that
      # check sums whatever reports exist, so a context test whose report was missing entirely would
      # have passed on the other two.
      - name: Fail if the context test did not run
        run: |
          report=services/order-tracking/target/surefire-reports/TEST-com.delivery.tracking.ApplicationContextBootTest.xml
          if [ ! -f "$report" ]; then
            echo "::error::No report at $report, so the context test did not run."
            exit 1
          fi
          if ! grep -q 'tests="[1-9]' "$report" || grep -q 'skipped="[1-9]' "$report"; then
            echo "::error::The context test was skipped, so nothing proved this service still starts. Is TRACKING_TEST_DB_URL set?"
            exit 1
          fi

  ci:
    needs: database-tests
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: order-tracking
      service-path: services/order-tracking
    secrets: inherit
