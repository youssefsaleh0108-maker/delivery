name: corebanking-connector

on:
  push:
    branches: [main]
    paths:
      - 'services/corebanking-connector/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/corebanking-connector.yml'
  pull_request:
    paths:
      - 'services/corebanking-connector/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: corebanking-connector
      service-path: services/corebanking-connector
    secrets: inherit
