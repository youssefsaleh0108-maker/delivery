name: corebanking-simulator

on:
  push:
    branches: [main]
    paths:
      - 'services/corebanking-simulator/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/corebanking-simulator.yml'
  pull_request:
    paths:
      - 'services/corebanking-simulator/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: corebanking-simulator
      service-path: services/corebanking-simulator
    secrets: inherit
