name: notifications-manager

on:
  push:
    branches: [main]
    paths:
      - 'services/notifications-manager/**'
      - 'platform/**'
      - 'pom.xml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/workflows/notifications-manager.yml'
  pull_request:
    paths:
      - 'services/notifications-manager/**'
      - 'platform/**'
      - 'pom.xml'

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: notifications-manager
      service-path: services/notifications-manager
    secrets: inherit
