# Product, Order Manager, Order Tracking. All ClusterIP — reachable only through the Gateway.

apiVersion: apps/v1
kind: Deployment
metadata: { name: product-service, namespace: delivery, labels: { app: product-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: product-service } }
  template:
    metadata: { labels: { app: product-service } }
    spec:
      containers:
        - name: product-service
          image: ghcr.io/delivery/product-service:0.1.0
          ports: [ { containerPort: 8103 } ]
          envFrom: [ { configMapRef: { name: delivery-common } } ]
          env:
            - { name: SERVER_PORT, value: "8103" }
            - name: CONFIG_SERVER_USER
              valueFrom: { secretKeyRef: { name: config-server-client, key: username } }
            - name: CONFIG_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: config-server-client, key: password } }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8103 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8103 }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8103 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: product-service, namespace: delivery }
spec:
  type: ClusterIP
  selector: { app: product-service }
  ports: [ { port: 8103, targetPort: 8103 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: order-manager, namespace: delivery, labels: { app: order-manager } }
spec:
  replicas: 2
  selector: { matchLabels: { app: order-manager } }
  template:
    metadata: { labels: { app: order-manager } }
    spec:
      containers:
        - name: order-manager
          image: ghcr.io/delivery/order-manager:0.1.0
          ports: [ { containerPort: 8101 } ]
          envFrom: [ { configMapRef: { name: delivery-common } } ]
          env:
            - { name: SERVER_PORT, value: "8101" }
            - { name: PRODUCT_SERVICE_URL, value: "http://product-service:8103" }
            - name: CONFIG_SERVER_USER
              valueFrom: { secretKeyRef: { name: config-server-client, key: username } }
            - name: CONFIG_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: config-server-client, key: password } }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8101 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8101 }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8101 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: order-manager, namespace: delivery }
spec:
  type: ClusterIP
  selector: { app: order-manager }
  ports: [ { port: 8101, targetPort: 8101 } ]
---
# Order Tracking. Section 10 names this one of the two most likely to need independent scaling, and
# the load test bears that out: ~322 pings/s per instance before it saturates (docs/LOAD_TEST.md,
# run B). Higher CPU limit than its peers because it is the only service doing a write per active
# rider every few seconds.
apiVersion: apps/v1
kind: Deployment
metadata: { name: order-tracking, namespace: delivery, labels: { app: order-tracking } }
spec:
  replicas: 2
  selector: { matchLabels: { app: order-tracking } }
  template:
    metadata: { labels: { app: order-tracking } }
    spec:
      containers:
        - name: order-tracking
          image: ghcr.io/delivery/order-tracking:0.1.0
          ports: [ { containerPort: 8102 } ]
          envFrom: [ { configMapRef: { name: delivery-common } } ]
          env:
            - { name: SERVER_PORT, value: "8102" }
            - name: CONFIG_SERVER_USER
              valueFrom: { secretKeyRef: { name: config-server-client, key: username } }
            - name: CONFIG_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: config-server-client, key: password } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis, key: password } }
          resources:
            requests: { cpu: "500m", memory: "768Mi" }
            limits:   { cpu: "2000m", memory: "1536Mi" }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8102 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8102 }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8102 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: order-tracking, namespace: delivery }
spec:
  type: ClusterIP
  selector: { app: order-tracking }
  ports: [ { port: 8102, targetPort: 8102 } ]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: order-tracking, namespace: delivery }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order-tracking }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    # Scale up fast, down slowly. Rider pings arrive as a step function when a delivery peak starts,
    # and flapping a service that holds a Redis-backed hot path costs more than a spare pod.
    scaleUp:   { stabilizationWindowSeconds: 30 }
    scaleDown: { stabilizationWindowSeconds: 300 }
