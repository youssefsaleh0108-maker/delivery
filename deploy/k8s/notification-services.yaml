---
# App Notification. ONE replica, and no HPA, deliberately.
#
# It holds STOMP connections in an in-memory broker (see WebSocketConfiguration). A second instance
# would serve some users their notifications and others silence, depending on which pod their socket
# landed on — and the failure would look like "notifications are flaky" rather than like a scaling
# mistake. Scaling this needs a shared relay (Redis or RabbitMQ STOMP) first; the replica count
# enforces that rather than leaving it to be discovered in production.
#
# The durable record is the row in Postgres either way, so the blast radius of this pod restarting
# is a missed live update, not a lost notification — clients fall back to polling.
apiVersion: apps/v1
kind: Deployment
metadata: { name: app-notification, namespace: delivery, labels: { app: app-notification } }
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two instances must never be live at once, and a rolling update
    # would briefly run both.
    type: Recreate
  selector: { matchLabels: { app: app-notification } }
  template:
    metadata: { labels: { app: app-notification } }
    spec:
      containers:
        - name: app-notification
          image: ghcr.io/delivery/app-notification:0.1.0
          ports: [ { containerPort: 8108 } ]
          envFrom: [ { configMapRef: { name: delivery-common } } ]
          env:
            - { name: SERVER_PORT, value: "8108" }
            - name: CONFIG_SERVER_USER
              valueFrom: { secretKeyRef: { name: config-server-client, key: username } }
            - name: CONFIG_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: config-server-client, key: password } }
            - name: CORS_ALLOWED_ORIGINS
              value: "https://app.delivery.example,https://backoffice.delivery.example,https://merchant.delivery.example"
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8108 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8108 }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8108 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: app-notification, namespace: delivery }
spec:
  type: ClusterIP
  # Sticky, so a client that reconnects lands on the same pod while there is only one. Harmless
  # now, and required the moment a shared relay makes a second replica possible.
  sessionAffinity: ClientIP
  selector: { app: app-notification }
  ports: [ { port: 8108, targetPort: 8108 } ]
---
# Core Banking Connector. The only pod holding bank credentials (Section 10 calls it the most
# sensitive integration in the system), and the one whose Vault path has a policy of its own.
#
# Two replicas, no HPA: it consumes a queue, so throughput is bounded by the bank rather than by
# pod count, and postings against one account serialise at the bank anyway. Scaling it would just
# queue threads inside a slow bank instead of inside the broker, where the backlog is visible.
apiVersion: apps/v1
kind: Deployment
metadata: { name: corebanking-connector, namespace: delivery, labels: { app: corebanking-connector } }
spec:
  replicas: 2
  selector: { matchLabels: { app: corebanking-connector } }
  template:
    metadata: { labels: { app: corebanking-connector } }
    spec:
      containers:
        - name: corebanking-connector
          image: ghcr.io/delivery/corebanking-connector:0.1.0
          ports: [ { containerPort: 8113 } ]
          envFrom: [ { configMapRef: { name: delivery-common } } ]
          env:
            - { name: SERVER_PORT, value: "8113" }
            - name: CONFIG_SERVER_USER
              valueFrom: { secretKeyRef: { name: config-server-client, key: username } }
            - name: CONFIG_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: config-server-client, key: password } }
            # NOTE: no COREBANKING_SIMULATOR_URL. The simulator is dev-only and is not deployed
            # here; the provider is switched to REAL through the Backoffice once the bank contract
            # exists. Until then RealBankClient refuses every posting, loudly and on purpose.
          resources:
            requests: { cpu: "100m", memory: "384Mi" }
            limits:   { cpu: "500m", memory: "768Mi" }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8113 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8113 }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8113 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: corebanking-connector, namespace: delivery }
spec:
  type: ClusterIP
  selector: { app: corebanking-connector }
  ports: [ { port: 8113, targetPort: 8113 } ]
