# The notification layer and the accounting services.
#
# Six deployables. Each channel is ONE pod that both renders and sends — mail-worker, push-worker
# and sms-worker were merged into their connectors.
#
# The split they used to have was load-bearing, not ceremony, and it is worth recording what was
# traded away: rendering is fast and CPU-bound while a connector blocks on a third party whose
# latency nobody here controls, so in one process a degraded vendor now consumes the thread budget
# rendering needed. Provider credentials also share a heap with template rendering. Per-channel
# isolation survives — a wedged SMS vendor cannot stall email or push — but within a channel the
# two failure modes became one.
#
# The two worker HorizontalPodAutoscalers went with the workers. Nothing here autoscales now;
# scaling a merged channel means scaling the pod that holds the provider credentials, which is a
# decision to take deliberately rather than inherit from a manifest.
#
# Every Service here is ClusterIP. The connectors' /api/connector/send takes no user token, so a
# LoadBalancer or NodePort on any of them would publish "send an arbitrary SMS" to the world.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notifications-manager, namespace: delivery, labels: { app: notifications-manager } }
spec:
  replicas: 2
  selector: { matchLabels: { app: notifications-manager } }
  template:
    metadata: { labels: { app: notifications-manager } }
    spec:
      containers:
        - name: notifications-manager
          image: ghcr.io/delivery/notifications-manager:0.1.0
          ports: [ { containerPort: 8104 } ]
          envFrom: [ { configMapRef: { name: delivery-common } } ]
          env:
            - { name: SERVER_PORT, value: "8104" }
            - name: CONFIG_SERVER_USER
              valueFrom: { secretKeyRef: { name: config-server-client, key: username } }
            - name: CONFIG_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: config-server-client, key: password } }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8104 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8104 }, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: 8104 }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: notifications-manager, namespace: delivery }
spec:
  type: ClusterIP
  selector: { app: notifications-manager }
  ports: [ { port: 8104, targetPort: 8104 } ]
