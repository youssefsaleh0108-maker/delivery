# The API Gateway — the only externally reachable component.
#
# Everything else in this namespace is ClusterIP. See deploy/k8s/README.md and finding 3 of
# docs/SECURITY_REVIEW.md for why that matters more here than it looks.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: delivery
  labels: { app: api-gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/delivery/api-gateway:0.1.0
          ports:
            - containerPort: 8100
          envFrom:
            - configMapRef: { name: delivery-common }
          env:
            - name: SERVER_PORT
              value: "8100"
            - name: CONFIG_SERVER_USER
              valueFrom: { secretKeyRef: { name: config-server-client, key: username } }
            - name: CONFIG_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: config-server-client, key: password } }
            # Must list every origin the clients are served from. A browser WebSocket is subject to
            # the same origin check, and getting this wrong surfaces as a silent connection
            # failure rather than a CORS error (see the Phase 2 notes in the README).
            - name: CORS_ALLOWED_ORIGINS
              value: "https://app.delivery.example,https://backoffice.delivery.example,https://merchant.delivery.example"
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          # Spring Boot's separate probes: readiness gates traffic, liveness restarts. The long
          # startup failureThreshold is not padding — a JVM plus a Config Server fetch takes tens of
          # seconds, and a tight liveness probe would restart-loop a service that was merely booting.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8100 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8100 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8100 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: delivery
spec:
  # The one LoadBalancer in the platform.
  type: LoadBalancer
  selector: { app: api-gateway }
  ports:
    - port: 80
      targetPort: 8100
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: delivery
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api-gateway }
