apiVersion: v1
kind: Namespace
metadata:
  name: delivery
  labels:
    app.kubernetes.io/part-of: delivery-platform
---
# Nothing in this platform is meant to reach another service by any route except the ones below, and
# the connectors' send endpoints take no user token (see docs/SECURITY_REVIEW.md finding 3). A
# default-deny policy is what makes "internal only" a property of the cluster rather than a comment
# in a YAML file.
#
# NOT VERIFIED: this needs a CNI that enforces NetworkPolicy (Calico, Cilium). On a cluster without
# one it is silently inert, which is the worst failure mode available for a security control -
# confirm enforcement before relying on it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: delivery
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The Gateway is the only pod that accepts traffic from outside the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: delivery
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - {}
---
# Everything else accepts traffic only from inside the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: delivery
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: delivery
