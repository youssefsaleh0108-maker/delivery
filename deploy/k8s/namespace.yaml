apiVersion: v1
kind: Namespace
metadata:
  name: delivery
  labels:
    app.kubernetes.io/part-of: delivery-platform
---
# Nothing in this platform is meant to reach another service by any route except the ones below, and
# the connectors' send endpoints take no user token (see docs/SECURITY_REVIEW.md finding 3). A
# default-deny policy is what makes "internal only" a property of the cluster rather than a comment
# in a YAML file.
#
# NOT VERIFIED: this needs a CNI that enforces NetworkPolicy (Calico, Cilium). On a cluster without
# one it is silently inert, which is the worst failure mode available for a security control -
# confirm enforcement before relying on it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: delivery
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Traefik is the only pod that accepts traffic from outside the namespace.
#
# This selected the Spring api-gateway until that service was removed: Traefik had already taken
# 8100 and routes straight to the backing services, so the gateway sat outside the request path.
#
# NOT YET WRITTEN: there is no Traefik manifest in this directory. Until one exists this policy
# selects nothing, which — combined with default-deny-ingress above — seals the namespace to all
# outside traffic. That is the safe direction to fail, but it does mean the platform has no front
# door in a cluster until Traefik is deployed here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: delivery
spec:
  podSelector:
    matchLabels:
      app: traefik
  policyTypes:
    - Ingress
  ingress:
    - {}
---
# Everything else accepts traffic only from inside the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: delivery
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: delivery
