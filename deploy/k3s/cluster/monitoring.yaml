# The monitoring stack: one Prometheus and one Grafana for the whole cluster, watching both
# environments. Cluster-scoped like the Traefik config — the namespaces are what it observes,
# not where it lives.
#
# Prometheus discovers targets by the prometheus.io/* pod annotations the service manifests
# carry, so a new service is scraped the day it is deployed, with no edit here. It is not
# exposed publicly; Grafana talks to it in-cluster and is the one with a login.
#
# Grafana's admin password is created on the box by scripts/setup-monitoring.sh — read it with:
#   kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.password}' | base64 -d
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    rule_files:
      - /etc/prometheus/rules/*.yaml
    # Where a firing rule GOES. Without this block Prometheus evaluates every rule below, marks it
    # firing, and tells nobody — which is what it did for the whole life of both environments.
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    scrape_configs:
      # Anything, in any namespace, that carries the prometheus.io annotations. The environment
      # is readable on every series as the `namespace` label — delivery-dev vs delivery-qa.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # The Config Server's actuator is behind basic auth, and this job sends none — scraped
          # here it is a target that answers 401 forever. It has its own job per environment
          # below, because the credential is per environment.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: drop
            regex: config-server
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
      # The Config Server, one job per environment. It is the component every service blocks on at
      # boot, so it is the one that most needs to be observable — and it is also the component that
      # hands out every service's Vault-resolved secrets, so its actuator is not going to be opened
      # up to anything that can reach the pod IP. The job authenticates instead, with the same
      # basic-auth login the config clients use.
      #
      # The credential is minted per namespace by gen-secrets.sh and copied into monitoring by
      # setup-monitoring.sh; hence two jobs rather than one, and files rather than literals —
      # password_file is re-read on every scrape, so a rotated password takes effect when the
      # mounted Secret updates, with no Prometheus restart and no password in this ConfigMap.
      - job_name: config-server-dev
        metrics_path: /actuator/prometheus
        basic_auth:
          username_file: /etc/prometheus/config-server-auth/username
          password_file: /etc/prometheus/config-server-auth/dev-password
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [delivery-dev] }
        relabel_configs: &config-server-relabel
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: config-server
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
      - job_name: config-server-qa
        metrics_path: /actuator/prometheus
        basic_auth:
          # Spelled out rather than merged from the job above: this block is a string inside a
          # ConfigMap, so a dangling YAML alias here is not a manifest error — kubectl and
          # kustomize both accept it — it is a Prometheus that refuses to start, with the whole
          # of monitoring down and nothing left to alert on it.
          username_file: /etc/prometheus/config-server-auth/username
          password_file: /etc/prometheus/config-server-auth/qa-password
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [delivery-qa] }
        relabel_configs: *config-server-relabel
      # Traefik, which is the only thing that sees a request before it becomes an application's
      # problem: the 5xx rate, the 429 rate the rate limiter produces, and the expiry date of every
      # certificate it holds. It lives in kube-system, which the annotation-based job above does
      # not reach because the chart does not set those annotations and this file cannot add them.
      #
      # Port 9000 is the chart's own `traefik` entrypoint — the one already serving /ping for the
      # liveness probe. Prometheus metrics default to that entrypoint when they are switched on
      # (cluster/traefik-config.yaml), so nothing new binds and there is no chance of an entrypoint
      # name colliding with one the chart defines and taking the whole edge down.
      - job_name: traefik
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [kube-system] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: traefik
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:9000
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
# Alerting rules. These now REACH somebody: the `alerting:` block above sends everything that fires
# to the Alertmanager in cluster/alerting.yaml, which emails it through the M365 relay. Before that
# existed, a firing alert was a red line in a UI nobody had open.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  # Three files, and the split is the point: "money is in the wrong place" and "an event is
  # permanently lost" are states that do not resolve on their own and that nothing else announces;
  # the platform group is ordinary operational noise worth seeing in daylight; and
  # infrastructure.yaml is the box, the cluster, the edge and the backups.
  #
  # These were authored in infra/prometheus/alerts.yml and never reached a cluster — the manifest
  # that actually runs had scrape_configs and no rule_files, so /api/v1/rules answered with an
  # empty list for the whole life of both environments. The metrics were being collected the
  # entire time. Every rule here also needs something that emits its metric: scripts/verify.sh
  # resolves each one back to whatever produces it and fails on a rule that can never fire.
  settlement.yaml: |
    groups:
      - name: settlement
        rules:
          # The one this file exists for.
          #
          # A customer's money has left their account and reached nobody: no merchant leg, no
          # rider leg, no refund. Silent by construction — the debit succeeded so nothing failed,
          # and the saga is waiting so nothing errored — which means without this the first report
          # comes from the customer.
          - alert: SettlementDebitedWithoutCounterpart
            expr: delivery_settlement_debited_without_counterpart > 0
            for: 2m
            labels: { severity: page }
            annotations:
              summary: "{{ $value }} order(s) debited with nothing credited ({{ $labels.namespace }})"
              description: >-
                A customer has been debited and no merchant, rider, provider or refund leg has
                posted. Check the unsettled view in Backoffice Finance and core_banking_sync_log
                for the orders concerned. Do not unwind anything automatically — confirm against
                the bank first.

          # Broader and less acute: the saga is waiting on something, often a bank outage, in
          # which case no money has moved and the legs drain when it returns.
          - alert: SettlementLegsStuck
            expr: delivery_settlement_stuck_legs > 0
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $value }} settlement leg(s) pending far longer than they should be"
              description: >-
                Legs have sat PENDING past the configured threshold. If the bank is up, suspect a
                posting result that was never delivered.

      - name: outbox
        rules:
          # An event that will never be published. Whatever was waiting for it waits forever, and
          # the relay logs this once, in one container, at whatever hour it happened.
          - alert: OutboxEventsDeadLettered
            expr: delivery_outbox_dead_lettered > 0
            for: 1m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.namespace }} has {{ $value }} dead-lettered outbox event(s)"
              description: >-
                Events exhausted their retries and will never publish. This survives restarts and
                does not clear itself. Inspect outbox_event WHERE status = 'DEAD_LETTERED';
                republishing is a manual decision because consumers may have partially acted.

          # Damage in progress rather than damage done: the relay is not draining. Caught here,
          # nothing has been lost yet. The threshold is a backlog that PERSISTS — a burst of
          # orders legitimately puts hundreds of rows in the table for a few seconds.
          - alert: OutboxBacklogNotDraining
            expr: delivery_outbox_pending > 200
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} outbox backlog is not draining ({{ $value }} pending)"
              description: >-
                Events are being written faster than they publish, or not publishing at all. Check
                the broker is reachable and that delivery.outbox.relay-enabled is on.

          # The same failure caught earlier, and it fires even when the absolute number is small —
          # which is what a low-traffic service with a broken relay looks like.
          - alert: OutboxBacklogGrowing
            expr: delta(delivery_outbox_pending[30m]) > 100
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} outbox backlog is growing steadily"
              description: >-
                Pending events have risen sharply over the last half hour without draining.

  platform.yaml: |
    groups:
      - name: platform
        rules:
          # A dead-lettered notification is a message somebody was waiting for that will never
          # arrive, and nothing consumes these queues by design — they are a parking lot an
          # operator drains by hand (deploy/k3s/README.md, "Draining a dead-letter queue").
          # Without this the only way to learn they are filling is to open the broker console.
          - alert: NotificationDeadLettersParked
            expr: rabbitmq_queue_messages_ready{queue=~".+\\.dlq"} > 0
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $value }} dead-lettered messages in {{ $labels.queue }} ({{ $labels.namespace }})"
              description: >-
                Nothing consumes this queue. Read the messages and their x-dead-letter-reason
                header before anyone purges it — see "Draining a dead-letter queue" in
                deploy/k3s/README.md.
          # A target that has been down for a quarter of an hour is either a pod that never came
          # back or a scrape that cannot authenticate. The Config Server spent both environments'
          # lifetimes in the second state, unnoticed, because nothing watched for it.
          - alert: ScrapeTargetDown
            expr: up == 0
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.job }} target {{ $labels.instance }} has been unscrapable for 15m"

  # The node, the cluster, the edge and the backups. Everything in this file needs something that
  # did not exist before cluster/alerting.yaml: node-exporter for the box, kube-state-metrics for
  # the API server's view, Traefik's own metrics for the edge, and node-exporter's textfile
  # collector for the CronJobs, which are gone by the time anything could scrape them.
  infrastructure.yaml: |
    groups:
      - name: node
        rules:
          # 23 GiB and NO SWAP. When this box runs out of memory the kernel starts killing
          # processes, and which ones is not a decision anybody made. 10% of 23 GiB is 2.3 GiB,
          # which at these pod sizes is three or four services' worth of room.
          - alert: NodeMemoryCritical
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
            for: 5m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.instance }} has {{ $value | humanizePercentage }} of its memory available"
              description: >-
                There is no swap on this node, so the next allocation that does not fit is an
                OOMKill. Check `kubectl top pods -A --sort-by=memory`; dev is the half that is
                meant to give way (it has a ResourceQuota and the lower PriorityClass).
          - alert: NodeMemoryLow
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.20
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.instance }} has been under 20% free memory for half an hour"

          # 290 GB of disk, 33 used at the last survey. It fills from three directions: Postgres,
          # MinIO objects and container images. A full disk stops Postgres writing, which stops
          # everything, and it does it without warning.
          - alert: NodeDiskFilling
            expr: >-
              (node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"} - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs"})
                / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"} > 0.80
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | humanizePercentage }} full"
              description: >-
                `k3s crictl rmi --prune` reclaims unused images; Loki and Prometheus retention are
                in cluster/logging.yaml and cluster/monitoring.yaml. PVCs cannot grow on
                local-path, so a full postgres volume means moving it, not resizing it.
          - alert: NodeDiskCritical
            expr: >-
              (node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"} - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs"})
                / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"} > 0.92
            for: 5m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | humanizePercentage }} full"

      - name: workloads
        rules:
          # A pod that keeps restarting is usually a pod that starts, fails a health check or runs
          # out of memory, and dies — over and over, serving nothing, while its Service still lists
          # it between restarts. Waiting-reason rather than a restart count, because a restart
          # count that stops rising is a pod that gave up.
          - alert: PodCrashLooping
            expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} > 0
            for: 10m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash-looping"
              description: "kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} --previous"
          # The specific case worth naming, because the answer is different: it is not a bug, it is
          # a limit. On this box that is usually the resource-safety sizing rather than a leak.
          - alert: ContainerOOMKilled
            expr: increase(kube_pod_container_status_restarts_total[1h]) > 0
                  and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOMKilled"
              description: >-
                Its memory limit is too low for what it is doing. See "what happens under memory
                pressure" in deploy/k3s/README.md — in delivery-dev this is the first thing to
                check after the 416Mi service limits land.
          - alert: JobFailed
            expr: kube_job_failed{condition="true"} > 0
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
              description: "kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}"
          - alert: DeploymentNotReady
            expr: kube_deployment_status_replicas_available{namespace=~"delivery-.*"}
                  < kube_deployment_spec_replicas{namespace=~"delivery-.*"}
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has been short of replicas for 15m"

      - name: backups
        rules:
          # These four read node-exporter's textfile collector, which is how a CronJob leaves a
          # metric behind: by the time Prometheus comes round the pod is gone, and whether last
          # night's backup actually uploaded anything is exactly what has to outlive it.
          #
          # `absent` matters as much as the value. A metric that has never been written means the
          # job has never completed a run, which is the state a new environment is in and the state
          # a permanently broken one is in.
          - alert: BackupNotConfigured
            expr: youdrop_backup_configured == 0
            for: 1h
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.env }}: the {{ $labels.backup }} backup has nowhere to go"
              description: >-
                The job ran and found no destination, so NOTHING IS BEING BACKED UP. Create the
                backup-rclone and backup-age Secrets — see "Backups" in deploy/k3s/README.md.
          - alert: BackupDidNotReport
            expr: >-
              (time() - youdrop_backup_last_success_timestamp_seconds{backup="postgres"} > 7200)
              or (youdrop_backup_configured{backup="postgres"} == 1
                  unless youdrop_backup_last_success_timestamp_seconds{backup="postgres"})
            for: 10m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.env }}: no database backup has succeeded for over two hours"
              description: >-
                The hourly job is failing or not running. kubectl -n delivery-{{ $labels.env }} get
                cronjob postgres-backup; logs job/postgres-backup-<id>. The external dead-man
                switch is the other half of this and is the only one that survives the box dying.
          - alert: MinioBackupDidNotReport
            expr: time() - youdrop_backup_last_success_timestamp_seconds{backup="minio"} > 129600
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.env }}: objects have not been copied off the box for 36 hours"
          # A backup nobody has restored is a belief. This is the alert that says the belief is
          # wrong, and it is the most important one in this file.
          - alert: RestoreTestFailing
            expr: youdrop_restore_test_ok == 0
            for: 10m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.env }}: the weekly restore test FAILED"
              description: >-
                What is being written off the box could not be turned back into a database. Read
                `kubectl -n delivery-{{ $labels.env }} logs job/restore-test-<id>` before the next
                deploy; until this passes there is no recovery path.
          - alert: RestoreTestStale
            expr: time() - youdrop_restore_test_last_run_timestamp_seconds > 1209600
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.env }}: the restore test has not run for two weeks"

      - name: edge
        rules:
          # Certificates come from Let's Encrypt over HTTP-01 and renew themselves at 30 days. A
          # renewal that is failing is silent until the certificate expires, at which point every
          # browser and every phone refuses the connection at once, and the fix (fixing ACME, then
          # waiting for issuance) takes longer than the outage anybody can tolerate. Fourteen days
          # is two full renewal attempts of warning.
          - alert: CertificateExpiringSoon
            expr: (traefik_tls_certs_not_after - time()) / 86400 < 14
            for: 1h
            labels: { severity: page }
            annotations:
              summary: "the certificate for {{ $labels.cn }} expires in {{ $value | printf \"%.0f\" }} days"
              description: >-
                ACME renewal is not completing. Check Traefik's logs for the `letsencrypt`
                resolver, that port 80 still reaches it (the HTTP-01 challenge is answered before
                the https redirect), and that acme.json on the 128Mi PVC is still mode 600.
          - alert: CertificateExpiringCritical
            expr: (traefik_tls_certs_not_after - time()) / 86400 < 5
            labels: { severity: page }
            annotations:
              summary: "the certificate for {{ $labels.cn }} expires in {{ $value | printf \"%.0f\" }} days"

          # A ratio, not a count: five errors a minute out of ten requests is an outage and out of
          # ten thousand is background. The edge sees this before any application does, including
          # the requests that never reached one.
          - alert: HighServerErrorRate
            expr: >-
              sum by (entrypoint) (rate(traefik_entrypoint_requests_total{code=~"5..",entrypoint="websecure"}[5m]))
                / clamp_min(sum by (entrypoint) (rate(traefik_entrypoint_requests_total{entrypoint="websecure"}[5m])), 0.01)
              > 0.02
            for: 10m
            labels: { severity: page }
            annotations:
              summary: "{{ $value | humanizePercentage }} of requests are answering 5xx"
              description: >-
                Break it down by router in Grafana (traefik_router_requests_total by router, code)
                before looking at any one service.

          # The rate limit is 20 req/s per IP with a burst of 40, and Lebanese mobile networks put
          # a very large number of real users behind one CGNAT address. A rising 429 rate is far
          # more likely to be the limit catching customers than an attack, and either way it is
          # invisible from inside the application — the request never arrives.
          - alert: RateLimitRejectionsHigh
            expr: sum(rate(traefik_entrypoint_requests_total{code="429"}[10m])) > 1
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $value | printf \"%.1f\" }} requests a second are being rate-limited"
              description: >-
                Check whether one source address dominates. If this is ordinary traffic behind
                CGNAT, the limit in overlays/ingress.template.yaml is what needs to change, not the
                clients.

      - name: data
        rules:
          # max_connections is 200 with three reserved for superusers. The README's connection
          # budget puts the services' pools at 98 maximum, so 170 is a long way past anything
          # normal and a long way before the wall. Past 197 the failure is not graceful: a service
          # that cannot get a connection blocks for Hikari's 30-second timeout, and the losers are
          # whichever services started last rather than whichever matter least.
          - alert: PostgresConnectionsHigh
            expr: sum by (namespace) (pg_stat_activity_count) > 170
            for: 5m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.namespace }} Postgres has {{ $value }} of 197 usable connections open"
              description: >-
                See "The connection budget" in deploy/k3s/README.md. Find the holder with
                `select usename, count(*) from pg_stat_activity group by 1 order by 2 desc`.
          - alert: PostgresConnectionsClimbing
            expr: sum by (namespace) (pg_stat_activity_count) > 140
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }} Postgres has held over 140 connections for half an hour"
          - alert: PostgresDown
            expr: pg_up == 0
            for: 5m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.namespace }}: the Postgres exporter cannot reach the database"

      - name: spend
        rules:
          # Every SMS costs money and every one is triggered by an unauthenticated request. The
          # plan's protections are a spend cap and a geo permission AT THE PROVIDER; this is what
          # says the cap is about to be reached. Two hundred an hour is far above anything this
          # platform's traffic produces and far below a bill worth noticing.
          - alert: SmsRateHigh
            expr: sum by (namespace) (rate(delivery_sms_sent_total[1h])) * 3600 > 200
            for: 15m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.namespace }} has sent {{ $value | printf \"%.0f\" }} SMS in the last hour"
              description: >-
                Check the verification endpoints for one source repeating. The provider's own spend
                cap is the backstop; this is the warning before it.
          # RECON-04: a settlement that failed used to leave no trace anywhere. It now writes a row,
          # and a row here is money that did not reach whoever it was owed to.
          - alert: SettlementFailuresRecorded
            expr: delivery_settlement_failures > 0
            for: 5m
            labels: { severity: page }
            annotations:
              summary: "{{ $labels.namespace }} has {{ $value }} unresolved settlement failure(s)"
              description: >-
                GET /api/accounting/reconciliation/settlement-failures lists them with the reason.
                Each is an order whose money did not move; they do not resolve on their own.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate.
  #
  # This pod holds a ReadWriteOnce volume, so a rolling update deadlocks by construction: the new
  # pod cannot mount the disk until the old one lets go, and the old one is not terminated until
  # the new one is Ready. It sits in ContainerCreating until somebody notices. One replica of a
  # single-node monitoring stack has nothing to gain from a rolling update anyway — the trade is
  # a few seconds without metrics against a deploy that cannot finish.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            # Not part of `config`: a ConfigMap mount is read-only-but-refreshed, and the scrape
            # jobs read these two files on every scrape so a rotated password lands without a
            # restart. Created by setup-monitoring.sh — the pod stays Pending until it exists,
            # the same way it already does for grafana-admin.
            - name: config-server-auth
              mountPath: /etc/prometheus/config-server-auth
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 10
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 768Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: config-server-auth
          secret: { secretName: config-server-scrape }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
    # Provisioning does not remove what it did not create, so a datasource added by hand in the UI
    # outlives every redeploy of this file and there is no diff anywhere that shows it. One was:
    # a `jaeger` datasource pointing at a tracing backend this platform does not run (tracing is
    # off cluster-wide — OTEL_SDK_DISABLED in platform-common), permanently failing its health
    # check next to the two real ones, so the first thing anyone opening Grafana saw was a broken
    # datasource. Naming it here is what deletes it on the next start, and keeps it deleted.
    deleteDatasources:
      - name: jaeger
        orgId: 1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels: { app: grafana }
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate.
  #
  # This pod holds a ReadWriteOnce volume, so a rolling update deadlocks by construction: the new
  # pod cannot mount the disk until the old one lets go, and the old one is not terminated until
  # the new one is Ready. It sits in ContainerCreating until somebody notices. One replica of a
  # single-node monitoring stack has nothing to gain from a rolling update anyway — the trade is
  # a few seconds without metrics against a deploy that cannot finish.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: grafana-admin, key: username } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin, key: password } }
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.youdrop.shop
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 20m }
            limits: { memory: 384Mi }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints: [websecure]
  tls:
    certResolver: letsencrypt
  routes:
    - kind: Rule
      match: Host(`grafana.youdrop.shop`)
      services: [{ name: grafana, port: 3000 }]
