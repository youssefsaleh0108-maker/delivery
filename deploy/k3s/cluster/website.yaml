# The public site (youdrop.shop): the shopfront, the applicant's registration page and the APK.
#
# Cluster-level rather than per-environment, unlike everything under overlays/: there is one public
# site, not a dev one and a qa one, and rendering it into the per-env template would put two Traefik
# routers on the same hostname and let whichever synced last win.
#
# Static files over stock nginx from a hostPath, the same shape as the portal and for the same
# reason: it has no server side, so an image would mean a registry round trip every time a line of
# copy changes. Contents are pushed with infra/deploy-website.sh.
#
# The nginx config is NOT inlined here. It lives at clients/website/nginx.conf, which is the file a
# developer edits and reads, and the deploy script loads it into the ConfigMap this mounts — one
# source of truth, so the routing on the box cannot drift from the routing in the repository.
apiVersion: v1
kind: Namespace
metadata:
  name: youdrop-site
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: youdrop-site
  labels: { app: website }
spec:
  replicas: 1
  selector:
    matchLabels: { app: website }
  template:
    metadata:
      labels: { app: website }
    spec:
      containers:
        - name: website
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 15
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            # The APK is handed out from this root, so nginx needs room to stream a 70 MB file to
            # several phones at once without being reaped mid-download.
            limits: { memory: 128Mi }
      volumes:
        - name: conf
          configMap: { name: website-nginx }
        - name: web
          hostPath:
            path: /opt/delivery/sites/www
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: youdrop-site
spec:
  selector: { app: website }
  ports:
    - port: 80
      targetPort: 80
---
# www only, on purpose.
#
# The apex youdrop.shop has no A record today, and Traefik asks Let's Encrypt for a certificate per
# hostname in the rule. A name that does not resolve fails the HTTP-01 challenge every time, and
# Let's Encrypt counts those failures against an hourly cap for the whole account — so adding the
# apex before its DNS exists would not merely fail to work, it would jeopardise renewals for every
# other hostname on this box. Add `|| Host("youdrop.shop")` to the match below once the A record
# points at the node, and Traefik will pick the certificate up on the next reload.
# PT-1 for the public site. Its own Middleware rather than the portal's: a Traefik Middleware is
# namespaced, and the ones in overlays/ingress.template.yaml live in delivery-dev and delivery-qa.
# Referencing one of those from here would tie the single public site to one environment's
# namespace, which is exactly the coupling this file exists to avoid.
#
# HSTS matches the portal's: 180 days, no includeSubDomains (hosts that do not exist yet would
# inherit it), no preload (a browser-shipped list is very hard to undo).
#
# The CSP is the whole site's working set, read off the files: three HTML pages, site.js,
# register.js, lib/qr.js, two stylesheets, self-hosted Rubik, local SVG/JPEG. No inline script, no
# inline style (admin.html's <style> block moved to admin.css for this), no data: or blob: URL, no
# third-party origin of any kind.
#
# connect-src names the two hosts clients/website/config.js points at: register.js calls
# /api/onboarding/** and PUTs an applicant's papers to a presigned MinIO URL on the API host, and
# the receipt's document panel exchanges a passcode at the realm's token endpoint on the IAM host.
# THOSE TWO LINES AND config.js MOVE TOGETHER — at go-live, when www stops pointing at dev.
# scripts/verify.sh fails if this policy and config.js name different hosts.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: site-security-headers
  namespace: youdrop-site
spec:
  headers:
    stsSeconds: 15552000
    stsIncludeSubdomains: false
    stsPreload: false
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    contentSecurityPolicy: >-
      default-src 'self';
      script-src 'self';
      style-src 'self';
      img-src 'self';
      font-src 'self';
      connect-src 'self' https://api-dev.youdrop.shop https://iam-dev.youdrop.shop;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none'
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: website
  namespace: youdrop-site
spec:
  entryPoints: [websecure]
  tls:
    certResolver: letsencrypt
  routes:
    - kind: Rule
      match: Host(`www.youdrop.shop`)
      services: [{ name: website, port: 80 }]
      middlewares:
        - { name: site-security-headers }
