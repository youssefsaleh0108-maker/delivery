# k3s ships Traefik as its ingress; this teaches it the three things our compose Traefik knew:
# an ACME resolver for youdrop.shop certificates, a web->https redirect, and somewhere persistent
# to keep acme.json so a pod restart does not re-issue and spend the Let's Encrypt rate limit.
#
# Applied once per cluster (kubectl apply -f), not per environment: both delivery-dev and
# delivery-qa share this one edge, and their IngressRoutes carry the per-environment hostnames.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - --certificatesresolvers.letsencrypt.acme.email=youssef.saleh0108@gmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # The ACME challenge is answered before this redirect applies, so port 80 still validates.
      - --entrypoints.web.http.redirections.entrypoint.to=:443
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    persistence:
      enabled: true
      size: 128Mi
      path: /data
    # Keep the caller's real IP.
    #
    # The default, Cluster, has kube-proxy SNAT every inbound connection to an in-cluster address
    # before Traefik ever sees it — so Traefik observed ONE source for the entire internet, and
    # `platform-rate-limit`, which falls back to the client IP when nothing else is given, applied
    # a single 20 req/s bucket to every user of every app at once. Measured from outside: a
    # quiescent workstation at ~1 req/s got 429 on 16 of 20 probes purely because a different
    # machine was busy. Nothing in the middleware could fix that; the address it needed had already
    # been rewritten.
    #
    # Local preserves the source address, at the cost of only load-balancing to nodes that run a
    # Traefik pod. This is a one-node cluster with one Traefik, so there is nothing to lose here —
    # revisit it if a second node ever joins.
    service:
      spec:
        externalTrafficPolicy: Local
    podSecurityContext:
      fsGroup: 65532
    # fsGroup re-chmods acme.json to 660 on every mount, and Traefik then refuses the whole
    # resolver ("permissions 660 are too open") — serving its default certificate everywhere
    # and issuing nothing. The chart's own documented fix: put it back to 600 before start.
    deployment:
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "touch /data/acme.json && chmod 600 /data/acme.json"]
          volumeMounts:
            - name: data
              mountPath: /data
    # One edge on a one-node cluster; the deployment keeps its default single replica.
