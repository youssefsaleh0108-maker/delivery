# The edge, translated from infra/traefik/dynamic/routes.yml. One difference is load-bearing:
# in compose the API routers matched by path alone; here every rule carries this environment's
# hostname, because dev and qa share the one Traefik.
#
# GENERATED per overlay from overlays/ingress.template.yaml — edit the template, then run
# scripts/render-overlays.sh to regenerate both environments in lockstep.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ops-auth
spec:
  basicAuth:
    # The CRD takes a Secret, not inline users; gen-secrets.sh creates ops-auth-users with the
    # same ops login the compose stack used.
    secret: ops-auth-users
---
# RabbitMQ and MinIO are mounted under a path but believe they own the root of their origin.
# MAILPIT IS NOT IN THIS LIST, deliberately — it is told its webroot (MP_WEBROOT) instead.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-ops-prefix
spec:
  stripPrefix:
    prefixes:
      - /rabbitmq
      - /minio
---
# PT-9. The list is EXACT — one entry per browser origin that actually calls this API.
#
# It used to be three regexes, and the middle one (`^https://[a-z0-9-]+\.youdrop\.shop$`) echoed
# ANY subdomain of youdrop.shop back as an allowed origin, with credentials on. A name that is not
# ours today can become ours tomorrow — a stale DNS record, a forgotten demo host, a subdomain
# takeover — and every one of them was pre-authorised to read this API's answers from a browser.
# The localhost regex did the same for every port on a developer's machine, on a public host.
#
# accessControlAllowCredentials is now FALSE. No client in this repository sends one: nothing sets
# withCredentials or `credentials: 'include'`, nothing reads document.cookie, and both browser
# clients (the Flutter portal and clients/website/register.js) authenticate with a bearer token in
# the Authorization header. With credentials off, `accessControlAllowHeaders: ["*"]` is a legal
# wildcard rather than the illegal one it is beside credentials.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: platform-cors
spec:
  headers:
    accessControlAllowOriginList:
      - https://portal-qa.youdrop.shop
      # The public site: its /register page calls /api/onboarding, and its receipt panel calls the
      # realm's token endpoint. There is ONE www (cluster/website.yaml), and clients/website/config.js
      # points it at ONE environment's API — api-dev today. AT GO-LIVE, when www moves to the
      # production hosts, config.js, the site's CSP in cluster/website.yaml and this line move
      # together; scripts/verify.sh fails if config.js and that CSP disagree.
      - https://www.youdrop.shop
      # Dev only, and rendered away for qa: the ports `flutter run -d chrome` uses for the two web
      # builds, which are the same ports the realm pins as redirect URIs (portal 5010, app 5012).
    accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    accessControlAllowHeaders: ["*"]
    accessControlExposeHeaders: [X-Correlation-Id]
    accessControlAllowCredentials: false
    accessControlMaxAge: 3600
    addVaryHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: platform-rate-limit
spec:
  rateLimit:
    # Per caller, not per platform.
    #
    # These numbers were always meant to be one client's budget, and for a while they were the
    # whole platform's: with externalTrafficPolicy Cluster, every connection reached Traefik from
    # the same SNATed address, so one bucket covered every user of all five apps. ~28 riders on
    # duty, or ~60 merchants with a tab open, were enough to spend it — and because the apps poll,
    # everyone past that saw continuous failure rather than slowness. The edge was delivering
    # around 2% of what the services behind it had been measured serving.
    #
    # The Service now preserves the source address (cluster/traefik-config.yaml), and this says
    # explicitly what it depends on rather than relying on the fallback that quietly did the wrong
    # thing. depth 0: trust the connection's own address, not an X-Forwarded-For a client can write.
    sourceCriterion:
      ipStrategy:
        depth: 0
    # One rider on duty with a job spends ~0.7 req/s and a merchant with tabs alive ~0.33, so this
    # is a wide margin for a single client and still refuses a script.
    average: 20
    burst: 40
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-identity-headers
spec:
  headers:
    customRequestHeaders:
      X-User-Id: ""
      X-User-Roles: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
---
# PT-1. The portal is the back office, the merchant console and the carrier console in one Flutter
# Web app, and until now it answered with none of these: any page on the internet could frame it and
# click Approve, Suspend or Remit through a transparent overlay, and nothing limited what an injected
# script could reach. The API already had `security-headers`; this is the same idea for the one
# origin a human actually opens, plus HSTS and a CSP the API does not need.
#
# HSTS: 180 days, no includeSubDomains, no preload — deliberately. Every name under youdrop.shop
# would inherit a subdomain-wide policy, including hosts that do not exist yet, and `preload` is a
# decision that is very hard to undo (browsers ship the list). Traefik sends the header only on a
# TLS connection, which is the only entrypoint this route has.
#
# The CSP is the working set of a CanvasKit Flutter Web build, checked against the code rather than
# against a login page:
#   script-src   'self' — CanvasKit and the fonts are served from this origin, never from a CDN
#                (clients/apps/delivery_portal/web/flutter_bootstrap.js pins canvasKitBaseUrl, and
#                the build passes --no-web-resources-cdn). 'wasm-unsafe-eval' is what lets the
#                CanvasKit .wasm compile; without it the page renders nothing at all.
#   style-src    'unsafe-inline' — Flutter's engine injects its own <style> elements at startup.
#   img-src      the API host (every photo is a presigned MinIO URL on that host), data: and blob:
#                (a picked file's preview, a generated CSV's download link).
#   connect-src  the API host for REST and presigned PUTs, wss: on the same host for the socket the
#                portal does not open today but shares the code for, the IAM host for the token and
#                logout calls oidc_client_web.dart makes, and blob: because a picked file is read
#                back through an object URL.
#   the tile host is the app's ONE third-party origin. It is the default in
#                clients/packages/delivery_core/lib/src/util/map_tiles.dart; a build that overrides
#                MAP_TILE_URL must change this line too, and scripts/verify.sh fails if the two
#                drift apart.
# frame-ancestors 'none' is the real clickjacking control; frameDeny repeats it as X-Frame-Options
# for anything that predates CSP.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portal-security-headers
spec:
  headers:
    stsSeconds: 15552000
    stsIncludeSubdomains: false
    stsPreload: false
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    contentSecurityPolicy: >-
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https://api-qa.youdrop.shop https://tile.openstreetmap.org;
      font-src 'self';
      connect-src 'self' blob: https://api-qa.youdrop.shop wss://api-qa.youdrop.shop https://iam-qa.youdrop.shop https://tile.openstreetmap.org;
      worker-src 'self' blob:;
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none'
---
# PT-7. The Keycloak admin console and the admin REST API, refused on the public hostname.
#
# Keycloak owns its whole origin, so until now `https://iam-qa.youdrop.shop/admin/master/console/` was a
# login form for the realm administrator, open to the internet, protected by one password and
# whatever brute-force settings the realm happens to carry. Nothing outside the cluster has any
# business there: the portal, the apps and the site use /realms/** only (authorize, token, JWKS,
# logout, the account console), and none of that is touched here.
#
# /admin/realms — the admin REST API — is refused by the same rule. scripts/rotate-secrets.sh was
# the one caller that reached it over this hostname; it now port-forwards to the keycloak Service
# and talks to 127.0.0.1 inside the box, so closing this costs it nothing. Every other script in
# the repository already used the in-cluster address.
#
# Traefik has no "deny" middleware. An allow-list that only admits the loopback address is the
# supported way to spell one: the Service preserves the caller's real address
# (cluster/traefik-config.yaml), depth 0 says to trust that address rather than an X-Forwarded-For
# the caller writes, and everything else gets a 403 before it reaches Keycloak.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-public
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
    ipStrategy:
      depth: 0
---
# The size limit a customer's file for a service order meets before storage. The file is PUT straight
# to MinIO with a URL order-manager signed, and neither the signature nor MinIO can cap a body — while
# the URL works until it expires, as often as whoever holds it likes. order-manager refuses an oversized
# file once it has arrived; this refuses it on the way in, with a 413, before MinIO stores a byte: at
# once when the Content-Length is over, and as soon as the limit is crossed when the body is chunked.
#
# 10 MiB is order-manager's delivery.attachments.max-size-bytes — keep the two in step — plus 64 KiB of
# slack for a client that frames its body. Traefik holds the first MiB of a body in memory and spools
# the rest to disk; downloads on the same route pass through the buffer too, uncapped.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: order-attachment-upload-limit
spec:
  buffering:
    maxRequestBodyBytes: 10551296
    memRequestBodyBytes: 1048576
---
# The same limit for an applicant's identity and vehicle papers (FilePurpose.MERCHANT_KYC), which the
# rider and merchant wizards PUT straight to MinIO with a URL onboarding-service signed for that
# applicant's own application. onboarding-service refuses an oversized file when the upload is
# confirmed; this refuses it on the way in, before MinIO stores a byte of somebody's licence.
#
# 10 MiB is onboarding-service's delivery.storage.minio.max-upload-size-bytes — keep the two in step —
# plus the same 64 KiB of slack. A separate middleware rather than the one above, although the numbers
# match today, because each follows a different service's setting.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: merchant-kyc-upload-limit
spec:
  buffering:
    maxRequestBodyBytes: 10551296
    memRequestBodyBytes: 1048576
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
spec:
  entryPoints: [websecure]
  tls:
    certResolver: letsencrypt
  routes:
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && (PathPrefix(`/api/products`) || PathPrefix(`/api/categories`) || PathPrefix(`/api/stores`) || PathPrefix(`/api/banners`) || PathPrefix(`/api/market`) || PathPrefix(`/api/delivery-zones`) || PathPrefix(`/api/admin/thumbnails`) || PathPrefix(`/api/geocoding`))
      services: [{ name: product-service, port: 8103 }]
      middlewares: &api-mw
        - { name: platform-cors }
        - { name: platform-rate-limit }
        - { name: strip-identity-headers }
        - { name: security-headers }
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && (PathPrefix(`/api/orders`) || PathPrefix(`/api/butler`) || PathPrefix(`/api/delivery-providers`) || PathPrefix(`/api/offers`) || PathPrefix(`/api/partner-keys`) || PathPrefix(`/api/partner`) || PathPrefix(`/api/promotions`) || PathPrefix(`/api/riders`))
      services: [{ name: order-manager, port: 8101 }]
      middlewares: *api-mw
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && (PathPrefix(`/api/tracking`) || PathPrefix(`/ws/tracking`))
      services: [{ name: order-tracking, port: 8102 }]
      middlewares: *api-mw
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && (PathPrefix(`/api/notifications`) || PathPrefix(`/ws/notifications`) || PathPrefix(`/api/chat`))
      services: [{ name: app-notification, port: 8108 }]
      middlewares: *api-mw
    # Notifications Manager owns the direct-send endpoints beneath App Notification's prefix, so
    # this rule MUST outrank the one above it. Traefik does not order by specificity: a route
    # without `priority` gets a priority equal to the LENGTH OF ITS RULE STRING, and the longer
    # string wins. Rendered, this rule is 71 characters and the app-notification rule is 128, so
    # the more specific route loses and /api/notifications/direct reaches App Notification, which
    # has no such endpoint — a 404 with nothing in either service's log to explain it.
    #
    # An explicit priority REPLACES that length, it is not added to it: the previous value of 100
    # was still under 128 and changed nothing. The number has to clear the longest rule in this
    # file (the product-service rule, 290 characters), so 1000 is the value with room for the
    # rules a future service adds. Lengths grow with the hostname too — api-dev is one character
    # longer than api-qa — which is one more reason not to pick a number that only just fits.
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && PathPrefix(`/api/notifications/direct`)
      priority: 1000
      services: [{ name: notifications-manager, port: 8104 }]
      middlewares: *api-mw
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && (PathPrefix(`/api/notification-log`) || PathPrefix(`/api/notification-rates`) || PathPrefix(`/api/notification-preferences`))
      services: [{ name: notifications-manager, port: 8104 }]
      middlewares: *api-mw
    # `/api/rider/` keeps its trailing slash. PathPrefix compares characters, not path segments,
    # so a bare `/api/rider` also swallows /api/riders/{id}/rating — Order Manager's rider ratings,
    # listed on the rule above — and answers it from Accounting, which has no such endpoint. Two
    # prefixes where one is a prefix of the other must be made to differ at a separator.
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && (PathPrefix(`/api/accounting`) || PathPrefix(`/api/points`) || PathPrefix(`/api/rider/`))
      services: [{ name: accounting-service, port: 8115 }]
      middlewares: *api-mw
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && PathPrefix(`/api/settings/connectors`)
      services: [{ name: connector-settings, port: 8109 }]
      middlewares: *api-mw
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && PathPrefix(`/api/transfers`)
      services: [{ name: transfer-service, port: 8118 }]
      middlewares: *api-mw
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && (PathPrefix(`/api/whatsapp`) || PathPrefix(`/webhooks/whatsapp`))
      services: [{ name: whatsapp-service, port: 8116 }]
      middlewares: *api-mw
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && (PathPrefix(`/api/onboarding`) || PathPrefix(`/api/profile`))
      services: [{ name: onboarding-service, port: 8117 }]
      middlewares: *api-mw
    # The DLR callback: authenticated by signature, not token. This routes ONE path to the sms
    # connector; /api/connector/** stays unrouted, deliberately.
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && PathPrefix(`/webhooks/dlr`)
      services: [{ name: sms-connector, port: 8112 }]
      middlewares: *api-mw
    # Object storage over the API hostname. The prefix is NOT stripped: an S3 signature covers
    # host and path, and the bucket name is the first path segment.
    #
    # Routed: every bucket a client reaches with a URL a service minted for it. That is the two
    # public ones (product-images, the apk drop) and the private ones a phone or a browser uses with a
    # presigned URL — user-avatars on this rule, order-attachments and merchant-kyc on rules of their
    # own below, for their upload limits. Routing a private bucket does not open it: MinIO checks
    # every request's signature itself, so a request without one (a guessed URL, a bucket listing) is
    # refused with AccessDenied where an unrouted one met a 404. Only somebody holding a URL a service
    # signed after its own checks gets in, and only until it expires.
    #
    # Unrouted: delivery-proof and receipts. No service signs a URL into either today, so a route
    # would serve nobody. Route one the way merchant-kyc is routed once something does.
    #
    # The 90 below is under this rule's own length (116) and so demotes it, which is harmless only
    # because no other rule matches these three prefixes. Do not read it as the priority band the
    # /api/notifications/direct rule uses.
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && (PathPrefix(`/product-images`) || PathPrefix(`/user-avatars`) || PathPrefix(`/apk`))
      priority: 90
      services: [{ name: minio, port: 9000 }]
      middlewares:
        - { name: security-headers }
    # order-attachments, on a rule of its own for the body limit the other buckets do not carry. It is
    # PRIVATE (no anonymous policy) and routed anyway because all of its traffic is presigned: a
    # customer's phone PUTs the file for a service order, and the provider or back office opens it with
    # a download URL order-manager signed for them. MinIO itself refuses any request to it that carries
    # no valid signature, a bucket listing included. The limit comes first, so an oversized body is
    # refused before anything else handles it. The same 90 as above; no other rule matches this prefix,
    # so the number decides nothing.
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && PathPrefix(`/order-attachments`)
      priority: 90
      services: [{ name: minio, port: 9000 }]
      middlewares:
        - { name: order-attachment-upload-limit }
        - { name: security-headers }
    # merchant-kyc, the same way and for the same reason: PRIVATE, and presigned in both directions.
    # The rider and merchant wizards PUT an applicant's id, licence and vehicle papers with URLs
    # onboarding-service signs for that applicant's own application, and a reviewer — back office, or
    # the delivery company a rider applied to — opens one with a GET signed for them, valid for ten
    # minutes. Unrouted, every one of those uploads met Traefik's own 404 and the papers an application
    # is judged on never reached storage. Its own limit runs first; the same 90, deciding nothing,
    # since no other rule matches this prefix.
    - kind: Rule
      match: Host(`api-qa.youdrop.shop`) && PathPrefix(`/merchant-kyc`)
      priority: 90
      services: [{ name: minio, port: 9000 }]
      middlewares:
        - { name: merchant-kyc-upload-limit }
        - { name: security-headers }
---
# Keycloak owns its whole origin: /realms, /resources, the account and admin consoles.
# KEYCLOAK_PUBLIC_URL must match this hostname exactly or every token's issuer is refused.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
spec:
  entryPoints: [websecure]
  tls:
    certResolver: letsencrypt
  routes:
    # The admin console and the admin REST API, refused from outside (see `deny-public` above).
    # An explicit priority rather than the length this rule happens to have: the rule below owns
    # the whole host and would win the moment somebody lengthened it, and a deny that silently
    # stops applying is the worst kind. 1000 is the band this file already uses for "this rule
    # must outrank its neighbour" — see the /api/notifications/direct note.
    - kind: Rule
      match: Host(`iam-qa.youdrop.shop`) && PathPrefix(`/admin`)
      priority: 1000
      services: [{ name: keycloak, port: 8080 }]
      middlewares:
        - { name: deny-public }
    - kind: Rule
      match: Host(`iam-qa.youdrop.shop`)
      services: [{ name: keycloak, port: 8080 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal
spec:
  entryPoints: [websecure]
  tls:
    certResolver: letsencrypt
  routes:
    - kind: Rule
      match: Host(`portal-qa.youdrop.shop`)
      services: [{ name: portal, port: 8200 }]
      middlewares:
        - { name: portal-security-headers }
---
# The ops tools, all behind the shared basic auth: the mail sink holds every verification code
# the platform issues, the broker console can purge queues, the object console can read and
# delete every file. Basic auth over TLS is the floor for a dev box, not a good answer.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: monitoring
spec:
  entryPoints: [websecure]
  tls:
    certResolver: letsencrypt
  routes:
    - kind: Rule
      match: Host(`monitoring-qa.youdrop.shop`) && PathPrefix(`/rabbitmq`)
      services: [{ name: rabbitmq, port: 15672 }]
      middlewares:
        - { name: ops-auth }
        - { name: strip-ops-prefix }
    - kind: Rule
      match: Host(`monitoring-qa.youdrop.shop`) && PathPrefix(`/mailpit`)
      services: [{ name: mailpit, port: 8025 }]
      middlewares:
        - { name: ops-auth }
    - kind: Rule
      match: Host(`monitoring-qa.youdrop.shop`) && PathPrefix(`/minio`)
      services: [{ name: minio, port: 9001 }]
      middlewares:
        - { name: ops-auth }
        - { name: strip-ops-prefix }
    - kind: Rule
      match: Host(`monitoring-qa.youdrop.shop`) && Path(`/`)
      services: [{ name: portal, port: 8200 }]
      middlewares:
        - { name: ops-auth }
        # The same app, so the same policy. Only this rule: the broker, mail and object consoles
        # below are third-party pages with their own inline scripts, and a CSP written for Flutter
        # would break all three.
        - { name: portal-security-headers }
