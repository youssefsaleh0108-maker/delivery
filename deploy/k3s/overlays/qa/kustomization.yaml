apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: delivery-qa

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

configMapGenerator:
  - name: platform-env
    literals:
      # What this environment IS, and the switch that turns it into production.
      #
      # `test` today. Changing this one line to `production` is what makes the cutover real:
      # base/demo-storefront-gate.yaml then deletes the eight demo shops and proves they are gone,
      # and scripts/verify.sh starts REFUSING every line below that is marked "test only" —
      # TEST_CODE_SINK_ENABLED, SIMULATE_WALLETS, WHATSAPP_SIMULATOR_ENABLED. So the failing
      # verify run is the checklist: it names, one by one, everything still to be changed.
      - ENVIRONMENT_TIER=test
      # TEST ONLY, and each must go when the line above says production (PD-1). They are here
      # rather than in platform-common because a default in a shared file is a default production
      # inherits silently — SIMULATE_WALLETS in particular offers a customer a wallet payment that
      # never happens, for an order the platform then treats as paid.
      - SIMULATE_WALLETS=true
      - WHATSAPP_SIMULATOR_ENABLED=true
      - KEYCLOAK_PUBLIC_URL=https://iam-qa.youdrop.shop
      - KEYCLOAK_ISSUER_URI=https://iam-qa.youdrop.shop/realms/delivery-platform
      - MINIO_PUBLIC_ENDPOINT=https://api-qa.youdrop.shop
      # PT-9. The same list as the platform-cors middleware in overlays/ingress.template.yaml, which
      # is what a browser actually meets; this one is app-notification's WebSocket origin check.
      # Exact origins, no loopback (that is dev's, and this host is shared) and no
      # app-qa.youdrop.shop — that name has had no route since the compose stack. www is here
      # because clients/website/config.js will point the one public site at this API when it is
      # promoted; until then www talks to dev and this entry admits nobody.
      - CORS_ALLOWED_ORIGINS=https://portal-qa.youdrop.shop,https://www.youdrop.shop
      # QA SENDS REAL MAIL like dev, at the operator's request - same relay, same noreply
      # sender. The password lives in delivery-qa's platform-secrets on the box.
      - SMTP_HOST=smtp.office365.com
      - SMTP_PORT=587
      - SMTP_USER=noreply@youdrop.shop
      - SMTP_AUTH=true
      - SMTP_STARTTLS=true
      - EMAIL_FROM=noreply@youdrop.shop
      - SMS_TEST_INBOX=youssef.saleh0108@gmail.com
      # Notifications Manager's test code sink. The delivery log masks every one-time code, so the
      # smoke tests read theirs from notification.test_code_sink, which keeps codes ONLY for
      # @youdrop.test addresses (a reserved domain nobody can own). A test environment's switch:
      # when this overlay is copied to make production, this line must not come with it.
      - TEST_CODE_SINK_ENABLED=true
      # Rider positions from outside Lebanon (+~15 km) are refused, as in platform-common. Stated
      # here as well because qa is becoming production: turning it off must be a visible edit.
      - TRACKING_SERVICE_AREA_ENABLED=true

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: portal
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /opt/delivery/sites/qa/portal

  # -------------------------------------------------------------------------- resource safety
  # This namespace becomes production in place, on a node it shares with dev. See
  # cluster/priority-classes.yaml: `prod-critical` is what makes the scheduler preempt dev to place
  # a pod here, and what puts this namespace last in the kubelet's eviction order. `name: .*` is a
  # regex, so a workload added later cannot forget it, and scripts/verify.sh fails if any pod in
  # the rendered overlay has no priorityClassName.
  #
  # There is deliberately no ResourceQuota here. dev gets one because dev is the half that may be
  # squeezed; a quota on production would mean a pod refused at admission during an incident.
  - target: { kind: Deployment, name: ".*" }
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: prod-critical
  - target: { kind: StatefulSet, name: ".*" }
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: prod-critical
  - target: { kind: Job, name: ".*" }
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: prod-critical
  - target: { kind: CronJob, name: ".*" }
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/priorityClassName
        value: prod-critical

  # ------------------------------------------------------------------------------- backups ON
  # base/backup.yaml ships all three suspended, so a namespace created later starts safe rather
  # than starting to upload. This is the environment whose data matters, so this is where they run.
  #
  # Un-suspending them does NOT start backing anything up on its own: until the `backup-rclone` and
  # `backup-age` Secrets exist on the box, each run says what is missing and exits 0, and the
  # BackupNotConfigured alert is what reports the state. See base/backup.yaml for the exact keys.
  - target: { kind: CronJob, name: "^(postgres-backup|minio-backup|restore-test)$" }
    patch: |-
      - op: replace
        path: /spec/suspend
        value: false

  # Postgres asks for exactly what it is allowed to use.
  #
  # Base requests 512Mi against a 1536Mi limit, which is Burstable: the kubelet computes a
  # container's OOM score from how far its usage sits above its REQUEST, so a Postgres using 1.2
  # GiB of its legitimate 1.5 GiB scores as a process 700 MiB over budget and is a prime candidate
  # — ahead of a dev JVM sitting quietly inside its own request. With request == limit that
  # arithmetic disappears and Postgres becomes the last thing on the node the kernel reaches for.
  # It also means the scheduler reserves the whole 1.5 GiB, so nothing else can be placed into
  # memory Postgres is entitled to.
  #
  # CPU is deliberately left alone: platform-common's JVM flags are chosen for a node with NO CPU
  # limits (see its comment), so adding one here would change the thing that comment warns about.
  # The pod's QoS class therefore stays Burstable; the protection being bought is the memory one.
  - target: { kind: StatefulSet, name: postgres }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1536Mi

# Which build each service runs.
#
# PIN-1. Every line here used to be a MOVING tag: `:main` for the thirteen GHCR services and `:qa`
# for order-manager. That is the one thing an environment becoming production cannot keep. A pod
# restarts for an unrelated reason — an eviction, a node reboot, a limit breach — re-pulls the tag,
# and comes back on a build nobody chose, at an hour nobody picked, with no diff anywhere saying
# so. The plan calls this "build once, then promote that same build" (item 11).
#
# These digests are what each tag resolved to on 2026-09-20, so this is a PIN, not a promotion:
# applying it does not change which build qa runs, it freezes it. order-manager is by digest rather
# than by an immutable tag because its CI published no `sha-` tag for the build `:qa` points at
# (2026-09-04); every other repository publishes one, and the promotion PR below uses those.
#
# THE LAUNCH BUILD IS A SEPARATE, DELIBERATE DECISION. To promote the build that has soaked on dev,
# replace each digest here with the `sha-` tag from overlays/dev/kustomization.yaml — today
# `sha-12a3b2775cd2a6c377482c7efcd2fdab9aa523f7` for all thirteen, and
# `sha-044d1b8b2a5b22d6143bbfa05ec8b688f35d564f` for order-manager — in a PR of its own, so the
# build change is reviewable on its own and revertible on its own.
images:
- name: docker.io/youssefsaleh0108/delivery-order-manager
  digest: sha256:36f360f3045aef2c91144d39c7e6761b220a95646dbbc707733cd6bd8a45b980
