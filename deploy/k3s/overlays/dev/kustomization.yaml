apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: delivery-dev

resources:
- namespace.yaml
- ../../base
- ingress.yaml
- resource-safety.yaml

  # DEV SENDS REAL MAIL through the operator's relay — these override platform-common's
  # mailpit sink (envFrom: the later source wins). qa deliberately keeps the sink: a test
  # environment that can mail whatever address somebody typed is the failure mode.
  # SMTP_PASSWORD is the Gmail app password, living only in platform-secrets on the box.
  # SMS_TEST_INBOX must be a mailbox the operator owns once the relay is real — every
  # simulated SMS becomes an actual email to it.
  # Notifications Manager's test code sink. The delivery log masks every one-time code, so the
  # smoke tests read theirs from notification.test_code_sink, which keeps codes ONLY for
  # @youdrop.test addresses (a reserved domain nobody can own). A test environment's switch:
  # never copy it into a production overlay.
  # Riders are approved as soon as their email is verified (the owner's decision, 2026-09-19).
  # A value set from the portal's auto-approval screen wins over this one; dev has none for riders.
  # Dev only: accept rider positions from anywhere. Emulators report Mountain View, and dev's
  # riders are mostly emulators. Overrides platform-common's "true"; qa keeps it on.
  # PT-9. The same list as the platform-cors middleware in overlays/ingress.template.yaml, which is
  # what a browser actually meets; this one is app-notification's WebSocket origin check. Exact
  # origins, no `http://localhost:*` wildcard, and no app-dev.youdrop.shop — that name has had no
  # route since the compose stack (infra/traefik/dynamic/routes.yml) and resolves to nothing.
  # What this environment IS. Read by base/demo-storefront-gate.yaml, which keeps the eight demo
  # shops here and deletes them in a production environment, and by scripts/verify.sh, which
  # refuses a `production` overlay that still carries any of the switches below.
  # The simulators, back ON — explicitly, here, rather than as a default in platform-common that
  # every environment inherited including production (PD-1).
  # Nominatim sees this; dev's requests should not look like the live shop's.
  # A smaller heap FRACTION, because dev's containers are smaller (see resource-safety.yaml).
  #
  # platform-common sets MaxRAMPercentage=70 against a 512Mi limit, which leaves ~154Mi outside the
  # heap — the figure its comment says fits C1 and SerialGC. dev's limit is 416Mi to fit the 9 GiB
  # quota, and 70% of that would leave only ~125Mi, which is BELOW that figure: the same
  # OOMKill-restart-repeat spiral the comment describes, times fourteen. 60% of 416Mi leaves
  # ~166Mi, slightly MORE non-heap room than dev has today, and a 250Mi heap ceiling instead of
  # 358Mi. The services idle at 160-350Mi of total RSS, so this trades heap headroom (they will
  # collect more often) for the native headroom that is what actually kills a container.
  #
  # envFrom order makes this win: platform-common is applied first, platform-env second. qa keeps
  # 512Mi and 70%, unchanged — production is not the environment that gets squeezed.
configMapGenerator:
- literals:
  - ENVIRONMENT_TIER=development
  - SIMULATE_WALLETS=true
  - WHATSAPP_SIMULATOR_ENABLED=true
  - NOMINATIM_USER_AGENT=YouDrop-dev (youssef.saleh0108@gmail.com)
  - KEYCLOAK_PUBLIC_URL=https://iam-dev.youdrop.shop
  - KEYCLOAK_ISSUER_URI=https://iam-dev.youdrop.shop/realms/delivery-platform
  - MINIO_PUBLIC_ENDPOINT=https://api-dev.youdrop.shop
  - CORS_ALLOWED_ORIGINS=https://portal-dev.youdrop.shop,https://www.youdrop.shop,http://localhost:5010,http://127.0.0.1:5010,http://localhost:5012,http://127.0.0.1:5012
  - SMTP_HOST=smtp.office365.com
  - SMTP_PORT=587
  - SMTP_USER=noreply@youdrop.shop
  - SMTP_AUTH=true
  - SMTP_STARTTLS=true
  - EMAIL_FROM=noreply@youdrop.shop
  - SMS_TEST_INBOX=youssef.saleh0108@gmail.com
  - TEST_CODE_SINK_ENABLED=true
  - AUTO_APPROVE_RIDER=true
  - TRACKING_SERVICE_AREA_ENABLED=false
  - JAVA_OPTS=-XX:MaxRAMPercentage=60 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1
    -XX:+UseSerialGC -Xss512k
  name: platform-env

generatorOptions:
  disableNameSuffixHash: true

# order-manager lives in its own repository and nothing bumps this overlay when it builds, so this
# annotation was the only record of which build dev was meant to run — while the image tag was the
# moving `:develop`, with imagePullPolicy: Always. The two had already come apart: this said
# `429ce9e` while `:develop` pointed at build `044d1b8b` (2026-09-20). The image below is now
# pinned to that same build's immutable `sha-` tag, so the annotation and the image cannot disagree
# again; keep them in step when you promote a new order-manager build.

# ---------------------------------------------------------------------------- resource safety
# Everything below exists because dev and production share one 23 GiB node with no swap. See
# resource-safety.yaml for the quota these figures are fitted to, and cluster/priority-classes.yaml
# for what the priority buys.

# Every workload in this namespace is the one that gets preempted and the one that gets evicted
# first. `name: .*` is a regex, so this is one patch per kind rather than one per workload — and a
# workload added later cannot forget it. scripts/verify.sh fails if any pod in the rendered overlay
# has no priorityClassName.
# A CronJob's pod template is one level deeper. dev's backup CronJobs stay SUSPENDED (base sets
# that): dev's data is demo data, and dev's 9 GiB quota has no room for another pod — a backup pod
# here would be refused at admission and the CronJob would report a failure every hour. To run one
# by hand for a test, scale a service to zero first, or test on the environment that is becoming
# production, which is the one whose backups matter.

# The fourteen Spring services: 512Mi -> 416Mi, paired with the 60% heap fraction above. This is
# the one change on this branch that has not been measured against a running service, so it goes to
# dev first and is watched for a day. If pods start restarting with reason OOMKilled, the way back
# is these two numbers: 512Mi here and MaxRAMPercentage=70 in platform-env, plus limits.memory 11Gi
# in resource-safety.yaml, and dev is exactly as it was.

# The data layer, sized for what dev actually holds: a 34 MB delivery database, 13 MB of Keycloak,
# 68 MB of objects. Postgres keeps shared_buffers=512MB from base, so 1Gi is the floor rather than
# a target. Keycloak is NOT reduced — it was OOMKilled at 1Gi on this very node, and taking it
# lower is the one cut that is certain to break something.
# A sink dev does not send to: dev mails through the M365 relay (SMTP_HOST above), so mailpit here
# holds nothing but whatever a test pointed at it by hand.
# nginx serving a directory of static files. 96Mi was the compose stack's number and nothing has
# ever come near it; 64Mi is what pays for the postgres-exporter inside dev's 9 GiB.
# Two containers in one pod: a dev-mode Vault holding about twenty KV entries, and a shell script
# that re-seeds them from platform-secrets.
patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/volumes/1/hostPath/path
      value: /opt/delivery/sites/dev/portal
  target:
    kind: Deployment
    name: portal
- patch: |-
    - op: add
      path: /spec/template/metadata/annotations/youdrop.shop~1order-manager-build
      value: "057af6b8"
  target:
    kind: Deployment
    name: order-manager
- patch: |-
    - op: add
      path: /spec/template/spec/priorityClassName
      value: dev-standard
  target:
    kind: Deployment
    name: .*
- patch: |-
    - op: add
      path: /spec/template/spec/priorityClassName
      value: dev-standard
  target:
    kind: StatefulSet
    name: .*
- patch: |-
    - op: add
      path: /spec/template/spec/priorityClassName
      value: dev-standard
  target:
    kind: Job
    name: .*
- patch: |-
    - op: add
      path: /spec/jobTemplate/spec/template/spec/priorityClassName
      value: dev-standard
  target:
    kind: CronJob
    name: .*
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 416Mi
  target:
    kind: Deployment
    name: ^(product-service|order-manager|order-tracking|transfer-service|connector-settings|notifications-manager|app-notification|email-connector|push-connector|sms-connector|accounting-service|whatsapp-service|onboarding-service|config-server)$
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 1024Mi
  target:
    kind: StatefulSet
    name: postgres
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 96Mi
  target:
    kind: StatefulSet
    name: redis
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 352Mi
  target:
    kind: StatefulSet
    name: rabbitmq
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 256Mi
  target:
    kind: StatefulSet
    name: minio
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 64Mi
  target:
    kind: Deployment
    name: mailpit
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 64Mi
  target:
    kind: Deployment
    name: portal
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 128Mi
    - op: replace
      path: /spec/template/spec/containers/1/resources/limits/memory
      value: 96Mi
  target:
    kind: Deployment
    name: vault

# Which build each service runs. CI rewrites these lines after every image build on this
# environment's branch (see reusable-service-ci.yml, update-environment-manifest) and Argo CD
# deploys the result — edit by merge, not by hand.
  # Was `develop`, which moves on every order-manager merge (PIN-1). This is the build `develop`
  # pointed at on 2026-09-22, by its own immutable tag.
