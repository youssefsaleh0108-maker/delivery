apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: delivery-dev

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

configMapGenerator:
  - name: platform-env
    literals:
      - KEYCLOAK_PUBLIC_URL=https://iam-dev.youdrop.shop
      - KEYCLOAK_ISSUER_URI=https://iam-dev.youdrop.shop/realms/delivery-platform
      - MINIO_PUBLIC_ENDPOINT=https://api-dev.youdrop.shop
      - CORS_ALLOWED_ORIGINS=https://portal-dev.youdrop.shop,https://app-dev.youdrop.shop,http://localhost:*,http://127.0.0.1:*
      # DEV SENDS REAL MAIL through the operator's relay — these override platform-common's
      # mailpit sink (envFrom: the later source wins). qa deliberately keeps the sink: a test
      # environment that can mail whatever address somebody typed is the failure mode.
      # SMTP_PASSWORD is the Gmail app password, living only in platform-secrets on the box.
      # SMS_TEST_INBOX must be a mailbox the operator owns once the relay is real — every
      # simulated SMS becomes an actual email to it.
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=youssef.saleh0108@gmail.com
      - SMTP_AUTH=true
      - SMTP_STARTTLS=true
      - EMAIL_FROM=youssef.saleh0108@gmail.com
      - SMS_TEST_INBOX=youssef.saleh0108@gmail.com

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: portal
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /opt/delivery/sites/dev/portal

# Which build each service runs. CI rewrites these lines after every image build on this
# environment's branch (see reusable-service-ci.yml, update-environment-manifest) and Argo CD
# deploys the result — edit by merge, not by hand.
images:
  - name: ghcr.io/youssefsaleh0108-maker/product-service
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/order-tracking
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/transfer-service
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/connector-settings
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/notifications-manager
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/app-notification
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/email-connector
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/push-connector
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/sms-connector
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/accounting-service
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/whatsapp-service
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/onboarding-service
    newTag: main
  - name: ghcr.io/youssefsaleh0108-maker/config-server
    newTag: main
