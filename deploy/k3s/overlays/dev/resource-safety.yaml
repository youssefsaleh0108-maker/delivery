# What dev is allowed to take from a box it shares with production.
#
# The node is 8 vCPU / 23 GiB with NO SWAP, and dev is the half that changes on every merge. The
# first answer here was a 9 GiB ResourceQuota on the sum of this namespace's memory limits. It was
# applied on 2026-09-20 and it took dev down.
#
# WHY, so nobody adds it back in the same shape: a quota sized for the steady state has no room
# for a rolling update. Kubernetes starts the new pod before it stops the old one, so a rollout
# needs the namespace to hold both for a minute. At 8.9 of 9 GiB it could not, admission refused
# every new pod, and the rollouts deadlocked — including the StatefulSets, whose pods had already
# been deleted. dev lost its database and its broker, and every service went unready behind them.
# Nothing was lost (the volumes are separate) but the environment was down until the quota went.
#
# What protects production now: the PriorityClasses in cluster/priority-classes.yaml. Under memory
# pressure the kernel and the scheduler take from dev-standard before prod-critical, which is the
# guarantee that actually matters, and it costs no headroom.
#
# If a quota comes back it needs BOTH: a ceiling with room for the largest rollout on top of the
# steady state (about 11 GiB today), and maxSurge: 0 on the deployments so a rollout replaces
# rather than doubles. Prove it by rolling every deployment once before calling it done.
#
# The LimitRange below stays: it gives a pod that names no limits a sane one, which is a default,
# not a ceiling, and cannot refuse anything.

# The safety net under the quota above.
#
# A ResourceQuota that names limits.memory makes a memory limit COMPULSORY for every container in
# the namespace: one without a limit is not defaulted, it is refused. For a Deployment that shows
# up as a ReplicaSet that never produces a pod and an error two levels down from where anyone is
# looking. This makes the failure impossible instead — a container that declares no limit gets
# these, and starts.
#
# The defaults are deliberately small, so leaning on them is a mistake that surfaces as one pod
# under pressure rather than as a namespace over budget. Everything in base/ declares its own
# limits and scripts/verify.sh fails if one stops doing so; the one container that relies on this
# is the `mc` bucket-bootstrap Job, whose spec is immutable once it has Completed and so cannot be
# given limits without renaming the Job.
apiVersion: v1
kind: LimitRange
metadata:
  name: dev-defaults
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        memory: 128Mi
