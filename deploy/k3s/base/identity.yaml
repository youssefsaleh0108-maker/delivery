# Keycloak, importing the realm on first boot against a fresh database — the realm file carries
# the clients AND the demo logins (customer/rider/merchant/backoffice/carrier), so a new
# environment is usable the moment this is Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: { app: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: platform-secrets, key: KEYCLOAK_ADMIN } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: KEYCLOAK_ADMIN_PASSWORD } }
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: delivery
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } }
            # Pins ONE issuer value — the public hostname clients see (per-env, from platform-env).
            # Services fetch JWKS internally; both sides must agree or every token is refused.
            - name: KC_HOSTNAME
              valueFrom: { configMapKeyRef: { name: platform-env, key: KEYCLOAK_PUBLIC_URL } }
            - name: KC_HOSTNAME_STRICT
              value: "false"
            # Behind the edge, Keycloak must trust the forwarded headers or it builds redirects
            # from the plain-HTTP connection it actually sees.
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
            - containerPort: 9000
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: theme
              mountPath: /opt/keycloak/themes/delivery/login/theme.properties
              subPath: theme.properties
              readOnly: true
            - name: theme
              mountPath: /opt/keycloak/themes/delivery/login/resources/css/delivery.css
              subPath: delivery.css
              readOnly: true
          startupProbe:
            httpGet: { path: /health/started, port: 9000 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            periodSeconds: 30
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits: { memory: 1Gi }
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
            items:
              - key: realm-delivery-platform.json
                path: realm-delivery-platform.json
        - name: theme
          configMap: { name: keycloak-theme }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports:
    - port: 8080
      targetPort: 8080
---
# Vault in dev mode: in-memory, auto-unsealed, root token pinned from platform-secrets.
#
# Reboot survival does NOT need persistent storage: every value Vault holds is a projection of
# platform-secrets (which lives in the k3s datastore and survives a reboot) plus the dev literals
# in bootstrap.sh, and no service writes Vault at runtime. The `vault-reseed` sidecar re-seeds
# AppRole + policies + KV from platform-secrets on every pod start (and re-heals a vault-container
# restart), replacing the one-shot vault-init Job — a Job is immutable, Completes once, and never
# re-runs on reboot, which is exactly what took the platform down on 2026-09-05. A production Vault
# (raft + KMS auto-unseal + off-box backups) is its own project.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels: { app: vault }
spec:
  replicas: 1
  # Single node, no PVC: never run two in-memory dev vaults behind one Service at once, or
  # config-server can hit a fresh unseeded pod mid-rollout. Recreate = old pod gone before new.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: vault }
  template:
    metadata:
      labels: { app: vault }
    spec:
      containers:
        # 1) The dev-mode server — unchanged from before except it no longer runs alone in the pod.
        - name: vault
          image: hashicorp/vault:1.18
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom: { secretKeyRef: { name: platform-secrets, key: VAULT_ROOT_TOKEN } }
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
          securityContext:
            capabilities:
              add: [IPC_LOCK]
          ports:
            - containerPort: 8200
          readinessProbe:
            httpGet: { path: /v1/sys/health, port: 8200 }   # dev mode → 200 immediately (unsealed)
            periodSeconds: 10
          resources:
            requests: { memory: 64Mi, cpu: 20m }
            limits: { memory: 192Mi }
        # 2) The reconcile sidecar. Seeds on start; re-heals on a vault-container restart. The pod
        #    (and therefore the vault Service endpoint) becomes Ready ONLY once THIS container's
        #    readiness probe passes — i.e. only after the seed has run to its completion marker — so
        #    config-server's AppRole login cannot race ahead of the seed on a cold boot. Seeding and
        #    probing talk to Vault over loopback, never the Service, so the sidecar's own readiness
        #    never gates its work (no deadlock).
        - name: vault-reseed
          image: hashicorp/vault:1.18
          command: ["/bin/sh", "/bootstrap/reconcile.sh"]
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
            - name: RESEED_INTERVAL
              value: "15"
            # Identical credential wiring to the retired vault-init Job — proven, low-risk.
            - name: VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: platform-secrets, key: VAULT_ROOT_TOKEN } }
            - name: CONFIG_SERVER_ROLE_ID
              valueFrom: { secretKeyRef: { name: platform-secrets, key: VAULT_ROLE_ID } }
            - name: CONFIG_SERVER_SECRET_ID
              valueFrom: { secretKeyRef: { name: platform-secrets, key: VAULT_SECRET_ID } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: RABBITMQ_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: REDIS_PASSWORD } }
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_PASSWORD } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } }
            # From platform-secrets, never a literal: bootstrap.sh writes secret/email-connector
            # with this value, and a hardcoded "" would ERASE the relay password on every reseed.
            # Safe only because the value comes from the datastore (survives reboot).
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: SMTP_PASSWORD
          # Ready only when Vault is fully seeded (AppRole present AND the completion marker written).
          # Uses VAULT_ADDR + VAULT_TOKEN from this container's env; redirects hide secret output.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "vault read auth/approle/role/config-server >/dev/null 2>&1 && vault kv get secret/_seed_complete >/dev/null 2>&1"
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: policies
              mountPath: /policies
              readOnly: true
          resources:
            # The vault CLI spikes while bootstrap.sh runs its ~16 kv puts; 64Mi OOM-killed the
            # sidecar (exit 137) under post-reboot memory pressure, so give it real headroom. It
            # mostly sleeps, so requests stay small.
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 160Mi }
      volumes:
        # The whole vault-bootstrap CM (bootstrap.sh + reconcile.sh), not a single item.
        - name: bootstrap
          configMap:
            name: vault-bootstrap
        - name: policies
          configMap:
            name: vault-policies
---
apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  selector: { app: vault }
  ports:
    - port: 8200
      targetPort: 8200
# NOTE: the vault-init Job is intentionally gone — the reseed sidecar subsumes it. Argo prune is
# OFF, so the already-Completed live Jobs (vault-init, and any hand-made vault-reseed-boot) are not
# deleted by this change; the migration deletes them by hand once per namespace.
---
# The Config Server: JDBC + Vault composite backend. Everything else waits on it in practice —
# a service that cannot resolve its configuration restarts until this is Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels: { app: config-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-server }
  template:
    metadata:
      labels: { app: config-server }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8888"
    spec:
      containers:
        - name: config-server
          image: ghcr.io/youssefsaleh0108-maker/config-server:main
          envFrom:
            - configMapRef: { name: platform-common }
            - secretRef: { name: platform-secrets }
          env:
            - name: SERVER_PORT
              value: "8888"
            # platform-common sets SPRING_PROFILES_ACTIVE=docker for the services; on the Config
            # Server that env var would override application.yml's `${CONFIG_PROFILES:composite}`
            # and silently select the git backend. An explicit container env wins over envFrom.
            - name: SPRING_PROFILES_ACTIVE
              value: composite
            - name: CONFIG_PROFILES
              value: composite
            - name: CONFIG_DB_URL
              value: jdbc:postgresql://postgres:5432/delivery?currentSchema=config
            - name: CONFIG_DEFAULT_LABEL
              value: main
            - name: VAULT_HOST
              value: vault
            - name: VAULT_PORT
              value: "8200"
            - name: VAULT_SCHEME
              value: http
            - name: VAULT_BACKEND
              value: secret
          ports:
            - containerPort: 8888
          startupProbe:
            tcpSocket: { port: 8888 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 8888 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8888 }
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
spec:
  selector: { app: config-server }
  ports:
    - port: 8888
      targetPort: 8888
