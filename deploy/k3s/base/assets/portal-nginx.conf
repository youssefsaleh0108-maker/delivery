# The Backoffice / Merchant / Carrier portal, served as static files.
#
# 8200 inside the container as well as outside. The firewall on this box filters on the CONTAINER
# port, not the published one — Docker DNATs in PREROUTING before the FORWARD chain is consulted,
# so a rule naming the published port never matches. Keeping both the same is what makes the rule
# readable, and is why this does not simply listen on 80.
server {
    listen 8200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A single-page app owns its own routing, so every path that is not a real file has to return
    # index.html. Without this a refresh on any screen but the first returns 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CanvasKit, fonts and images can be cached hard — their contents do not change between
    # deploys of OUR code, and the wasm is versioned by its directory.
    location ~* \.(wasm|woff2|png|svg|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # The app's own JS must NOT be cached, and the reason is that none of it is content-hashed.
    # main.dart.js is the entire application under a name that never changes; flutter_bootstrap.js
    # decides which build to load; flutter_service_worker.js is the worst of the three, because a
    # browser holding a stale one keeps serving the OLD app from the worker's cache and never asks
    # the network at all. The previous blanket 7-day rule on *.js is exactly how a redeploy stayed
    # invisible for a week: the deploy was live on the server while every returning browser kept
    # the old portal. no-cache (revalidate, ETag makes it cheap) rather than no-store, so an
    # unchanged 3.7MB main.dart.js still answers 304.
    location ~* \.js$ {
        add_header Cache-Control "no-cache";
    }

    # index.html and the build marker must not be cached either, same reasoning.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
