          image: ghcr.io/youssefsaleh0108-maker/accounting-service:main
          envFrom:
            - configMapRef: { name: platform-common }
            - configMapRef: { name: platform-env }
            - secretRef: { name: platform-secrets }
          env:
            - name: SERVER_PORT
              value: "8115"
          ports:
            - containerPort: 8115
          # Ask the application, not the socket.
          #
          # A tcpSocket check passes as soon as Tomcat's acceptor binds, which it does before the
          # context has finished starting and keeps doing after the connection pool has died. So
          # readiness never removed a sick pod from the Service and liveness never restarted a
          # wedged one — and every rolling update declared the replacement Ready the instant the
          # port opened, then sent it traffic it could not yet serve. The actuator groups these
          # point at have been answering correctly the whole time; the manifests simply did not
          # ask. See each service's management.endpoint.health.group for what readiness includes.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8115 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8115 }
            periodSeconds: 10
          # Liveness asks only whether the JVM is still a working application — never whether its
          # dependencies are up. A restart cannot fix somebody else's database, and conflating the
          # two would kill every pod on the platform during a blip it would otherwise ride out.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8115 }
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 512Mi }
