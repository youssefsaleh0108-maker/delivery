# The Spring services, one Deployment + ClusterIP Service each, replicas pinned to 1 (single
# node, two environments). Generated from infra/docker-compose.dev.yml — the shared environment
# comes from platform-common + platform-env + platform-secrets; only what is service-specific
# is spelled out per Deployment. The prometheus.io annotations are what the monitoring stack
# discovers scrape targets by.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels: { app: product-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8103"
    spec:
      # Longer than spring.lifecycle.timeout-per-shutdown-phase, so a draining pod finishes on
      # its own terms rather than being cut off mid-request.
      terminationGracePeriodSeconds: 40
      containers:
        - name: product-service
          image: ghcr.io/youssefsaleh0108-maker/product-service:main
          envFrom:
            - configMapRef: { name: platform-common }
            - configMapRef: { name: platform-env }
            - secretRef: { name: platform-secrets }
          env:
            - name: SERVER_PORT
              value: "8103"
          ports:
            - containerPort: 8103
          # Ask the application, not the socket.
          #
          # A tcpSocket check passes as soon as Tomcat's acceptor binds, which it does before the
          # context has finished starting and keeps doing after the connection pool has died. So
          # readiness never removed a sick pod from the Service and liveness never restarted a
          # wedged one — and every rolling update declared the replacement Ready the instant the
          # port opened, then sent it traffic it could not yet serve. The actuator groups these
          # point at have been answering correctly the whole time; the manifests simply did not
          # ask. See each service's management.endpoint.health.group for what readiness includes.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8103 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8103 }
            periodSeconds: 10
          # Liveness asks only whether the JVM is still a working application — never whether its
          # dependencies are up. A restart cannot fix somebody else's database, and conflating the
          # two would kill every pod on the platform during a blip it would otherwise ride out.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8103 }
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector: { app: product-service }
  ports:
    - port: 8103
      targetPort: 8103
---
