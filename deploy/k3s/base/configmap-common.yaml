# The environment every Spring service shares and that is the SAME in dev and qa: internal
# addresses (service DNS inside the namespace), the JVM sizing, and the switches this platform
# runs with. Anything that differs between environments lives in `platform-env`, generated by the
# overlay; anything secret lives in `platform-secrets`, created by scripts/gen-secrets.sh on the
# box and never in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-common
data:
  # Heap tracks the container limit, not the node.
  #
  # DO NOT swap the collector or the JIT here without changing the two numbers around them. This
  # line briefly read "-XX:+UseG1GC" with no other change, on the strength of a benchmark showing
  # C1-only costs 2.73x throughput against full tiering. That measurement is real, and it was
  # taken on ONE service in isolation. This box runs twenty-two JVMs on eight vCPUs, and the two
  # flags that were removed were the only thing bounding what each of them took:
  #
  #   * There are no CPU limits on these pods, so every JVM sees all 8 cores and sizes its GC and
  #     compiler thread pools for 8. SerialGC meant one collection thread; G1 means roughly eight,
  #     times twenty-two processes, each with its own native stack.
  #   * MaxRAMPercentage=70 of a 512Mi limit leaves ~154Mi for everything outside the heap. That
  #     fits C1 and SerialGC. It does not fit G1's region metadata and remembered sets plus a
  #     C2-sized code cache plus those extra threads — so pods drift past the limit, get
  #     OOMKilled, restart, and twenty-two of them doing that at once takes the node with it.
  #
  # Which is what happened: the platform ran healthily for hours and then stopped answering
  # entirely — TCP accepted on 80/443 by the host-port listener while neither Traefik nor sshd
  # could get scheduled. Reverted to the configuration that had been up for days.
  #
  # The throughput win is still worth having. Taking it needs CPU limits on the pods, or
  # -XX:ActiveProcessorCount=2 so each JVM sizes itself for its share, AND a lower heap fraction
  # to leave room for G1's own memory — trialled on qa and watched, not applied to both
  # environments at once. See SCALE-05 and SCALE-19, which are the same problem from two ends.
  JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k"
  SPRING_PROFILES_ACTIVE: docker
  CONFIG_IMPORT: configserver:http://config-server:8888
  # Issuer must match what Keycloak stamps into the token (per-env, in platform-env); JWKS is
  # fetched on the internal address.
  KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/delivery-platform/protocol/openid-connect/certs
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  POSTGRES_USER: delivery
  # No tracing backend is deployed; both flags or the exporter floods the log with retries.
  OTEL_SDK_DISABLED: "true"
  MANAGEMENT_TRACING_ENABLED: "false"
  # THE MAIL SINK IS NOT HERE ANY MORE (PD-1).
  #
  # SMTP_HOST=mailpit, SMTP_PORT=1025, no auth, no TLS and EMAIL_FROM=no-reply@mydelivery.local
  # used to be defaults on this file — which meant they were the defaults for PRODUCTION too, and
  # the way they would have shown up is the quietest failure this platform has: every verification
  # code, every receipt and every rider invitation delivered successfully to a sink nobody reads,
  # with no error anywhere, while customers waited for an email that was sitting in mailpit.
  #
  # Both environments already set all six in their own platform-env, so removing them changes
  # nothing about dev or qa. What it changes is what happens to an environment that FORGETS: it now
  # fails to start a mail send instead of quietly sending to a sink, and scripts/verify.sh fails if
  # any overlay leaves one of them out.
  #
  # SMS_TEST_INBOX is the same shape — every simulated SMS becomes an email to it — and is likewise
  # set per environment.
  #
  # Which environment this is. It is READ, not decoration: base/demo-storefront-gate.yaml uses it
  # to decide whether the eight demo shops survive, and scripts/verify.sh refuses a `production`
  # overlay that still carries a test switch. Deliberately NOT given a default here: an environment
  # that has not said what it is must not be guessed at in either direction.
  #   development | test | production
  #
  # Internal service-to-service addresses.
  PRODUCT_SERVICE_URL: http://product-service:8103
  ORDER_MANAGER_URL: http://order-manager:8101
  ORDER_TRACKING_URL: http://order-tracking:8102
  NOTIFICATIONS_MANAGER_URL: http://notifications-manager:8104
  # Product Service asks it whether a merchant with no shop applied to offer services.
  ONBOARDING_SERVICE_URL: http://onboarding-service:8117
  CONNECTOR_SETTINGS_URL: http://connector-settings:8109
  MINIO_ENDPOINT: http://minio:9000
  # The Lebanese-market switches, as the compose stack ran them.
  MARKET_LBP_PER_USD: "90000"
  RIDER_CHANGE_LIMIT_LBP: "100000"
  # THE SIMULATORS ARE OFF HERE (PD-1). Both were `true` on this shared file, so every environment
  # got them — production included, by default, silently.
  #
  # SIMULATE_WALLETS makes the Whish/OMT simulator offer wallet payment methods at checkout: a
  # customer choosing one in production would be taken through a payment that never happened, for
  # an order the platform then treats as paid. WHATSAPP_SIMULATOR_ENABLED replaces the Meta Cloud
  # API with a loopback that accepts any webhook it is handed.
  #
  # dev and qa turn them back on explicitly in their own platform-env, where it is one line in a
  # file named after the environment rather than a default nobody re-reads.
  SIMULATE_WALLETS: "false"
  WHATSAPP_SIMULATOR_ENABLED: "false"
  # WHATSAPP_APP_SECRET and WHATSAPP_VERIFY_TOKEN are NOT here any more. They were literals in
  # this file, so they were in the repository and in every pod on the platform, while only
  # whatsapp-service reads them. They now come from the whatsapp-webhook Secret, minted per
  # environment by gen-secrets.sh and referenced by whatsapp-service alone (services.yaml).
  WHATSAPP_OUTBOUND_URL: http://whatsapp-service:8116/simulator/outbound
  AUTO_APPROVE_RIDER: "false"
  AUTO_APPROVE_MERCHANT: "false"
  AUTO_APPROVE_CARRIER: "false"
  # Order Tracking refuses a rider's position from outside Lebanon (plus ~15 km) as
  # OUTSIDE_SERVICE_AREA: nothing honest reports from there, and what does is a fake — an old app
  # build's London walk, a spoofing app. On here and restated in qa's platform-env; only dev's
  # platform-env turns it off, because dev's riders are emulators reporting Mountain View. The box
  # is delivery.tracking.ping.service-area in order-tracking's application.yml.
  TRACKING_SERVICE_AREA_ENABLED: "true"
  # Nominatim refuses to be called without an identifying User-Agent. This one said "YouDrop-dev"
  # in every environment, which is what Nominatim's operators would have seen from a live shop's
  # geocoding — and a User-Agent that misidentifies itself is the sort of thing a free service
  # blocks rather than asks about. The honest name is the default; dev's overlay appends "-dev".
  NOMINATIM_USER_AGENT: "YouDrop (youssef.saleh0108@gmail.com)"
