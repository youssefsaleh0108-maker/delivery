# The Backoffice / Merchant / Carrier portal: one Flutter Web build over stock nginx. The build
# output is rsynced to the node (infra/deploy-portal.sh) rather than baked into an image — it is
# static files with no server side, and an image would mean a registry round trip per copy change.
# The hostPath below is patched per overlay: /opt/delivery/sites/<env>/portal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels: { app: portal }
spec:
  replicas: 1
  selector:
    matchLabels: { app: portal }
  template:
    metadata:
      labels: { app: portal }
    spec:
      containers:
        - name: portal
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8200
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            # httpGet probes address the pod IP (IPv4 here), so the ::1-first trap the compose
            # healthcheck fell into does not apply.
            httpGet: { path: /, port: 8200 }
            periodSeconds: 15
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits: { memory: 96Mi }
      volumes:
        - name: conf
          configMap: { name: portal-nginx }
        - name: web
          hostPath:
            path: /opt/delivery/sites/dev/portal
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: portal
spec:
  selector: { app: portal }
  ports:
    - port: 8200
      targetPort: 8200
