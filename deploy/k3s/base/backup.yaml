# Backups. Before this file there were none — no CronJob, no WAL archive, and the k3s datastore
# that holds every Secret was never copied off the box either. One disk failure, one `rm`, one
# mistaken `kubectl delete pvc`, and there was nothing to go back to.
#
# Three jobs, all SUSPENDED HERE and un-suspended by the overlay that wants them (today only
# overlays/qa, the environment becoming production). dev's data is demo data and dev has a memory
# quota with no room for an extra pod; a suspended CronJob costs nothing and cannot surprise
# anybody. A namespace created later therefore starts safe rather than starting to upload.
#
#   postgres-backup  hourly: pg_dumpall --globals-only + pg_dump -Fc of delivery and keycloak,
#                    encrypted with age to the owner's public key, uploaded with rclone, verified
#                    by reading the object's size back, then a dead-man ping.
#   minio-backup     nightly: rclone sync of every bucket, skipping product-images/scans/.
#   restore-test     weekly: restores into a throwaway Postgres in its own pod and checks the
#                    Flyway versions and the row counts against the live database.
#
# WHAT THE OWNER MUST CREATE, once per environment, on the box. None of it is in git and none of it
# is invented here; until all of it exists these Jobs say what is missing and exit 0.
#
#   backup-rclone   rclone.conf  the destination's rclone configuration, with a remote named `dest`
#                   dest         the path to write to, e.g. `dest:youdrop-backups`
#   backup-age      recipient    the age PUBLIC key of the keypair whose private half stays OFFLINE
#                   restore-test.key  (optional) a SECOND age private key, so the weekly restore
#                                test can decrypt a real archive. Without it that test runs in its
#                                dump-only mode and says so.
#   backup-deadman  url          (optional) the healthchecks.io-style URL pinged after a successful
#                                backup. Not in git and not in a ConfigMap on purpose: this
#                                repository is public, and anyone who can ping the URL can keep the
#                                dead-man alive while the backups are dead.
#                   minio-url    (optional) the same for the nightly object sync.
#
# See "Backups" in deploy/k3s/README.md for the exact commands, the bucket's lifecycle rules and
# the restore runbook.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels: { app: postgres-backup }
spec:
  # Seventeen past, so this does not start in the same second as every other hourly thing on the
  # box. UTC — the cluster has no timeZone set and the archive names are UTC too.
  schedule: "17 * * * *"
  suspend: true
  # A backup that overran its hour must not have a second copy of itself competing for the same
  # database connection and the same upload bandwidth.
  concurrencyPolicy: Forbid
  # If the node was down or busy at :17, run late rather than skipping the hour — but not more than
  # ten minutes late, after which the next hour's run is the better answer.
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Two attempts, not the default six: a failure here is almost always the destination being
      # unreachable or misconfigured, and five more attempts do not fix either. The hour after
      # this one is the real retry.
      backoffLimit: 2
      # Half an hour. Past that something is wedged and the next hour should take over.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: { app: postgres-backup }
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              # The same major version as the server it dumps (postgis/postgis:17-3.5). pg_dump
              # refuses to dump a server NEWER than itself, so this must be upgraded before
              # Postgres is, not after.
              image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
              command: ["/bin/sh", "/backup/postgres-backup.sh"]
              env:
                - name: NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: delivery
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } }
              volumeMounts:
                - { name: script, mountPath: /backup, readOnly: true }
                - { name: rclone, mountPath: /etc/rclone, readOnly: true }
                - { name: age, mountPath: /etc/age, readOnly: true }
                - { name: deadman, mountPath: /etc/deadman, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: metrics-out, mountPath: /metrics-out }
              resources:
                requests: { memory: 96Mi, cpu: 50m }
                limits: { memory: 256Mi }
          volumes:
            - name: script
              configMap: { name: backup-scripts, defaultMode: 0555 }
            # optional: true on all three is what lets this pod START without them. The script then
            # reports what is missing and exits 0 rather than crash-looping in Argo CD forever.
            - name: rclone
              secret: { secretName: backup-rclone, optional: true }
            - name: age
              secret: { secretName: backup-age, optional: true }
            - name: deadman
              secret: { secretName: backup-deadman, optional: true }
            # node-exporter serves whatever .prom files land here, so this is how a Job that is
            # gone by the next scrape still has a metric. The DaemonSet makes the directory
            # sticky-writable; see cluster/alerting.yaml.
            - name: metrics-out
              hostPath: { path: /var/lib/node-exporter/textfile, type: DirectoryOrCreate }
            # On disk, not in memory: an emptyDir with medium Memory counts against the container's
            # memory limit, and a database dump would take the pod out.
            - name: work
              emptyDir: { sizeLimit: 4Gi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
  labels: { app: minio-backup }
spec:
  schedule: "40 2 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: { app: minio-backup }
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
              command: ["/bin/sh", "/backup/minio-backup.sh"]
              env:
                - name: NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                # The in-cluster address, from platform-common — not MINIO_PUBLIC_ENDPOINT, which
                # would send every object out through Traefik and back.
                - name: MINIO_ENDPOINT
                  valueFrom: { configMapKeyRef: { name: platform-common, key: MINIO_ENDPOINT } }
                - name: MINIO_ROOT_USER
                  valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_USER } }
                - name: MINIO_ROOT_PASSWORD
                  valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_PASSWORD } }
              volumeMounts:
                - { name: script, mountPath: /backup, readOnly: true }
                - { name: rclone, mountPath: /etc/rclone, readOnly: true }
                - { name: deadman, mountPath: /etc/deadman, readOnly: true }
                - { name: metrics-out, mountPath: /metrics-out }
              resources:
                requests: { memory: 96Mi, cpu: 50m }
                limits: { memory: 256Mi }
          volumes:
            - name: script
              configMap: { name: backup-scripts, defaultMode: 0555 }
            - name: rclone
              secret: { secretName: backup-rclone, optional: true }
            - name: deadman
              secret: { secretName: backup-deadman, optional: true }
            - name: metrics-out
              hostPath: { path: /var/lib/node-exporter/textfile, type: DirectoryOrCreate }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-test
  labels: { app: restore-test }
spec:
  # Sunday, early. It reads the live database (a dump and some counts) and writes nothing to it.
  schedule: "0 4 * * 0"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      # One attempt. This is a test: a retry that passes does not undo a failure that happened, and
      # the failed Job is the record worth keeping.
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: { app: restore-test }
        spec:
          restartPolicy: Never
          # A native sidecar: an initContainer with restartPolicy Always starts BEFORE the main
          # container, keeps running beside it, and is terminated by the kubelet when the main
          # container exits — which is the only way a Job pod with a database beside it can ever
          # reach Completed. (An ordinary container would keep the pod Running forever.)
          initContainers:
            - name: scratch-postgres
              restartPolicy: Always
              image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
              args: ["-c", "fsync=off", "-c", "full_page_writes=off", "-c", "synchronous_commit=off"]
              env:
                # It listens on the pod's own loopback only, and the pod is gone in minutes. There
                # is no password to invent, no Secret to rotate, and nothing else can open a
                # connection to it. A password here would be a credential that exists to be typed
                # into the next line of the same file.
                - name: POSTGRES_HOST_AUTH_METHOD
                  value: trust
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
              # fsync off because this database is thrown away in ten minutes; it is what makes a
              # full restore take minutes rather than an hour on a shared disk.
              volumeMounts:
                - { name: scratch, mountPath: /var/lib/postgresql/data }
              resources:
                requests: { memory: 192Mi, cpu: 100m }
                limits: { memory: 768Mi }
          containers:
            - name: restore-test
              image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
              command: ["/bin/sh", "/backup/restore-test.sh"]
              env:
                - name: NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: delivery
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } }
              volumeMounts:
                - { name: script, mountPath: /backup, readOnly: true }
                - { name: rclone, mountPath: /etc/rclone, readOnly: true }
                - { name: age, mountPath: /etc/age, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: metrics-out, mountPath: /metrics-out }
              resources:
                requests: { memory: 128Mi, cpu: 50m }
                limits: { memory: 384Mi }
          volumes:
            - name: script
              configMap: { name: backup-scripts, defaultMode: 0555 }
            - name: rclone
              secret: { secretName: backup-rclone, optional: true }
            - name: age
              secret: { secretName: backup-age, optional: true }
            - name: metrics-out
              # node-exporter serves whatever .prom files land here, so this is how a Job that is
              # gone by the next scrape still has a metric. The DaemonSet makes the directory
              # sticky-writable; see cluster/alerting.yaml.
              hostPath: { path: /var/lib/node-exporter/textfile, type: DirectoryOrCreate }
            - name: work
              emptyDir: { sizeLimit: 4Gi }
            - name: scratch
              emptyDir: { sizeLimit: 8Gi }
