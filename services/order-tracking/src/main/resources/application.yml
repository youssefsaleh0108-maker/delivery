server:
  port: ${SERVER_PORT:8102}

spring:
  application:
    name: order-tracking

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=tracking}
    username: ${DB_USER:order_tracking}
    password: ${DB_PASSWORD:order_tracking_dev_pw}
    hikari:
      # Larger than the other services: this one takes a write per active rider every few seconds.
      maximum-pool-size: 15
      minimum-idle: 3

  flyway:
    enabled: true
    locations: classpath:db/migration/tracking
    schemas: tracking
    default-schema: tracking

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tracking
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:delivery}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}
    listener:
      simple:
        # The projection is idempotent, so redelivery is safe; retry a few times before the DLQ.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  outbox:
    exchange: delivery.events

  tracking:
    order-events-queue: tracking.order-events
    # How long a cached position stays valid. Slightly longer than the rider ping interval so a
    # single dropped ping does not push every watcher through to Postgres.
    location-cache-ttl: 60s

    presence:
      # How long after the last fix a rider still counts as present. Past this they read as STALE,
      # not ON_DUTY: a phone that died cannot tell us it died, so silence has to be what changes the
      # answer. Two minutes is many missed pings — comfortably past a tunnel or a lift, well short
      # of a flat battery going unnoticed.
      ttl: 120s
      # How often a rider's last-known fix is written through to Postgres. The Redis snapshot is
      # updated on every ping regardless; this only throttles the durable copy, which nothing needs
      # accurate to the second. See RiderPresenceRepository#touchIfDue for the trade.
      persist-interval: 30s

    eta:
      # Beyond this the last fix is too old to measure a remaining distance from, and the ETA
      # reports STALE_FIX rather than a number. Generous next to the seconds between pings, because
      # a customer would rather see a slightly aged estimate than have it blink out under a bridge.
      max-fix-age: 5m

    routing:
      # Which provider computes ETAs. HAVERSINE_DEV is the dev implementation: a straight line at
      # the average speed below, with no idea that roads exist. It is the default because the
      # alternatives need an account nobody has bought yet, and because it is honest about itself —
      # its name is returned on every ETA response so no screen can mistake it for a routed answer.
      #
      # Set to OSRM once a routing host exists, or MAPBOX once a token is in Vault. Neither will
      # engage without its configuration below; the service logs loudly and stays on the dev
      # provider rather than silently answering nothing.
      provider: ${TRACKING_ROUTING_PROVIDER:HAVERSINE_DEV}
      # Effective door-to-door speed for the dev provider, including junctions and handovers — not
      # a vehicle's top speed. The one number here worth tuning against observed delivery times.
      average-speed-kmh: 18
      osrm:
        # Deliberately empty. The public demo server is rate-limited, carries no availability
        # guarantee, and would ship every customer's address to a volunteer's box; a self-hosted
        # OSRM from an OSM extract is the intended shape. No default that half-works.
        base-url: ${OSRM_BASE_URL:}
        profile: driving
      mapbox:
        base-url: https://api.mapbox.com
        # access-token comes from Vault at secret/order-tracking, never from here. Mapbox
        # authenticates by query parameter, so nothing in MapboxRouteProvider ever logs a URI.
        profile: mapbox/driving-traffic

    # Shift boundaries are kept far longer than raw GPS: payroll and late disputes ask about them
    # months later, and the table is a few rows per rider per day rather than millions.
    duty-event-retention-days: 400

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      # Deliberately lower than the other services: this endpoint is called several times a second
      # per active delivery, and tracing all of it would swamp the collector for little insight.
      probability: ${OTEL_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
