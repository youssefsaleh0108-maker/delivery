# Profile for running the Config Server straight from an IDE against the docker-compose infra.
# Everything here is local-only and safe to commit; real environments get these from the
# environment, and their secrets from Vault.

spring:
  security:
    user:
      password: local-config-secret

  rabbitmq:
    password: delivery

  # 5433, not 5432: compose publishes Postgres there to avoid the lending stack already on 5432.
  datasource:
    url: jdbc:postgresql://localhost:5433/delivery?currentSchema=config
    username: config_server
    password: config_server_dev_pw

  cloud:
    config:
      server:
        composite:
          - type: jdbc
            sql: "SELECT prop_key, prop_value FROM config_properties WHERE application=? AND profile=? AND label=? ORDER BY prop_key"
          - type: vault
            host: localhost
            port: 8200
            scheme: http
            backend: secret
            kv-version: 2
            default-key: application
            profile-separator: '/'
            authentication: APPROLE
            app-role:
              role-id: ${VAULT_ROLE_ID}
              secret-id: ${VAULT_SECRET_ID}
              app-role-path: approle
