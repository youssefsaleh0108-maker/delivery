server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-server

  profiles:
    # REQUIRED for the composite backend below. Without the 'composite' profile active, Spring
    # Cloud Config ignores spring.cloud.config.server.composite entirely and falls back to the
    # single-repository DefaultRepositoryConfiguration, which then fails at startup with
    # "You need to configure a uri for the git repository". Run locally with 'composite,local'.
    # Not named SPRING_PROFILES: that env var binds to the property 'spring.profiles', which Boot 3
    # rejects outright as an invalid config property.
    active: ${CONFIG_PROFILES:composite}

  security:
    user:
      name: ${CONFIG_SERVER_USER:config}
      # No default. A Config Server that boots with a well-known password is a Config Server that
      # hands out every service's Vault-resolved secrets to anything on the network.
      password: ${CONFIG_SERVER_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD}

  # The backing store for the jdbc composite entry below. This is the Config Server's OWN
  # connection, not any service's: it reads the config schema and nothing else, under a role with
  # SELECT on one table.
  #
  # This makes Postgres a hard startup dependency of the config layer, which the Git backend was
  # not — a database that is not yet accepting connections takes the Config Server down, and every
  # other service with it. That is the trade the database backend makes; the deployment waits for
  # Postgres before starting this service rather than pretending otherwise.
  datasource:
    url: ${CONFIG_DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=config}
    username: ${CONFIG_DB_USER:config_server}
    password: ${CONFIG_DB_PASSWORD}
    hikari:
      # This pool serves config reads only, and they are short. Two is enough and leaves
      # connections for the services, which share the same instance.
      maximum-pool-size: 2

  cloud:
    config:
      server:
        # Applies to every composite entry. The jdbc backend matches this against the LABEL column,
        # so every seeded row carries label 'main' — see infra/postgres/init/03-config-properties.sql.
        # Change one without the other and every lookup returns an empty property source rather than
        # an error, which surfaces as a service that starts and then fails on its first query.
        default-label: ${CONFIG_DEFAULT_LABEL:main}

        # How the server AUTHENTICATES to Vault.
        #
        # This block must live here, at spring.cloud.config.server.vault, and NOT only inside the
        # composite entry below. SpringVaultEnvironmentRepositoryFactory is constructed with a
        # SpringVaultClientConfiguration bean built from these global properties, and that bean is
        # what chooses the ClientAuthentication. Put `authentication: APPROLE` only in the composite
        # entry and it is silently ignored: the server falls back to TOKEN auth and every config
        # request fails with "Missing required header in HttpServletRequest: X-Config-Token".
        #
        # AppRole, not a root token: this server holds a role scoped read-only to exactly the secret
        # paths it serves, and never broader Vault access (Section 6).
        vault:
          host: ${VAULT_HOST:localhost}
          port: ${VAULT_PORT:8200}
          scheme: ${VAULT_SCHEME:http}
          backend: ${VAULT_BACKEND:secret}
          kv-version: 2
          default-key: application
          profile-separator: '/'
          authentication: APPROLE
          app-role:
            role-id: ${VAULT_ROLE_ID}
            secret-id: ${VAULT_SECRET_ID}
            app-role-path: approle

        # Column names are the reason for the explicit query. The default JDBC statement selects
        # KEY and VALUE; both are keywords, and while PostgreSQL accepts them unquoted today that
        # is a property of its keyword classification rather than a guarantee. prop_key/prop_value
        # cannot be misread by anything.
        jdbc:
          sql: "SELECT prop_key, prop_value FROM config_properties WHERE application=? AND profile=? AND label=? ORDER BY prop_key"
          order: 1

        # Composite backend (Section 6): the database for plain business/environment properties,
        # Vault for secrets. Order matters — later entries win, so a Vault key overrides a database
        # placeholder of the same name rather than the other way round.
        #
        # This was a Git repository until the database replaced it. What that costs is worth being
        # explicit about: a config change is now an UPDATE with no diff, no review and no history,
        # where it used to be a commit. If a bad value takes the platform down there is nothing to
        # revert to. `config-repo/` is kept in the monorepo as the record of what the values were
        # and is no longer read at runtime.
        composite:
          - type: jdbc
            sql: "SELECT prop_key, prop_value FROM config_properties WHERE application=? AND profile=? AND label=? ORDER BY prop_key"
          - type: vault
            host: ${VAULT_HOST:localhost}
            port: ${VAULT_PORT:8200}
            scheme: ${VAULT_SCHEME:http}
            backend: ${VAULT_BACKEND:secret}
            kv-version: 2
            default-key: application
            profile-separator: '/'

management:
  endpoints:
    web:
      exposure:
        include: health,info,busrefresh,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
