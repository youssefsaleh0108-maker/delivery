server:
  port: ${SERVER_PORT:8118}

  # Finish what is in flight before the process goes.
  #
  # Spring's default is immediate: on every rolling update and every node drain the outgoing pod
  # dropped whatever it was serving, and with one replica of each service there was nowhere else
  # for those requests to land. The pod is removed from the Service first, so this window is spent
  # draining rather than accepting.
  shutdown: graceful

  tomcat:
    threads:
      # Bounded, and bounded against the connection pool rather than left at Spring Boot's 200.
      #
      # Two hundred request threads in front of a pool of 5 is not concurrency, it is a queue
      # with a worse failure mode: 190 of them block on the pool, each holding a 512 KB stack in a
      # 512 Mi container, and a dependency that slows down converts directly into thread exhaustion
      # across EVERY endpoint on the service rather than just the slow one. Checkout makes 2N+2
      # sequential cross-service calls, so it is the one that gets there first — and the callers it
      # takes down with it are the rider job board and the merchant board.
      #
      # 24 is 4 per connection: enough that work needing no database keeps moving while
      # the pool is saturated, few enough that saturation is a queue at the door instead of a
      # thundering herd inside.
      max: 24
      min-spare: 5

spring:
  lifecycle:
    # Shorter than the pod's terminationGracePeriodSeconds, so the drain finishes on its own
    # terms rather than being cut off by SIGKILL.
    timeout-per-shutdown-phase: 20s

  application:
    name: transfer-service

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=transfer}
    username: ${DB_USER:transfer_service}
    password: ${DB_PASSWORD:transfer_service_dev_pw}
    hikari:
      # Small on purpose: the shared Postgres allows 100 connections platform-wide and this
      # service's work is short writes.
      maximum-pool-size: 5
      # minimum-idle is set on every pool in the platform for one reason: Hikari defaults it to the
      # MAXIMUM, so a pool that never names it never shrinks. Its configured ceiling becomes its
      # permanent footprint, held against a shared Postgres whose 200 connections are the budget
      # for eleven services — this one sat at 10 of 10 idle around the clock.
      minimum-idle: 1

  flyway:
    enabled: true
    locations: classpath:db/migration/transfer
    schemas: transfer
    default-schema: transfer

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: transfer
        jdbc:
          time_zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  services:
    # Order Manager answers whether an order exists and whose it is, which is the one thing this
    # service cannot know: an order id is a client-supplied UUID and no order lives in the transfer
    # schema.
    order-manager: ${ORDER_MANAGER_URL:http://localhost:8101}
  clients:
    # Short: the check stands between a customer and their checkout, and nothing is written until
    # it answers, so a refusal they can retry beats a request thread held open.
    connect-timeout: ${CLIENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${CLIENT_READ_TIMEOUT:5s}
  market:
    # LBP per USD — the platform's one display-and-collection rate. The same key and default the
    # storefront's market config serves, so the price a customer browsed and the price they are
    # quoted at checkout can never disagree by configuration accident.
    lbp-per-usd: ${MARKET_LBP_PER_USD:90000}
  transfer:
    # The rider-change promise printed on checkout. Operator-set.
    rider-change-limit-lbp: ${RIDER_CHANGE_LIMIT_LBP:100000}
    # DEV ONLY: the simulator that accepts Whish/OMT transfers. A production deployment sets this
    # false until the real connectors exist, and the wallet methods simply do not appear.
    simulate-wallets: ${SIMULATE_WALLETS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
      # What "ready to take traffic" actually means.
      #
      # Spring's readiness group contains only readinessState by default, which says the context
      # finished starting and nothing more — so a pod whose connection pool has died reports Ready
      # and keeps being sent work. Naming the dependency it cannot serve without is the whole
      # point of the group.
      #
      # LIVENESS is deliberately left alone. A dependency belongs in readiness, never in liveness:
      # readiness takes a pod out of the Service until it recovers, while liveness kills it — so a
      # database blip with the two conflated would restart every pod on the platform at once,
      # turning a recoverable stall into an outage plus a cold start.
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
