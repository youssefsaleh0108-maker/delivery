server:
  port: ${SERVER_PORT:8104}

  # Finish what is in flight before the process goes.
  #
  # Spring's default is immediate: on every rolling update and every node drain the outgoing pod
  # dropped whatever it was serving, and with one replica of each service there was nowhere else
  # for those requests to land. The pod is removed from the Service first, so this window is spent
  # draining rather than accepting.
  shutdown: graceful

  tomcat:
    threads:
      # Bounded, and bounded against the connection pool rather than left at Spring Boot's 200.
      #
      # Two hundred request threads in front of a pool of 10 is not concurrency, it is a queue
      # with a worse failure mode: 190 of them block on the pool, each holding a 512 KB stack in a
      # 512 Mi container, and a dependency that slows down converts directly into thread exhaustion
      # across EVERY endpoint on the service rather than just the slow one. Checkout makes 2N+2
      # sequential cross-service calls, so it is the one that gets there first — and the callers it
      # takes down with it are the rider job board and the merchant board.
      #
      # 40 is 4 per connection: enough that work needing no database keeps moving while
      # the pool is saturated, few enough that saturation is a queue at the door instead of a
      # thundering herd inside.
      max: 40
      min-spare: 5

spring:
  lifecycle:
    # Shorter than the pod's terminationGracePeriodSeconds, so the drain finishes on its own
    # terms rather than being cut off by SIGKILL.
    timeout-per-shutdown-phase: 20s

  application:
    name: notifications-manager

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=notification}
    username: ${DB_USER:notification_service}
    password: ${DB_PASSWORD:notification_service_dev_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration/notification
    schemas: notification
    default-schema: notification
    # App Notification Service owns its own tables in the same schema and runs its own migrations,
    # so the two must not share a history table. See its application.yml for why the schema is
    # shared at all.
    table: flyway_schema_history_notifications_manager
    # Same reason as App Notification Service: whichever of the two starts second finds a non-empty
    # schema with no history table of its own and would otherwise refuse to boot. See that
    # service's application.yml for what baselining gives up.
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
        jdbc:
          time_zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}
    listener:
      simple:
        retry:
          # Both listeners are idempotent, so a few redeliveries are safe before the DLQ.
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  outbox:
    exchange: delivery.events

  notifications:
    order-events-queue: notifications.order-events
    receipts-queue: notifications.receipts
    default-locale: en
    # Short enough that a corrected phone number takes effect quickly, long enough that one order's
    # worth of notifications does not make five identical calls to Keycloak's admin API.
    recipient-cache-ttl: 5m
    keycloak:
      base-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
      realm: delivery-platform
      client-id: notifications-manager
      # Service-account secret from Vault at secret/notifications-manager. The client holds
      # view-users and nothing else.
      client-secret: ${KEYCLOAK_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
      # What "ready to take traffic" actually means.
      #
      # Spring's readiness group contains only readinessState by default, which says the context
      # finished starting and nothing more — so a pod whose connection pool has died reports Ready
      # and keeps being sent work. Naming the dependency it cannot serve without is the whole
      # point of the group.
      #
      # LIVENESS is deliberately left alone. A dependency belongs in readiness, never in liveness:
      # readiness takes a pod out of the Service until it recovers, while liveness kills it — so a
      # database blip with the two conflated would restart every pod on the platform at once,
      # turning a recoverable stall into an outage plus a cold start.
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
