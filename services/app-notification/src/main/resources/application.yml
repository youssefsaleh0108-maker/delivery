server:
  port: ${SERVER_PORT:8108}

spring:
  application:
    name: app-notification

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=notification}
    username: ${DB_USER:notification_service}
    password: ${DB_PASSWORD:notification_service_dev_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration/app-notification
    schemas: notification
    default-schema: notification
    # Its own history table. This service and Notifications Manager both migrate the notification
    # schema but own disjoint tables - a shared history would have each service trying to apply the
    # other's migrations. See V20__in_app_messages.sql.
    table: flyway_schema_history_app_notification
    # Required BECAUSE of that split. Whichever service migrates second finds a schema that already
    # has tables but no history table of its own, and Flyway refuses to start there - it cannot
    # tell an unmanaged legacy schema from this one. Baselining at 0 says "the existing tables are
    # not mine and predate my history", so every migration from V1 up still runs.
    #
    # What this gives up: on a genuinely unmanaged notification schema, this service would create
    # its tables alongside whatever was there instead of refusing to start. Accepted knowingly -
    # the schema is created empty by infra/postgres/init and only these two services touch it.
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
        jdbc:
          time_zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  security:
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      # The socket itself is opened without a token; the STOMP CONNECT frame carries it and is
      # rejected if it does not. See WebSocketConfiguration for why the handshake cannot be the
      # place this is checked.
      - /ws/notifications/**

  outbox:
    exchange: delivery.events

  websocket:
    # Same origins as the Gateway's CORS list - a browser WebSocket is subject to origin checks
    # just like a fetch, and getting this wrong looks like a silent connection failure.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

  # Customer <-> rider chat, scoped to one order. Most of these are policy rather than tuning, which
  # is why they are gathered here instead of scattered through @Value annotations - see
  # ChatProperties for the reasoning behind each number.
  chat:
    # How long after DELIVERY the conversation keeps accepting messages. Two hours: long enough for
    # the "you left it at the wrong door" conversation, which starts when the customer unpacks the
    # bag rather than when they take it; short enough that it expires inside the rider's shift
    # instead of leaving a customer a private line to a courier who is eleven jobs away. A cancelled
    # order closes immediately and that is not configurable - there is no delivery to ask about.
    close-after-delivery: ${CHAT_CLOSE_AFTER_DELIVERY:2h}
    # Refused above this, never truncated: shortening a message changes what the sender said.
    max-message-length: 1000
    history-page-size: 100
    push-preview:
      # Whether the push that chases an offline recipient carries a snippet of the message. On,
      # because "you have a message" is not something a customer on a doorstep can act on without
      # unlocking their phone. The cost is real and deliberate: the snippet crosses a third-party
      # push service and lands on a lock screen. Set false for a contentless nudge.
      enabled: ${CHAT_PUSH_PREVIEW:true}
      # Well under PushPreparer's 240-character body cap and FCM's 4KB payload limit, so no message
      # can be composed long enough to get its own notification rejected.
      max-length: 120
    # Whether support may read a transcript. On, and audited to chat_transcript_access on every
    # read - see ChatBackofficeController for why granting it beats the alternative, which is the
    # same read happening through a psql prompt with no record.
    backoffice-transcript-access: ${CHAT_BACKOFFICE_READ:true}
    order-events-queue: app-notification.order-events

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
