server:
  port: ${SERVER_PORT:8108}

spring:
  application:
    name: app-notification

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=notification}
    username: ${DB_USER:notification_service}
    password: ${DB_PASSWORD:notification_service_dev_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration/app-notification
    schemas: notification
    default-schema: notification
    # Its own history table. This service and Notifications Manager both migrate the notification
    # schema but own disjoint tables - a shared history would have each service trying to apply the
    # other's migrations. See V20__in_app_messages.sql.
    table: flyway_schema_history_app_notification
    # Required BECAUSE of that split. Whichever service migrates second finds a schema that already
    # has tables but no history table of its own, and Flyway refuses to start there - it cannot
    # tell an unmanaged legacy schema from this one. Baselining at 0 says "the existing tables are
    # not mine and predate my history", so every migration from V1 up still runs.
    #
    # What this gives up: on a genuinely unmanaged notification schema, this service would create
    # its tables alongside whatever was there instead of refusing to start. Accepted knowingly -
    # the schema is created empty by infra/postgres/init and only these two services touch it.
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
        jdbc:
          time_zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  security:
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      # The socket itself is opened without a token; the STOMP CONNECT frame carries it and is
      # rejected if it does not. See WebSocketConfiguration for why the handshake cannot be the
      # place this is checked.
      - /ws/notifications/**

  outbox:
    exchange: delivery.events

  websocket:
    # Same origins as the Gateway's CORS list - a browser WebSocket is subject to origin checks
    # just like a fetch, and getting this wrong looks like a silent connection failure.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
