server:
  port: ${SERVER_PORT:8115}

spring:
  application:
    name: accounting-service

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=accounting}
    username: ${DB_USER:accounting_service}
    password: ${DB_PASSWORD:accounting_service_dev_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration/accounting
    schemas: accounting
    default-schema: accounting

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: accounting
        jdbc:
          time_zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}
    listener:
      simple:
        retry:
          # Both listeners are idempotent, so a few redeliveries are safe before the DLQ.
          enabled: true
          max-attempts: 3
          initial-interval: 1s
        # Deliberately 1. Settlement legs for one order must not be processed concurrently: two
        # threads applying results for the same order could both decide to compensate it.
        concurrency: 1
        max-concurrency: 1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  outbox:
    exchange: delivery.events

  ordering:
    # The platform's take. Served from the config repo in a real environment - it is a business
    # parameter an engineer changes through a commit, not a Backoffice screen (Section 6).
    commission-percentage: 12.5

  rider-earnings:
    # What one of the PLATFORM'S OWN riders keeps of a delivery fee, as a percentage of it.
    #
    # DELIBERATELY BLANK. Nobody has told this codebase what the platform pays its own riders, and
    # picking a plausible number here would be the platform quietly setting its own riders' pay in
    # a config file. Blank means "pay them exactly what an outside carrier would have been paid for
    # the same job" — the fee less delivery-commission-percentage below — which mirrors the one
    # split the platform HAS decided instead of inventing a second one. Set it to a number once
    # somebody knows the real figure.
    platform-fleet-fee-share-percentage:
    # Below this a cash-out is refused: nothing pays automatically, so a queue of small requests
    # costs more operator time than the requests are worth.
    minimum-cash-out: 5.00
    # The fat-finger guard on a tip typed into a phone, not a policy about generosity.
    maximum-tip: 100.00
    # Cash the rider is still carrying reduces what they can take out. Turning this off means the
    # platform will hand a rider money while they are holding more of the platform's.
    offset-cash-float: true
    # "Today" is a local-calendar question. The API takes a zone per request; this is the fallback.
    zone: UTC

  rider-payout:
    # Which provider actually moves the money. MANUAL is the only one that exists: an operator pays
    # outside this system and records the reference. Naming a provider that is not on the classpath
    # fails startup rather than silently falling back — see RiderPayoutProviders.
    provider: MANUAL

  services:
    # Statements are emailed through Notifications Manager's direct path, exactly as Onboarding
    # sends a one-time code. That service owns the templates, the provider credentials and the
    # delivery log; a second sending path here would be a class of message nobody can answer
    # "did it arrive" about.
    notifications-manager: ${NOTIFICATIONS_MANAGER_URL:http://localhost:8104}
    # Asked one question only: which delivery company is the caller staff of.
    #
    # A carrier's legs are attributed with Order Manager's provider id while their token carries a
    # Keycloak subject, and this service cannot bridge the two without the membership table that
    # service owns. Copying that mapping here would drift the first time somebody joins or leaves a
    # fleet, so it is asked for instead — with the caller's own token, so the answer is Order
    # Manager's to give and a provider id can never arrive from a request parameter.
    order-manager: ${ORDER_MANAGER_URL:http://localhost:8101}

  accounting:
    statements:
      # The calendar a from/to range is interpreted in. "August" is a different 31 days depending
      # on where you are standing, and every statement query resolves the range once, here.
      zone: UTC
      # Where the PLATFORM's own statement goes. DELIBERATELY BLANK: the platform is not a user
      # and has no address on file, and a wrong default here does not fail loudly — it sends the
      # platform's own figures to a stale inbox. Blank means the send endpoint refuses with a 409
      # until somebody names a real finance mailbox.
      platform-recipient:
      platform-name: The platform

    order-events-queue: accounting.order-events
    results-queue: accounting.posting-results
    platform-account: ACC-PLATFORM
    currency: USD
    # Where a settlement goes when a user has no bankAccountRef. Deliberately a real-looking but
    # obviously wrong account, so the mistake shows up in the reconciliation view rather than as a
    # silently dropped settlement.
    unmapped-account: ACC-UNMAPPED
    account-cache-ttl: 15m
    keycloak:
      base-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
      realm: delivery-platform
      client-id: accounting-service
      client-secret: ${KEYCLOAK_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
