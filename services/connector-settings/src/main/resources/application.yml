server:
  port: ${SERVER_PORT:8109}

  # Finish what is in flight before the process goes.
  #
  # Spring's default is immediate: on every rolling update and every node drain the outgoing pod
  # dropped whatever it was serving, and with one replica of each service there was nowhere else
  # for those requests to land. The pod is removed from the Service first, so this window is spent
  # draining rather than accepting.
  shutdown: graceful

spring:
  lifecycle:
    # Shorter than the pod's terminationGracePeriodSeconds, so the drain finishes on its own
    # terms rather than being cut off by SIGKILL.
    timeout-per-shutdown-phase: 20s

  application:
    name: connector-settings

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=settings}
    username: ${DB_USER:connector_settings}
    password: ${DB_PASSWORD:connector_settings_dev_pw}
    hikari:
      # minimum-idle is set on every pool in the platform for one reason: Hikari defaults it to the
      # MAXIMUM, so a pool that never names it never shrinks. Its configured ceiling becomes its
      # permanent footprint, held against a shared Postgres whose 200 connections are the budget
      # for eleven services — this one sat at 10 of 10 idle around the clock.
      #
      # Four is generous here: this service answers connector configuration reads that are cached
      # for five minutes on the far side, and writes them rarely.
      maximum-pool-size: 4
      minimum-idle: 1

  flyway:
    enabled: true
    locations: classpath:db/migration/settings
    schemas: settings
    default-schema: settings

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: settings
        jdbc:
          time_zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  security:
    # /internal/** is how a connector recovers the active provider after a missed settings event.
    # Its callers are services with no user token. It is NOT routed by the API Gateway, so it is
    # only reachable from inside the cluster network, and it is read-only and secret-free - see
    # InternalConnectorSettingsController.
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /internal/connectors/**

  outbox:
    exchange: delivery.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
      # What "ready to take traffic" actually means.
      #
      # Spring's readiness group contains only readinessState by default, which says the context
      # finished starting and nothing more — so a pod whose connection pool has died reports Ready
      # and keeps being sent work. Naming the dependency it cannot serve without is the whole
      # point of the group.
      #
      # LIVENESS is deliberately left alone. A dependency belongs in readiness, never in liveness:
      # readiness takes a pod out of the Service until it recovers, while liveness kills it — so a
      # database blip with the two conflated would restart every pod on the platform at once,
      # turning a recoverable stall into an outage plus a cold start.
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
