server:
  port: ${SERVER_PORT:8113}

spring:
  application:
    name: corebanking-connector

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}
    listener:
      simple:
        # No broker retry. The listener handles every failure and always acks; a redelivery loop
        # against a bank is the one failure mode nobody wants.
        retry:
          enabled: false
        # Low on purpose. Postings against one account serialise at the bank anyway, and a wide
        # pool would just queue threads inside a slow bank instead of inside the broker, where the
        # backlog is visible.
        concurrency: 2
        max-concurrency: 4

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  security:
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      # Read-only and secret-free. Not routed by the Gateway, like every other connector.
      - /api/connector/status

  outbox:
    exchange: delivery.events

  connector:
    settings-queue: connector.corebanking.settings
    settings-url: ${CONNECTOR_SETTINGS_URL:http://localhost:8109}

  corebanking:
    # SIMULATOR is the safe default: a wrong default that moves no real money beats one that does.
    default-provider: SIMULATOR
    cache-ttl: 5m
    # More attempts and a longer backoff than the notification channels. A late SMS is a poor
    # experience; an unsettled order is a reconciliation problem, so it is worth waiting longer on
    # a bank that is only slow.
    max-attempts: 4
    initial-backoff: 1s
    failure-rate-threshold: 50
    open-state-duration: 60s
    # Separate from notification.dlq: a stuck settlement and a stuck SMS need different people.
    dead-letter-queue: accounting.dlq

    simulator:
      base-url: ${COREBANKING_SIMULATOR_URL:http://localhost:8114}
      # Dev constant, matching the simulator. The real bank's credentials come from Vault at
      # secret/corebanking-connector, which Section 10 gives its own policy.
      api-key: ${BANK_API_KEY:simulator-dev-key}

    real:
      # All blank until the banking agreement exists. RealBankClient refuses every posting while
      # they are, loudly, rather than guessing at a contract.
      base-url: ${REAL_BANK_URL:}
      client-id: ${REAL_BANK_CLIENT_ID:}
      client-secret: ${REAL_BANK_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
