server:
  port: ${SERVER_PORT:8110}

  # Finish what is in flight before the process goes.
  #
  # Spring's default is immediate: on every rolling update and every node drain the outgoing pod
  # dropped whatever it was serving, and with one replica of each service there was nowhere else
  # for those requests to land. The pod is removed from the Service first, so this window is spent
  # draining rather than accepting.
  shutdown: graceful

spring:
  lifecycle:
    # Shorter than the pod's terminationGracePeriodSeconds, so the drain finishes on its own
    # terms rather than being cut off by SIGKILL.
    timeout-per-shutdown-phase: 20s

  application:
    name: email-connector

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}
    listener:
      simple:
        # No broker-level retry. WorkerDispatchService handles every failure itself and always
        # acks; letting the broker redeliver as well would double-send anything that succeeded
        # slowly.
        retry:
          enabled: false
        concurrency: 2
        max-concurrency: 8

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    # Password comes from Vault at secret/email-connector, never from here or from the settings
    # table (Section 8).
    username: ${SMTP_USER:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  security:
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      # Narrowed from /api/connector/** in the Phase 5 review: a wildcard would make any
      # endpoint later added under that prefix public by default. These are the only two the
      # worker needs, and neither is routed by the Gateway.
      - /api/connector/send
      - /api/connector/status
      # Phase 6: read-only "which provider would this id go to", for confirming a canary ramp
      # before it carries real traffic. Sends nothing and reveals no secret.
      - /api/connector/route/**

  outbox:
    exchange: delivery.events

  # The channel worker, merged in from the former mail-worker deployable.
  #
  # Setting both delivery.worker.channel and delivery.connector.type makes this one process consume
  # notification.dispatch.email AND own the SMTP credentials. Two JVMs became one; the code did not
  # change, only where it runs.
  #
  # connector-url points at THIS process. The worker still reaches the connector over HTTP rather
  # than calling the controller in-process, and that is deliberate: the timeout, the retry budget
  # and the circuit breaker in WorkerDispatchService are all defined in terms of an HTTP call. A
  # direct call would keep the code and quietly discard every one of those properties.
  #
  # WHAT THIS COSTS: the two used to fail independently. A wedged SMTP relay took out the connector
  # and left the worker consuming and dead-lettering; now one OOM stops both, and the SMTP
  # credentials sit in the same heap as template rendering.
  worker:
    channel: EMAIL
    connector-url: http://localhost:${SERVER_PORT:8110}
    max-attempts: 3
    initial-backoff: 500ms
    failure-rate-threshold: 50
    open-state-duration: 30s
    # Longer than the connector's own retry budget, and that ordering is the whole point.
    #
    # Two retry layers sit in series here: this worker retries the HTTP call, and the connector on
    # the far side of that call retries the provider. They protect different things and both should
    # exist — but if the outer timeout is SHORTER than the inner budget, the worker abandons every
    # slow call while the connector is still working, then retries it. One message became 9 provider
    # calls and 4 dead-letters, every time: 70 distinct notifications produced exactly 280
    # dead-letter events on dev in a day, and notification_log FAILED to notification.dlq stood at
    # exactly 4.00x.
    #
    # The budget below is the connector's worst case: 3 attempts x (5s connect + 10s read + 10s write) + 1.5s of backoff = 76.5s.
    # Waiting past it means this worker's own retry fires only when the connector genuinely failed
    # or could not be reached, which is what its javadoc always said it was for.
    connector-timeout: 90s
    dead-letter-queue: notification.dlq

  connector:
    type: EMAIL
    default-provider: SMTP
    settings-queue: connector.email.settings
    settings-url: ${CONNECTOR_SETTINGS_URL:http://localhost:8109}
    cache-ttl: 5m
    max-attempts: 3
    initial-backoff: 500ms
    failure-rate-threshold: 50
    open-state-duration: 30s
    dead-letter-queue: notification.dlq

  email:
    from: ${EMAIL_FROM:no-reply@delivery.local}
    # The display name on every message. Without it mail arrives from a bare no-reply address,
    # which reads as machine-generated and is the first thing a recipient judges.
    from-name: ${EMAIL_FROM_NAME:YouDrop}
    # Used by MailPreparer when a rendered template leaves the subject blank. A generic subject
    # reaches the customer; a rejected notification does not.
    default-subject: YouDrop
    # EmailHtmlLayout's branding. The colour is DeliveryColors.brand from the app's design tokens, so the two match.
    brand-name: ${EMAIL_BRAND_NAME:YouDrop}
    brand-colour: ${EMAIL_BRAND_COLOUR:#C41D4E}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
      # What "ready to take traffic" actually means.
      #
      # Spring's readiness group contains only readinessState by default, which says the context
      # finished starting and nothing more — so a pod whose connection pool has died reports Ready
      # and keeps being sent work. Naming the dependency it cannot serve without is the whole
      # point of the group.
      #
      # LIVENESS is deliberately left alone. A dependency belongs in readiness, never in liveness:
      # readiness takes a pod out of the Service until it recovers, while liveness kills it — so a
      # database blip with the two conflated would restart every pod on the platform at once,
      # turning a recoverable stall into an outage plus a cold start.
      group:
        readiness:
          include: readinessState
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
