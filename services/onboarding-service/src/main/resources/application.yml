server:
  port: ${SERVER_PORT:8117}

spring:
  application:
    name: onboarding-service

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=onboarding}
    username: ${DB_USER:onboarding_service}
    password: ${DB_PASSWORD:onboarding_service_dev_pw}
    hikari:
      # The engine holds a connection per running job as well as per request, so this needs a
      # little more headroom than a plain CRUD service.
      maximum-pool-size: 12
      minimum-idle: 3

  flyway:
    enabled: true
    locations: classpath:db/migration/onboarding
    schemas: onboarding
    default-schema: onboarding

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: onboarding
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

camunda:
  bpm:
    # The engine creates and upgrades its own ACT_* tables. Flyway owns everything else in this
    # schema; the two do not overlap, and letting Camunda manage its own is what makes an engine
    # version bump a dependency change rather than fifty hand-written migrations.
    database:
      schema-update: true
      table-prefix: onboarding.
    # Deployed from the classpath on boot. A changed BPMN file becomes a new version and running
    # instances finish on the version they started with — which is the property that lets a process
    # be edited while applications are mid-review.
    auto-deployment-enabled: true
    deployment-resource-pattern: classpath*:processes/*.bpmn
    # No engine-level authorisation. The only way into this engine is this service's own API, which
    # is BACKOFFICE-gated at the controller; a second permission model on top would be two places to
    # get the same answer from.
    authorization:
      enabled: false
    # No admin-user. It exists to seed a login for Camunda's own web apps, which are not on the
    # classpath — and the engine rejects an id containing a hyphen as "not a valid resource
    # identifier", which is a confusing way to be told about an account nothing can use.
    generic-properties:
      properties:
        # Job retries are what make a failed provisioning step recoverable rather than terminal.
        historyTimeToLive: P180D

delivery:
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9010}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9010}
      # From Vault in a deployment, same as every other service that stores objects. The
      # StorageAutoConfiguration is conditional on access-key being set, so a deployment that
      # forgets it does not get a half-working uploader — it gets a service that will not start.
      access-key: ${MINIO_ACCESS_KEY:delivery}
      secret-key: ${MINIO_SECRET_KEY:delivery123}
      # Short on purpose. Every one of these grants access to somebody's identity papers, so the
      # window in which a leaked URL is worth anything is measured in minutes.
      presign-ttl: 10m
      max-upload-size-bytes: 10485760
      # The platform's list is named for images and is shared by every purpose, so PDF has to be
      # added here for the documents step to work at all — a commercial registration arrives as a
      # PDF far more often than as a photograph.
      #
      # Note what is NOT on this list: image/svg+xml. SVG is script, and these objects are served
      # from the MinIO origin by presigned URL; an SVG "scan of a licence" would run in that origin
      # with the reviewer's session for it. The list is an allow-list precisely so that adding a
      # type is a decision somebody makes on purpose.
      allowed-image-content-types:
        - image/jpeg
        - image/png
        - image/webp
        - application/pdf

  security:
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      # Applying to join, and checking on your own application.
      #
      # The only write endpoint in the platform reachable with no token, and it has to be: a
      # prospective merchant has no account, because getting one is what they are asking for.
      # Nothing here reads or returns anybody else's data — the status lookup is keyed on a
      # 160-bit reference precisely because there is no caller identity to check it against.
      - /api/onboarding/applications
      - /api/onboarding/applications/by-reference/**
      # Choosing a passcode at the end of an application. Open for the same reason: the account it
      # creates is the one the caller would otherwise need in order to call this at all. The
      # reference in the path is what stands in for a token, and the address it belongs to was
      # already proved with a code. /applications/mine is deliberately NOT here — it is keyed on
      # the caller.
      - /api/onboarding/applications/*/account
      # Proving an address or a number belongs to you, which by definition happens before there is
      # an account to authenticate with. These two send real messages to addresses strangers type,
      # so the limits in VerificationService are what stand in for authentication here.
      - /api/onboarding/verifications
      - /api/onboarding/verifications/confirm
      # A shopper creating their own account. Open for the same reason as the two above and the
      # application endpoint: having an account is what is being asked for, so there is nothing to
      # authenticate with.
      #
      # What stands in for authentication is the verification token this endpoint requires and
      # spends. Without it — and it is worth stating plainly, because leaving this line off the
      # list is safe while removing that check is not — this would create Keycloak accounts on any
      # address a stranger typed.
      - /api/onboarding/signup
      # Forgot-password, open by the same necessity: the caller is somebody who cannot sign in.
      # What stands in for authentication is the one-time code sent to the account's own address,
      # with the same limits as the verification endpoints above. The request endpoint answers 202
      # for known and unknown addresses alike, so it cannot be used to enumerate accounts.
      - /api/onboarding/password-reset
      - /api/onboarding/password-reset/confirm

  onboarding:
    # Who gets in without a human deciding.
    #
    # The platform was built so every application waits for a reviewer. These turn that off per
    # kind, because growth and review pull against each other: a rider who applies on Friday
    # evening and is approved on Monday morning has usually signed up with somebody else by then.
    #
    # What is given up is real. With one of these on, the only thing between a stranger and a live
    # account is a verified email address — nobody reads the plate, nobody reads the commercial
    # registration. The papers are still collected and still visible in the backoffice; they are
    # simply no longer a gate. Approvals are recorded against system:auto-approval with whatever
    # was outstanding written beside them, so the record says so plainly.
    #
    # Per kind because the risks are not equal: a rider who is nobody wastes a delivery, a merchant
    # who is nobody takes money for food that never existed, and a carrier signs for a fleet and a
    # payout account.
    auto-approve:
      rider: ${AUTO_APPROVE_RIDER:false}
      merchant: ${AUTO_APPROVE_MERCHANT:false}
      carrier: ${AUTO_APPROVE_CARRIER:false}

    verification:
      # How long before the same address can be sent another code. Short enough not to punish
      # somebody whose first message went to spam, long enough that this is not a way to send
      # somebody a message every second.
      resend-cooldown: ${VERIFICATION_RESEND_COOLDOWN:60s}
      # And the ceiling for a whole day. Past this, an address is being used as a target rather
      # than being verified.
      daily-cap: ${VERIFICATION_DAILY_CAP:8}

    documents:
      # What the wizard's documents step accepts. Narrower than the storage list above is allowed;
      # wider is not, because StorageService checks its own list too and would refuse afterwards
      # with a message the applicant cannot act on.
      allowed-content-types: image/jpeg,image/png,image/webp,application/pdf

    payout:
      # Which PayoutAccountVerifier is in charge.
      #
      # DEV_CHECKSUM_ONLY is the only implementation that exists. It runs the ISO 7064 mod-97 check
      # and contacts no bank, because the platform has no payment-processor account to contact one
      # with — so no payout account here has been confirmed to exist or to belong to the applicant
      # named on it, and every row is stamped CHECKSUM_ONLY to keep that visible.
      #
      # When a processor is signed: add its verifier, set this to its name, and the rows that were
      # only ever arithmetic-checked are one query away (verified_by = 'DEV_CHECKSUM_ONLY').
      # An unknown name here fails startup rather than falling back — see PayoutVerifierRegistry.
      verifier: ${PAYOUT_VERIFIER:DEV_CHECKSUM_ONLY}

  keycloak:
    base-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
    realm: delivery-platform
    client-id: ${KEYCLOAK_CLIENT_ID:onboarding-service}
    # From Vault in a deployment. This service account can create users and register delivery
    # companies, which makes it the most powerful credential in the platform.
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}

  services:
    order-manager: ${ORDER_MANAGER_URL:http://localhost:8101}
    # Where one-time codes and decision messages are handed off. This service holds no SMTP or SMS
    # credentials of its own — one sending path for the platform, one delivery log to answer
    # "did it arrive" from.
    notifications-manager: ${NOTIFICATIONS_MANAGER_URL:http://localhost:8104}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
