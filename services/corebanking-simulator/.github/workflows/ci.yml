# CI for corebanking-simulator, and for corebanking-simulator alone.
#
# This service has no parent pom and no reactor: the com.delivery:platform-* jars it needs are
# resolved from GitHub Packages like any other third-party dependency, at the version pinned in
# pom.xml under <delivery.platform.version>. Nothing here rebuilds the platform from source, so a
# platform change reaches this service only when somebody bumps that property — deliberately.
#
# REQUIRED SECRETS (see docs/POLYREPO.md):
#   GH_PACKAGES_TOKEN  classic PAT with read:packages. The built-in GITHUB_TOKEN is scoped to THIS
#                      repository and cannot read packages published by delivery.platform, which is
#                      a different repository. This is the single most common reason the first
#                      build of a freshly split service fails with a 401 on platform-security.
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN    Docker Hub access token, not the account password.

name: corebanking-simulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: youssefsaleh0108/delivery-corebanking-simulator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          # The id must be "github" to match the <repository><id> in pom.xml, or Maven sends no
          # credentials and GitHub Packages answers 401.
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Build and test
        run: mvn -B verify
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'target/surefire-reports/*.xml'
          fail_on_failure: true

      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # The Dockerfile copies target/*.jar, so the Maven build above has to have run first. The
      # context is this directory because that is all the repository contains.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=corebanking-simulator
          cache-to: type=gha,mode=max,scope=corebanking-simulator

# Listens on 8114 — keep infra/docker-compose.yml and deploy/k8s in step with the Dockerfile.
