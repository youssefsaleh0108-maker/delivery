server:
  port: ${SERVER_PORT:8103}

  # Finish what is in flight before the process goes.
  #
  # Spring's default is immediate: on every rolling update and every node drain the outgoing pod
  # dropped whatever it was serving, and with one replica of each service there was nowhere else
  # for those requests to land. The pod is removed from the Service first, so this window is spent
  # draining rather than accepting.
  shutdown: graceful

  tomcat:
    threads:
      # Bounded, and bounded against the connection pool rather than left at Spring Boot's 200.
      #
      # Two hundred request threads in front of a pool of 10 is not concurrency, it is a queue
      # with a worse failure mode: 190 of them block on the pool, each holding a 512 KB stack in a
      # 512 Mi container, and a dependency that slows down converts directly into thread exhaustion
      # across EVERY endpoint on the service rather than just the slow one. Checkout makes 2N+2
      # sequential cross-service calls, so it is the one that gets there first — and the callers it
      # takes down with it are the rider job board and the merchant board.
      #
      # 40 is 4 per connection: enough that work needing no database keeps moving while
      # the pool is saturated, few enough that saturation is a queue at the door instead of a
      # thundering herd inside.
      max: 40
      min-spare: 5

spring:
  lifecycle:
    # Shorter than the pod's terminationGracePeriodSeconds, so the drain finishes on its own
    # terms rather than being cut off by SIGKILL.
    timeout-per-shutdown-phase: 20s

  application:
    name: product-service

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  # Datasource URL/username and the Flyway settings come from config-repo; the password comes from
  # Vault, composited into the same response (Section 6). The defaults below only exist so the
  # service can be run straight from an IDE against the compose Postgres.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=product}
    username: ${DB_USER:product_service}
    password: ${DB_PASSWORD:product_service_dev_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    # Order matters: the shared migrations (V1 outbox, V2 file_metadata) come from the platform
    # libraries' jars, this service's own start at V10.
    locations: classpath:db/migration/shared,classpath:db/migration/product
    schemas: product
    default-schema: product
    # The outbox library pins its migrations high (V50) so they sort after any service's own.
    # The cost surfaces on the FIRST service migration added after V50 has run: it sorts below the
    # schema's high-water mark and Flyway's default validation refuses to fill the gap — which
    # crash-looped this service in dev when V20–V22 landed. Out-of-order is the designed answer:
    # library space stays 50+, service space stays 1–49, and a new service migration in its own
    # range is applied even though a higher library version already ran. Renumbering service
    # migrations above 50 was rejected — it steals the library's next version and collides the
    # first time the library ships V51.
    out-of-order: true

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate refuses to boot if the entities have drifted from it,
      # which catches a forgotten migration at deploy time rather than at first query.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: product
        jdbc:
          time_zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  outbox:
    exchange: delivery.events
    relay-enabled: true

  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9010}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9010}
      access-key: ${MINIO_ACCESS_KEY:delivery}
      secret-key: ${MINIO_SECRET_KEY:delivery123}
      presign-ttl: 10m
      max-upload-size-bytes: 10485760

  catalog:
    max-images-per-product: 8

    cross-sell:
      # How many delivered baskets must contain both products before the "People Also Ordered" rail
      # will claim they go together. One is an anecdote; presenting it as a pattern would be a claim
      # about a population made from a single stranger's shopping trip. Raise it once there is
      # volume — the rail falls back to same-shelf suggestions, clearly labelled as such, either way.
      min-orders-together: 2

    # Merchant Blitz: shelf photos in, a draft catalogue out (CatalogScanService).
    scan:
      # FAKE is deterministic sample data that never leaves the pod; CLAUDE sends the photos to the
      # Claude API. Read per call, like the geocoding provider, so a Config Server change plus
      # /actuator/busrefresh switches it. CLAUDE with no ANTHROPIC_API_KEY in the pod's environment
      # answers with FAKE and says so on every scan it produces — the client labels those results
      # as samples, so a missing key can never pass for a working one.
      #
      # The key is NOT a property here and must not become one: the Anthropic SDK reads only the
      # process environment (or the anthropic.apiKey JVM property). On the cluster it comes from its
      # own anthropic-api Secret, which only this service's Deployment references — never
      # platform-secrets, which every service imports whole. See deploy/k3s/README.md.
      vision-provider: ${CATALOG_SCAN_VISION_PROVIDER:FAKE}

      # The cost and abuse guards. Every analysis is a paid call once CLAUDE is on.
      max-photos-per-scan: 6
      # Scans CREATED per merchant over a rolling 24 hours. Rolling rather than per calendar day so
      # the limit cannot be doubled by starting a burst at 23:59.
      max-scans-per-day: 5
      # A failed analysis can be retried, but not forever: a photo the provider refuses will be
      # refused again, and each attempt is billed.
      max-analysis-attempts: 2
      # The most lines one scan may produce. A shelf photo with hundreds of detections is a photo of
      # a warehouse, and the review screen is not the place to triage it.
      max-items-per-scan: 120
      # An analysis still marked ANALYZING after this long was lost with its pod; the merchant may
      # start another rather than wait on a job that no longer exists.
      stale-after: 10m

      claude:
        # Exact model id. Changing it is a deliberate act, reviewed like any other pricing change.
        # Adaptive thinking, structured output and server-side fallbacks ("fallbacks": "default",
        # beta server-side-fallback-2026-07-01) are always on — see ClaudeVisionProvider.
        model: claude-opus-5
        max-tokens: 16000
        # A shelf of photos with adaptive thinking takes tens of seconds; the SDK's own default is
        # tuned for chat. This runs on the scan executor, never on a request thread.
        #
        # Sized against stale-after above: the client makes at most two attempts (one retry), so
        # the worst case is two full timeouts plus backoff, which must stay under stale-after or the
        # merchant is told a scan was interrupted while it is still running. Raise one, check the
        # other. It also keeps the call inside the SDK's own ten-minute non-streaming guard.
        timeout: 240s
        # The long edge each photo is shrunk to before it is sent: 2236 px, chosen against what the
        # model reads. Claude Opus 5 reads images at high resolution — up to 2576 px on the long edge
        # and about 3.75 MP, some 4,784 image tokens at one token per 28 x 28 px patch — and resizes
        # anything larger itself. A phone's 4:3 photo reaches that area at 2236 x 1677, so this is the
        # most of a camera photo the model can use: larger only adds upload and resize time for no
        # more detail, smaller blurs the small print on packaging that tells a 1 L bottle from a
        # 1.5 L one. The phone's camera is asked for 2400 px, so the server only ever shrinks.
        #
        # The cost, at Opus 5's $5 per million input tokens: about 4,780 tokens a photo, so a full
        # six-photo scan sends about 28,700 image tokens — about $0.14 an attempt, against about
        # 2,350 tokens a photo and $0.07 an attempt at the 1568 px this was before. At the caps above
        # (five scans a day, two attempts each) that is at most about $1.44 a merchant a day in
        # photos, before the prompt and the answer (up to max-tokens, at $25 per million).
        max-long-edge-px: 2236

  product:
    # How long a merchant's power declaration (mains, generator, dark) is shown to customers as what
    # the lights are doing NOW: the "Generator active" badge and its age, the dimmed dark shop, and the
    # neighbourhood browse's "On generator now" filter. Past it the declaration is still stored and
    # still shown to its merchant; customers are just not told it is happening now. Power can change
    # several times a day and nothing expires a declaration by itself, so four hours keeps one made at
    # opening from being claimed at dinner. See StoreService#powerDeclarationFreshFor.
    power-declaration-fresh-for: 4h

    services:
      # Which service categories are open in the services marketplace. An open category is offered
      # to providers setting up a shop and shown to customers wherever service shops are listed. A
      # category left out can neither be chosen nor shown; a shop already in it keeps its category
      # and is simply not listed.
      #
      # The taxonomy is Store.ServiceCategory: PRINTING, TAILORING, REPAIRS, PHOTOGRAPHY, CLEANING,
      # BEAUTY, TUTORING. Cleaning, Beauty and Tutoring are appointments at the customer's place,
      # which the order flow does not model yet, so they launch closed (owner default 1 in
      # docs/figma-services-designs.md).
      #
      # Read per call (ServiceCategories), so a Config Server change plus /actuator/busrefresh opens
      # one without a redeploy. A name that is not a category fails the services reads loudly rather
      # than hiding a category nobody meant to close; goods reads never read this.
      enabled-categories: PRINTING,TAILORING,REPAIRS,PHOTOGRAPHY

  geocoding:
    # Which geocoder answers. NOMINATIM is free and keyless and is what runs today; MAPBOX is
    # written, has never made a successful call, and refuses everything until somebody provisions a
    # token. Read at every call rather than captured at startup, so a Config Server change plus
    # /actuator/busrefresh switches it without a redeploy.
    provider: ${GEOCODING_PROVIDER:NOMINATIM}

    cache:
      # A street does not move and the underlying OSM data changes on a scale of months, so a short
      # TTL would spend the rate budget re-confirming answers that were never going to differ.
      ttl: 30d
      # Housekeeping only. Nothing sweeps automatically — see GeocodeCache#evictStale for why an
      # @Scheduled sweep would run once per replica.
      evict-after: 180d

    nominatim:
      base-url: https://nominatim.openstreetmap.org

      # DELIBERATELY EMPTY, AND THE SERVICE REFUSES TO GEOCODE UNTIL IT IS SET.
      #
      # Nominatim's usage policy requires a User-Agent identifying the application, with a contact
      # behind it, and blocks applications that omit one. That contact belongs to whoever runs this
      # deployment, not to this repository, so shipping a plausible default here would put somebody
      # else's name on the operator's traffic. Set it to something like:
      #
      #   YouDrop/1.0 (ops@example.com)
      #
      # See NominatimGeocodingProvider for the rest of the policy and which parts are enforced here.
      user-agent: ${NOMINATIM_USER_AGENT:}

      # Optional. Biases the language of returned labels, e.g. "ar,en".
      accept-language: ${NOMINATIM_ACCEPT_LANGUAGE:}

      # The policy's absolute maximum for the public endpoint is one request per second. Enforced by
      # MinIntervalRateLimiter in front of every call, including the ones that fail — a failed
      # request costs the endpoint the same as a successful one.
      #
      # This bounds ONE JVM. The policy's limit is per application, so more than one replica pointed
      # at the public endpoint exceeds it. The cache is what keeps real traffic far below the limit.
      min-interval: 1s

      # Bounds how long an address lookup can hold a request thread. The default RestClient factory
      # has none at all, and this is on an interactive path: an outage with no read timeout parks a
      # servlet thread per attempt until the pool is gone and the rest of the catalog stops
      # answering too.
      timeout: 5s

    mapbox:
      base-url: https://api.mapbox.com
      # No token, and no default. It comes from Vault through the Config Server like every other
      # vendor credential on this platform. Until it is set, selecting MAPBOX makes every geocoding
      # request fail loudly rather than half-work.
      access-token: ${MAPBOX_ACCESS_TOKEN:}
      # Optional ISO 3166-1 alpha-2 bias, e.g. "lb". Markedly better matches for a bare street name
      # in a single-market marketplace.
      country: ${MAPBOX_COUNTRY:}
      timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh,busrefresh
  endpoint:
    health:
      probes:
        enabled: true
      # What "ready to take traffic" actually means.
      #
      # Spring's readiness group contains only readinessState by default, which says the context
      # finished starting and nothing more — so a pod whose connection pool has died reports Ready
      # and keeps being sent work. Naming the dependency it cannot serve without is the whole
      # point of the group.
      #
      # LIVENESS is deliberately left alone. A dependency belongs in readiness, never in liveness:
      # readiness takes a pod out of the Service until it recovers, while liveness kills it — so a
      # database blip with the two conflated would restart every pod on the platform at once,
      # turning a recoverable stall into an outage plus a cold start.
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
