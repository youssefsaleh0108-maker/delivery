server:
  port: ${SERVER_PORT:8103}

spring:
  application:
    name: product-service

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  # Datasource URL/username and the Flyway settings come from config-repo; the password comes from
  # Vault, composited into the same response (Section 6). The defaults below only exist so the
  # service can be run straight from an IDE against the compose Postgres.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/delivery?currentSchema=product}
    username: ${DB_USER:product_service}
    password: ${DB_PASSWORD:product_service_dev_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    # Order matters: the shared migrations (V1 outbox, V2 file_metadata) come from the platform
    # libraries' jars, this service's own start at V10.
    locations: classpath:db/migration/shared,classpath:db/migration/product
    schemas: product
    default-schema: product

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate refuses to boot if the entities have drifted from it,
      # which catches a forgotten migration at deploy time rather than at first query.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: product
        jdbc:
          time_zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  outbox:
    exchange: delivery.events
    relay-enabled: true

  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9010}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9010}
      access-key: ${MINIO_ACCESS_KEY:delivery}
      secret-key: ${MINIO_SECRET_KEY:delivery123}
      presign-ttl: 10m
      max-upload-size-bytes: 10485760

  catalog:
    max-images-per-product: 8

    cross-sell:
      # How many delivered baskets must contain both products before the "People Also Ordered" rail
      # will claim they go together. One is an anecdote; presenting it as a pattern would be a claim
      # about a population made from a single stranger's shopping trip. Raise it once there is
      # volume — the rail falls back to same-shelf suggestions, clearly labelled as such, either way.
      min-orders-together: 2

  geocoding:
    # Which geocoder answers. NOMINATIM is free and keyless and is what runs today; MAPBOX is
    # written, has never made a successful call, and refuses everything until somebody provisions a
    # token. Read at every call rather than captured at startup, so a Config Server change plus
    # /actuator/busrefresh switches it without a redeploy.
    provider: ${GEOCODING_PROVIDER:NOMINATIM}

    cache:
      # A street does not move and the underlying OSM data changes on a scale of months, so a short
      # TTL would spend the rate budget re-confirming answers that were never going to differ.
      ttl: 30d
      # Housekeeping only. Nothing sweeps automatically — see GeocodeCache#evictStale for why an
      # @Scheduled sweep would run once per replica.
      evict-after: 180d

    nominatim:
      base-url: https://nominatim.openstreetmap.org

      # DELIBERATELY EMPTY, AND THE SERVICE REFUSES TO GEOCODE UNTIL IT IS SET.
      #
      # Nominatim's usage policy requires a User-Agent identifying the application, with a contact
      # behind it, and blocks applications that omit one. That contact belongs to whoever runs this
      # deployment, not to this repository, so shipping a plausible default here would put somebody
      # else's name on the operator's traffic. Set it to something like:
      #
      #   YouDrop/1.0 (ops@example.com)
      #
      # See NominatimGeocodingProvider for the rest of the policy and which parts are enforced here.
      user-agent: ${NOMINATIM_USER_AGENT:}

      # Optional. Biases the language of returned labels, e.g. "ar,en".
      accept-language: ${NOMINATIM_ACCEPT_LANGUAGE:}

      # The policy's absolute maximum for the public endpoint is one request per second. Enforced by
      # MinIntervalRateLimiter in front of every call, including the ones that fail — a failed
      # request costs the endpoint the same as a successful one.
      #
      # This bounds ONE JVM. The policy's limit is per application, so more than one replica pointed
      # at the public endpoint exceeds it. The cache is what keeps real traffic far below the limit.
      min-interval: 1s

      # Bounds how long an address lookup can hold a request thread. The default RestClient factory
      # has none at all, and this is on an interactive path: an outage with no read timeout parks a
      # servlet thread per attempt until the pool is gone and the rest of the catalog stops
      # answering too.
      timeout: 5s

    mapbox:
      base-url: https://api.mapbox.com
      # No token, and no default. It comes from Vault through the Config Server like every other
      # vendor credential on this platform. Until it is set, selecting MAPBOX makes every geocoding
      # request fail loudly rather than half-work.
      access-token: ${MAPBOX_ACCESS_TOKEN:}
      # Optional ISO 3166-1 alpha-2 bias, e.g. "lb". Markedly better matches for a bare street name
      # in a single-market marketplace.
      country: ${MAPBOX_COUNTRY:}
      timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh,busrefresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
