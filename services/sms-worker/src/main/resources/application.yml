server:
  port: ${SERVER_PORT:8107}

spring:
  application:
    name: sms-worker

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}
    listener:
      simple:
        # No broker-level retry. WorkerDispatchService handles every failure itself and always
        # acks; letting the broker redeliver as well would double-send anything that succeeded
        # slowly, and for SMS that is a second billed message.
        retry:
          enabled: false
        # Concurrency is per-channel, which is the point of one worker per channel: SMS can be
        # scaled for its own throughput without touching email or push.
        concurrency: 2
        max-concurrency: 8

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  outbox:
    exchange: delivery.events

  worker:
    channel: SMS
    connector-url: ${SMS_CONNECTOR_URL:http://localhost:8112}
    max-attempts: 3
    initial-backoff: 500ms
    failure-rate-threshold: 50
    open-state-duration: 30s
    connector-timeout: 10s
    dead-letter-queue: notification.dlq

  sms:
    # Above this the message is rejected rather than truncated - vendors bill per segment, and a
    # template that needs four of them is a template bug, not a delivery problem.
    max-segments: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
