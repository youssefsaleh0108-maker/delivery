server:
  port: ${SERVER_PORT:8111}

spring:
  application:
    name: push-connector

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}
    listener:
      simple:
        # No broker-level retry. WorkerDispatchService handles every failure itself and always
        # acks; letting the broker redeliver as well would double-send anything that succeeded
        # slowly.
        retry:
          enabled: false
        # Higher than the other two: push is the highest-volume channel and FCM is the fastest
        # provider, so throughput here is bounded by concurrency rather than by the vendor.
        concurrency: 4
        max-concurrency: 16

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  security:
    permit-all:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      # Narrowed from /api/connector/** in the Phase 5 review: a wildcard would make any
      # endpoint later added under that prefix public by default. These are the only two the
      # worker needs, and neither is routed by the Gateway.
      - /api/connector/send
      - /api/connector/status
      # Phase 6: read-only "which provider would this id go to", for confirming a canary ramp
      # before it carries real traffic. Sends nothing and reveals no secret.
      - /api/connector/route/**

  outbox:
    exchange: delivery.events

  # The channel worker, merged in from the former push-worker deployable. Setting both
  # delivery.worker.channel and delivery.connector.type makes this one process consume
  # notification.dispatch.push AND hold the Firebase credentials. See the email connector for the
  # full reasoning; the trade is the same one.
  #
  # connector-url points at THIS process on purpose — the worker's timeout, retry budget and
  # circuit breaker are all defined in terms of an HTTP call, and calling the controller directly
  # would keep the code while silently discarding every one of them.
  worker:
    channel: PUSH
    connector-url: http://localhost:${SERVER_PORT:8111}
    max-attempts: 3
    initial-backoff: 500ms
    failure-rate-threshold: 50
    open-state-duration: 30s
    connector-timeout: 10s
    dead-letter-queue: notification.dlq

  connector:
    type: PUSH
    # DEV_LOG until a Firebase project exists. Switching to FIREBASE is a Backoffice change, and
    # the client is already deployed - see PushConnectorApplication for why it ships either way.
    default-provider: DEV_LOG
    settings-queue: connector.push.settings
    settings-url: ${CONNECTOR_SETTINGS_URL:http://localhost:8109}
    cache-ttl: 5m
    max-attempts: 3
    initial-backoff: 500ms
    failure-rate-threshold: 50
    open-state-duration: 30s
    dead-letter-queue: notification.dlq

  push:
    # Used by PushPreparer. Must match the scheme the mobile app registers for deep links.
    deep-link-prefix: delivery://orders/
    firebase:
      # Comes from Vault at secret/push-connector. Empty here on purpose: a service-account JSON in
      # the config repo would be a credential in Git.
      service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
