server:
  port: ${SERVER_PORT:8105}

spring:
  application:
    name: mail-worker

  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USER:config}
      password: ${CONFIG_SERVER_PASSWORD:local-config-secret}
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:delivery}
    password: ${RABBITMQ_PASSWORD:delivery}
    listener:
      simple:
        # See sms-worker: the dispatch service handles every failure and always acks, so broker
        # redelivery on top would double-send anything that succeeded slowly.
        retry:
          enabled: false
        concurrency: 2
        max-concurrency: 8

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/delivery-platform}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/delivery-platform/protocol/openid-connect/certs}

delivery:
  outbox:
    exchange: delivery.events

  worker:
    channel: EMAIL
    connector-url: ${EMAIL_CONNECTOR_URL:http://localhost:8110}
    max-attempts: 3
    initial-backoff: 500ms
    failure-rate-threshold: 50
    open-state-duration: 30s
    # Longer than SMS: an SMTP handshake plus DATA is slower than an HTTP API call, and cutting it
    # short would classify successful sends as timeouts.
    connector-timeout: 20s
    dead-letter-queue: notification.dlq

  email:
    default-subject: Delivery

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: '%5p [${spring.application.name},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]'
